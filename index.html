<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd3f7">
<title>유주 놀이터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sea1:#c4f1ff;--sea2:#86d4f6;--sea3:#55b4e6;--ink:#2b3a55;--pink:#ff8fb1;--yellow:#ffd65a;--green:#5ccf95;--purple:#b8a6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sea1),var(--sea2) 55%,var(--sea3));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;pointer-events:none}
/* 그림 자체를 누르는 것들은 다시 누를 수 있게 (그림자 놀이 친구, 생일 친구·선물, 목욕 오리) */
img.shf,img.ckfr,img.baduck{pointer-events:auto}

/* 배경 거품 */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bub{position:absolute;bottom:-80px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.35) 30%,rgba(255,255,255,.08) 70%);
  border:2px solid rgba(255,255,255,.65);animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-120vh)}}

.screen{position:fixed;inset:0;display:none;z-index:1}
.screen.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:max(14px,2.2vmin);z-index:60;pointer-events:none}
.rbtn{pointer-events:auto;width:clamp(58px,9vmin,86px);height:clamp(58px,9vmin,86px);border-radius:50%;border:none;background:#fff;
  box-shadow:0 6px 0 rgba(30,90,140,.18);font-size:clamp(28px,4.6vmin,44px);display:grid;place-items:center;transition:transform .1s}
.rbtn:active{transform:scale(.94);box-shadow:0 2px 0 rgba(30,90,140,.18)}
.rbtn.off{opacity:.6}
.musicBtn{position:relative}
#ver{position:absolute;right:max(12px,2vmin);bottom:max(8px,1.4vmin);font-size:clamp(12px,1.8vmin,16px);color:rgba(255,255,255,.85);pointer-events:none}
.musicBtn.off::after{content:'';position:absolute;left:16%;right:16%;top:calc(50% - 3px);height:6px;border-radius:6px;background:#ff5a6e;transform:rotate(-40deg)}
#toast{position:fixed;left:50%;top:max(18px,3vmin);transform:translate(-50%,-150%);z-index:200;pointer-events:none;background:rgba(43,58,85,.88);color:#fff;
  padding:1.4vmin 3.2vmin;border-radius:99px;font-size:clamp(16px,2.8vmin,26px);white-space:nowrap;transition:transform .3s ease}
#toast.on{transform:translate(-50%,0)}

/* 홈 */
.homeWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin}
.title{font-size:clamp(40px,9.5vmin,110px);color:#fff;letter-spacing:.04em;font-weight:400;
  text-shadow:0 .07em 0 #3a9fd6,0 .12em .2em rgba(0,60,120,.25);animation:bob 3s ease-in-out infinite}
.title span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2vmin)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-2vmin) rotate(-4deg)}}
.menu{display:grid;grid-template-columns:repeat(3,auto);gap:3.6vmin 4vmin;justify-content:center;padding:0 16px}
.homeWrap{gap:4vmin}
.card{position:relative;width:clamp(116px,21vmin,220px);aspect-ratio:1;border:none;border-radius:13%;background:#fff;
  box-shadow:0 1.4vmin 0 var(--c),0 2.2vmin 3vmin rgba(0,60,120,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;
  transition:transform .12s}
.card:active{transform:scale(.97)}
.card .ic{font-size:clamp(48px,9.5vmin,96px);line-height:1}
.card b{font-weight:400;font-size:clamp(20px,4.2vmin,42px)}
.card.soon{opacity:.82}
.card i{position:absolute;top:-1.6vmin;right:-1.6vmin;font-style:normal;background:var(--c);color:#fff;padding:.6vmin 1.6vmin;border-radius:99px;
  font-size:clamp(14px,2.4vmin,22px);transform:rotate(8deg);box-shadow:0 .5vmin 0 rgba(0,0,0,.08)}
.wig{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}

.lane{position:absolute;bottom:6vmin;left:0;width:100%;height:20vmin;pointer-events:none}
.lane .swim{position:absolute;left:0;top:0;width:20vmin;animation:swim 16s linear infinite}
.lane .swim img{width:100%;animation:bob 1.6s ease-in-out infinite}
@keyframes swim{from{transform:translateX(-25vmin)}to{transform:translateX(calc(100vw + 5vmin))}}

/* 그림 고르기 */
.selWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;padding:12vmin 16px 4vmin}
.subtitle{font-weight:400;font-size:clamp(30px,6.5vmin,64px);color:#fff;text-shadow:0 .08em 0 #3a9fd6}
.picGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:3vmin;max-width:100vmin}
.pic{position:relative;width:clamp(110px,17vmin,180px);aspect-ratio:1;border:none;border-radius:14%;background:#fff;padding:1vmin;
  box-shadow:0 1.1vmin 0 rgba(30,90,140,.2);transition:transform .12s}
.pic:active{transform:scale(.94)}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:11%;display:block}
.pic b{position:absolute;left:50%;bottom:-1.8vmin;transform:translateX(-50%);background:var(--yellow);font-weight:400;
  font-size:clamp(18px,3.2vmin,30px);padding:.3vmin 2vmin;border-radius:99px;white-space:nowrap}
.pic.add{background:rgba(255,255,255,.55);border:.6vmin dashed #fff;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(40px,8vmin,80px);color:#fff}
.pic.add small{font-size:clamp(16px,2.8vmin,26px)}
.pic .del{position:absolute;top:-1.4vmin;right:-1.4vmin;width:clamp(28px,4.4vmin,40px);height:clamp(28px,4.4vmin,40px);border-radius:50%;
  background:#ff6b8b;color:#fff;font-size:clamp(18px,3vmin,28px);display:grid;place-items:center}
.pieceRow{display:flex;gap:2.4vmin;background:rgba(255,255,255,.45);padding:1.6vmin 2.4vmin;border-radius:99px}
.pbtn{border:none;background:#fff;border-radius:2.4vmin;padding:1.2vmin 1.6vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;
  box-shadow:0 .7vmin 0 rgba(30,90,140,.16);opacity:.75}
.pbtn.sel{background:var(--yellow);opacity:1;transform:translateY(-.4vmin)}
.pbtn .mini{display:grid;gap:3px;width:clamp(34px,5.6vmin,52px);height:clamp(34px,5.6vmin,52px)}
.pbtn .mini i{background:var(--sea3);border-radius:3px}
.pbtn .mini.sil i{background:#2f4a7a;border-radius:50% 50% 40% 40%;opacity:.55}
.optRows{display:flex;gap:2.4vmin;flex-wrap:wrap;justify-content:center}
.pbtn .mini.shp{display:grid;place-items:center}
.pbtn .mini.shp svg{width:100%;height:100%;fill:var(--sea3)}
.pbtn .mini.shp .dice{font-size:clamp(26px,4.4vmin,40px);line-height:1}
.pbtn small{font-size:clamp(13px,2.1vmin,20px)}

/* 게임 */
#stage{position:absolute;inset:0;overflow:hidden}
.board{position:absolute;border-radius:2.2vmin}
.board.grid{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 .6vmin rgba(255,255,255,.85)}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board.grid canvas{border-radius:2.2vmin}
.board .full{display:none}
.board.cheer{background:none;box-shadow:none;animation:cheer 1.1s ease-in-out infinite}
.board.cheer .full{display:block}
.board.cheer .guide{display:none}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-4%) scale(1.03,.98)}55%{transform:translateY(0) scale(1.02,.97)}}
.piece{position:absolute;touch-action:none;filter:drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.28));transition:transform .15s;animation:popsoft .3s}
.piece.grid{border-radius:1.2vmin}
.piece.hold{transform:scale(1.07);filter:drop-shadow(0 2vmin 1.6vmin rgba(0,50,100,.3))}
.piece.locked{transition:left .22s ease-out,top .22s ease-out;filter:none;border-radius:0}
.piece.hint{animation:hint 1s}
.piece.back{transition:left .4s cubic-bezier(.3,1.35,.5,1),top .4s cubic-bezier(.3,1.35,.5,1),transform .15s}
.slotHint{position:absolute;z-index:3;pointer-events:none;border-radius:1.2vmin;background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 .8vmin #fff,0 0 3vmin 1vmin rgba(255,255,255,.9);animation:slotHint 1.6s ease-out forwards}
.board.charb .guide{filter:drop-shadow(0 0 .35vmin #fff) drop-shadow(0 0 .35vmin #fff)}
.piece.charp{filter:drop-shadow(0 0 .25vmin #fff) drop-shadow(0 0 .25vmin #fff) drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.28))}
.piece.charp.hold{filter:drop-shadow(0 0 .25vmin #fff) drop-shadow(0 0 .25vmin #fff) drop-shadow(0 2vmin 1.6vmin rgba(0,50,100,.3))}
.piece.charp.locked{filter:none}
.slotHint.shaped{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 0 1.2vmin #fff)}
@keyframes slotHint{0%,30%,60%{opacity:1}15%,45%{opacity:.25}100%{opacity:0}}
@keyframes popin{from{transform:scale(0)}70%{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes popsoft{from{transform:scale(.7)}70%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes hint{0%,100%{transform:none}20%{transform:rotate(-7deg) scale(1.06)}40%{transform:rotate(7deg) scale(1.06)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}

#stage.enter{animation:slideIn .3s ease-out}
#stage.leave{animation:slideOut .45s ease-in forwards}
@keyframes slideIn{from{transform:translateX(6vw);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(-30vw);opacity:0}}

/* 그림 그리기 */
.dwrap{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:1.8vmin;padding:max(12px,1.8vmin) max(14px,2.2vmin)}
.dtop{grid-column:1/-1;display:flex;align-items:center;gap:1.8vmin}
.dtop .sp{flex:1}
.dtop .rbtn{border-radius:2.6vmin}
.tools{display:flex;flex-direction:column;gap:1.5vmin;justify-content:center}
.colors{display:grid;grid-template-columns:repeat(2,auto);align-content:center;gap:1.6vmin}
.paperBox{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.paper{position:relative;background:#fff;border-radius:2vmin;overflow:hidden;touch-action:none;
  box-shadow:0 1vmin 0 rgba(30,90,140,.18),0 2vmin 4vmin rgba(0,60,120,.15)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lineCv{pointer-events:none}
.tbtn{position:relative;width:clamp(56px,10vmin,92px);height:clamp(56px,10vmin,92px);border:none;border-radius:2.6vmin;background:#fff;
  font-size:clamp(28px,5.6vmin,52px);box-shadow:0 .7vmin 0 rgba(30,90,140,.18);display:grid;place-items:center;transition:transform .12s,background .12s}
.tbtn.sel{background:var(--yellow);transform:scale(1.1)}
.tbtn .bar{position:absolute;left:18%;right:18%;bottom:9%;height:12%;border-radius:99px;background:var(--cc)}
.tbtn img{width:72%;height:72%;object-fit:contain}
.tbtn .dot{border-radius:50%;background:var(--ink)}
.cbtn{width:clamp(44px,7.6vmin,70px);height:clamp(44px,7.6vmin,70px);border-radius:50%;border:.6vmin solid #fff;background:var(--c);
  box-shadow:0 .6vmin 0 rgba(0,0,0,.12);transition:transform .12s}
.cbtn.sel{transform:scale(1.2);box-shadow:0 0 0 .5vmin var(--c),0 .8vmin 0 rgba(0,0,0,.12)}
.overlay{position:absolute;inset:0;z-index:90;background:rgba(25,70,120,.45);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex;animation:fadein .25s}
.ovBox{background:rgba(255,255,255,.9);border-radius:4vmin;padding:3vmin 4vmin 4vmin;display:flex;flex-direction:column;align-items:center;gap:3vmin;max-height:100%;overflow:auto}
.ovBox h3{font-weight:400;font-size:clamp(24px,5vmin,48px)}
.ovGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4vmin;max-width:94vmin}
.ovGrid .pic{width:clamp(96px,15vmin,160px)}
.ovGrid .pic.blank{display:grid;place-items:center;font-size:clamp(18px,3vmin,28px);color:#9ab}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (orientation:portrait){
  .dwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  .paperBox{grid-row:2}.tools{grid-row:3;flex-direction:row;justify-content:center;flex-wrap:wrap}
  .colors{grid-row:4;grid-template-columns:repeat(5,auto);justify-content:center}
}

/* 옷입히기 */
#dress{background:linear-gradient(180deg,#ffe6f1,#ffd0e4 60%,#ffc0da)}
.dsWrap{position:absolute;inset:0;display:grid;grid-template-columns:44% 1fr;gap:2vmin;padding:max(14px,2.2vmin);padding-top:max(14px,2.2vmin)}
.dollStage{position:relative;min-height:0;overflow:hidden;border-radius:4vmin;
  background:radial-gradient(ellipse at 50% 35%,#fff 0,rgba(255,255,255,.7) 35%,rgba(255,255,255,0) 70%)}
.floor{position:absolute;left:12%;right:12%;bottom:3%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#ffadc9 0,rgba(255,173,201,0) 70%)}
.doll{position:absolute;inset:2% 4% 2%}
.doll svg{width:100%;height:100%;display:block;animation:sway 4s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.doll.hop svg{animation:hop2 .6s ease}
@keyframes hop2{0%,100%{transform:none}35%{transform:translateY(-5%) scale(1.02,.98)}65%{transform:translateY(0) scale(1.03,.97)}}
.doll .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.doll g.pop{animation:pop .55s ease;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fh{position:absolute;bottom:-8%;color:#fff;font-size:clamp(20px,4vmin,40px);opacity:.8;animation:floatUp 7s linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.closet{display:flex;flex-direction:column;gap:2vmin;min-height:0;background:rgba(255,255,255,.65);border-radius:4vmin;padding:2.4vmin;margin-top:clamp(64px,10.5vmin,100px)}
.dtabs{display:flex;gap:1.6vmin;justify-content:center}
.dtab{width:clamp(56px,10vmin,90px);height:clamp(56px,10vmin,90px);border:none;border-radius:2.6vmin;background:#fff;font-size:clamp(28px,5.4vmin,50px);
  box-shadow:0 .7vmin 0 rgba(200,80,130,.18);display:grid;place-items:center;transition:transform .12s}
.dtab.sel{background:#ff8fb8;transform:translateY(-.6vmin) scale(1.06)}
.ditems{flex:1;min-height:0;overflow:hidden;touch-action:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;align-content:start;padding:1vmin}
.ditem{touch-action:none}
.ditem.lift svg{opacity:.25}
.dragItem{position:fixed;left:0;top:0;z-index:120;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 1.4vmin 1.2vmin rgba(150,40,90,.3))}
.dragItem svg{width:100%;height:100%;display:block;overflow:visible}
.dollStage{transition:box-shadow .2s}
.dollStage.near{box-shadow:inset 0 0 0 1vmin rgba(255,255,255,.95),inset 0 0 6vmin rgba(255,143,184,.55)}
.ditem{position:relative;aspect-ratio:1;border:none;border-radius:3vmin;background:#fff;box-shadow:0 .8vmin 0 rgba(200,80,130,.15);padding:.8vmin;transition:transform .12s}
.ditem:active{transform:scale(.93)}
.ditem svg{width:100%;height:100%;display:block}
.ditem.on{box-shadow:0 0 0 .7vmin #ff6b9a,0 .8vmin 0 rgba(200,80,130,.15)}
.ditem.on::after{content:'♥';position:absolute;top:-1.2vmin;right:-1.2vmin;width:4.4vmin;height:4.4vmin;border-radius:50%;background:#ff6b9a;color:#fff;
  display:grid;place-items:center;font-size:2.6vmin}
.dacts{display:flex;justify-content:center;gap:3vmin}
.abtn{border:none;background:var(--c);color:#fff;border-radius:99px;padding:1vmin 3vmin;font-size:clamp(26px,4.6vmin,44px);display:flex;align-items:center;gap:1vmin;
  box-shadow:0 .8vmin 0 rgba(0,0,0,.12)}
.abtn small{font-size:clamp(16px,2.8vmin,26px)}
.abtn:active{transform:scale(.95)}
@media (orientation:portrait){
  .dsWrap{grid-template-columns:1fr;grid-template-rows:52% 1fr;padding-top:clamp(70px,11vmin,100px)}
  .closet{margin-top:0}
  .ditems{grid-template-columns:repeat(4,1fr)}
}

/* 공통 */
.area{position:absolute;inset:0;overflow:hidden}
.stars{display:flex;gap:.5vmin;align-self:center;font-size:clamp(20px,4.2vmin,40px);color:rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,60,120,.15)}
.stars .on{color:#ffd65a;animation:pop .45s}

/* 비눗방울 */
.bb{position:absolute;bottom:0;touch-action:none;animation:bbRise var(--dur) linear forwards}
@keyframes bbRise{from{transform:translateY(100%)}to{transform:translateY(calc(-1 * var(--rise)))}}
.bbw{position:absolute;inset:0;border-radius:50%;animation:bbWob 3s ease-in-out infinite;
  background:radial-gradient(circle at 30% 27%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.25) 20%,rgba(200,240,255,.15) 55%,rgba(255,190,235,.35) 84%,rgba(255,255,255,.75) 100%);
  box-shadow:inset 0 0 2vmin rgba(255,255,255,.8),0 0 1.2vmin rgba(255,255,255,.45)}
.bbw img{position:absolute;left:16%;top:16%;width:68%;height:68%}
@keyframes bbWob{0%,100%{transform:translateX(-7%) scale(1,1)}25%{transform:translateX(0) scale(1.04,.96)}50%{transform:translateX(7%)}75%{transform:translateX(0) scale(.96,1.04)}}
.bbChar{position:fixed;z-index:50;pointer-events:none;animation:bbOut 1.1s ease-in forwards}
@keyframes bbOut{0%{transform:scale(1)}25%{transform:translateY(-30%) scale(1.3) rotate(-10deg)}100%{transform:translateY(70vh) scale(1) rotate(30deg);opacity:0}}

/* 까꿍 */
.spot{position:absolute;animation:popin .5s backwards;touch-action:none}
.spot .obj{position:absolute;inset:0;z-index:2;transform-origin:50% 100%}
.spot .obj svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.18))}
.spot .hider{position:absolute;left:22%;top:32%;width:56%;height:56%;z-index:1;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.spot.peekHint .hider{animation:peekUp 1.3s ease-in-out}
.spot.peekHint .obj{animation:wig .6s .15s}
@keyframes peekUp{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-40%)}}
.spot.found .hider{transform:translateY(-95%) scale(1.35);z-index:3}
.spot.found .obj{animation:squash .5s}
.spot.nope .obj{animation:lift .7s}
/* 여러 단계에서 같이 쓰는 친구 (톡 하면 폴짝) */
.pal2{position:absolute;z-index:3;touch-action:none}
.pal2 img{width:100%;height:100%;object-fit:contain;display:block;animation:breathe 2.4s ease-in-out infinite;transform-origin:50% 90%;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.22))}
.pal2.jump img{animation:keyJump .5s ease-out}
.pkcam{position:absolute;z-index:4;touch-action:none;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.25))}
.pkcam img{width:100%;height:100%;object-fit:contain;display:block}
.pkcam.glow{animation:hint 1.2s ease-in-out infinite}
.pkcam.glow img{filter:drop-shadow(0 0 1.2vmin #fff) drop-shadow(0 0 2.6vmin #fff8b0)}
.pkflash{position:absolute;inset:0;z-index:20;background:#fff;pointer-events:none;animation:flash .7s ease-out forwards}

/* ===== 스티커 / 내 바다 ===== */
.menu{display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(4 * clamp(116px,21vmin,220px) + 3 * 4vmin + 34px)}

.stk.swim{animation:stkSwim 3.2s ease-in-out infinite}

.stk.jump{animation:stkJump .6s ease}

.tray{position:absolute;left:0;right:0;bottom:0;height:clamp(96px,19vmin,170px);background:rgba(255,255,255,.72);border-radius:4vmin 4vmin 0 0;

.tray .ti .stk{position:absolute;inset:0;width:100%;height:100%;animation:none}
.tray .ti.new::before{content:'NEW';position:absolute;z-index:2;top:-1.4vmin;left:50%;transform:translateX(-50%);background:#ff5a6e;color:#fff;font-size:clamp(11px,1.8vmin,16px);
  padding:.2vmin 1.2vmin;border-radius:99px}
.tray .empty{width:100%;text-align:center;font-size:clamp(18px,3.6vmin,34px);color:#5b7896}

#cheer{position:fixed;left:50%;top:max(14px,3vh);width:min(72vw,620px);aspect-ratio:640/170;z-index:150;pointer-events:none;

.pt{position:fixed;font-size:var(--s);color:var(--c);pointer-events:none;z-index:999;line-height:1;animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards;

/* ===== v34: 첫 화면 카드 12개 (가로 6개씩 두 줄, 세로 3개씩 네 줄) ===== */

/* ===== 기차 태우기 ===== */
.rail{position:absolute;left:0;right:0;height:3vmin;z-index:1;
  background:repeating-linear-gradient(90deg,#b07a4b 0 2.6vmin,transparent 2.6vmin 6.5vmin) 0 1.1vmin/100% 1.9vmin no-repeat}
.rail::before{content:'';position:absolute;left:0;right:0;top:0;height:1.3vmin;border-radius:1vmin;background:linear-gradient(#c9d3df,#8c99ab);box-shadow:0 .3vmin 0 rgba(0,0,0,.12)}
.train{position:absolute;left:0;top:0;z-index:3;will-change:transform}
.train .tc,.train .te{position:absolute}
.train .tc img,.train .te img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;filter:var(--tint,hue-rotate(0deg)) drop-shadow(0 .8vmin .6vmin rgba(0,50,100,.2))}
.train .tc img.body{z-index:2;clip-path:inset(15.5% 0 0 0)}   /* 앞쪽 벽만 친구 앞에 → 친구가 칸 안에 앉은 것처럼 */
.train .tc img.bk{z-index:0}
.train .tc img.rider{position:absolute;z-index:1;object-fit:contain;transform-origin:50% 100%;filter:drop-shadow(0 .5vmin .4vmin rgba(0,50,100,.2))}   /* 칸 색(--tint)이 친구 얼굴에 묻지 않게 */
.train .rider.jump{animation:keyJump .5s ease-out}
.train.go .tc,.train.go .te{animation:chug .32s ease-in-out infinite}

@keyframes chug{50%{transform:translateY(-2.5%)}}
.train .te.toot{animation:toot .5s ease}

.trp{position:absolute;z-index:1}

.trp.sig .lamp.g{top:37%;background:radial-gradient(circle at 35% 30%,#fff 0 7%,#9dffa8 24%,#2fd35a 62%,#16a341);box-shadow:0 0 4vmin 1.4vmin rgba(60,230,110,.6)}
.trp.sig .lamp.on{opacity:1}
.trnight{position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(ellipse at 50% 70%,rgba(45,50,90,.9),rgba(8,10,28,.97));transition:opacity 2.4s ease}

.train{transition:filter 1.2s}

  background:linear-gradient(90deg,rgba(255,238,150,.95),rgba(255,238,150,0));clip-path:polygon(0 40%,100% 0,100% 100%,0 60%)}
/* 이야기 단계 진행 그림 (위쪽 별 자리): 지난 단계는 밝게, 지금 단계는 크게 */
.stars.steps{gap:1.8vmin;align-items:center}

#bath{background:#dff3ff;background-image:linear-gradient(rgba(255,255,255,.75) .4vmin,transparent .4vmin),linear-gradient(90deg,rgba(255,255,255,.75) .4vmin,transparent .4vmin),

.wdrop{position:absolute;z-index:7;pointer-events:none;width:1.6vmin;height:3.4vmin;border-radius:50% 50% 50% 50% / 65% 65% 35% 35%;

const AU={ctx:null,master:null,bgm:null};

    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ctx.destination);

  o.connect(g);g.connect(out||AU.master);o.start(s);o.stop(s+d+.05);
}

function bgmNote(e,at){const o=AU.bgm,f=mtof(e.m||0),spb=PL.spb;
  if(e.k==='mel'){const d=e.b*spb;
    if(e.inst==='box'){tone({f,at,d:d*.9+.45,v:.13,out:o});tone({f:f*2,at,d:.35,v:.035,out:o});}
    else if(e.inst==='marimba'){tone({f,at,d:Math.min(.5,d+.2),v:.15,out:o});tone({f:f*4,at,d:.07,v:.03,out:o});}
    else if(e.inst==='flute'){tone({f,at,d:d*.95+.25,v:.11,a:.05,type:'triangle',out:o});tone({f:f*2,at,d:d*.8,v:.012,a:.05,out:o});}
    else{tone({f:f*2,at,d:.6,v:.07,out:o});tone({f,at,d:.4,v:.06,out:o});}}
  else if(e.k==='bass')tone({f,at,d:e.d,v:.09,type:'triangle',out:o});
  else if(e.k==='stab')tone({f,at,d:.18,v:.03,out:o});
  else if(e.k==='arp')tone({f:f*2,at,d:.22,v:.022,out:o});
  else tone({f:1500,f2:2300,at,d:.05,v:.02,out:o});}
function bgmTick(){const c=AU.ctx,h=c.currentTime+.35;
  for(let guard=0;guard<500;guard++){
    if(PL.idx>=PL.ev.length){PL.start+=PL.len*PL.spb;PL.loop++;
      if(PL.loop>=2){PL.loop=0;PL.song=(PL.song+1)%SONGS.length;PL.start+=PL.spb*2;}loadSeg();continue;}
    const e=PL.ev[PL.idx],at=PL.start+e.t*PL.spb;if(at>h)break;bgmNote(e,at);PL.idx++;}}
// 배경음악 쉬기: 노래가 나오는 놀이(악단·생일 케이크·목욕 자장가)에서는 배경음악이 저절로 쉬었다가 나오면 다시 나와요
const BGM_HOLD=new Set();
const bgmHushed=()=>BGM_HOLD.size>0;
let bgaFadeT=0;
function bgaFade(to,ms,done){if(!BGA)return;clearInterval(bgaFadeT);const from=BGA.volume,t0=Date.now();
  bgaFadeT=setInterval(()=>{const k=Math.min(1,(Date.now()-t0)/ms);try{BGA.volume=Math.max(0,Math.min(1,from+(to-from)*k));}catch(e){}
    if(k>=1){clearInterval(bgaFadeT);done&&done();}},40);}
function bgmApply(){const hush=bgmHushed(),c=AU.ctx;
  if(bgmTimer&&c){AU.bgm.gain.cancelScheduledValues(c.currentTime);AU.bgm.gain.setTargetAtTime(hush?0:BGM_VOL,c.currentTime,hush?.08:.4);}
  if(!BGA||!bgaOn)return;
  if(hush)bgaFade(0,450,()=>{if(bgmHushed())BGA.pause();});
  else{clearInterval(bgaFadeT);BGA.volume=0;BGA.play().then(()=>bgaFade(bgaVol(),900)).catch(()=>{});}}
// 화면이 바뀔 때: 악단과 생일 케이크 화면에서는 쉬어요 (다른 이유로 쉬던 것은 화면을 나가면 풀어요)
function bgmHoldScreen(id){const was=bgmHushed();BGM_HOLD.clear();if(id==='music'||id==='cake')BGM_HOLD.add('screen');if(was!==bgmHushed())bgmApply();}
function bgmHold(k,on){const was=bgmHushed();on?BGM_HOLD.add(k):BGM_HOLD.delete(k);if(was!==bgmHushed())bgmApply();}
function synthStart(){const c=audio();if(!c||bgmTimer)return;AU.bgm.gain.cancelScheduledValues(c.currentTime);AU.bgm.gain.setValueAtTime(bgmHushed()?0:BGM_VOL,c.currentTime);
  PL.loop=0;loadSeg();PL.start=c.currentTime+.15;bgmTick();bgmTimer=setInterval(bgmTick,90);}
function synthStop(){if(!bgmTimer)return;clearInterval(bgmTimer);bgmTimer=null;const c=AU.ctx;
  AU.bgm.gain.setTargetAtTime(0,c.currentTime,.05);}
// 배경음악: 받은 노래 3곡을 돌아가며. 파일을 못 읽으면 직접 만든 오르골 음악으로
const SONGS_FILE=['music/kids.mp3','music/baby.mp3','music/lofi.mp3'];
let BGA=null,bgaIdx=Math.floor(Math.random()*SONGS_FILE.length),bgaFail=0,bgaOn=false;
const bgaVol=()=>+store.get('yj_bgmvol','.12')||.12;
function bgmStart(){if(bgaOn)return;audio();
  if(bgaFail>=SONGS_FILE.length){synthStart();return;}
  if(!BGA){BGA=new Audio();BGA.preload='auto';
    BGA.addEventListener('ended',()=>{bgaIdx=(bgaIdx+1)%SONGS_FILE.length;BGA.src=SONGS_FILE[bgaIdx];if(bgaOn&&!bgmHushed())BGA.play().catch(()=>{});});
    BGA.addEventListener('error',()=>{bgaFail++;if(bgaFail>=SONGS_FILE.length){bgaOn=false;synthStart();return;}
      bgaIdx=(bgaIdx+1)%SONGS_FILE.length;BGA.src=SONGS_FILE[bgaIdx];if(bgaOn&&!bgmHushed())BGA.play().catch(()=>{});});
    BGA.src=SONGS_FILE[bgaIdx];}
  bgaOn=true;clearInterval(bgaFadeT);BGA.volume=bgaVol();if(!bgmHushed())BGA.play().catch(()=>{});}   // 쉬는 중이면 켜 두기만 하고 나중에 틀어요
function bgmStop(){bgaOn=false;clearInterval(bgaFadeT);if(BGA)BGA.pause();synthStop();}

// 말하기: 목소리를 너무 높이지 않고(어색한 기계음 방지) 조금 천천히. 갤럭시는 삼성 목소리, 없으면 구글 한국어 목소리를 우선 사용
let KO_VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^ko/i.test(v.lang));
  const want=store.get('yj_voice','');if(want){const v=vs.find(v=>v.name===want);if(v){KO_VOICE=v;return;}}   // 부모님이 고른 목소리 우선
  KO_VOICE=vs.find(v=>/samsung/i.test(v.name))||vs.find(v=>/google/i.test(v.name))||vs.find(v=>v.localService)||vs[0]||null;}catch(e){}}
try{pickVoice();speechSynthesis.addEventListener('voiceschanged',pickVoice);}catch(e){}
// 화면 글씨의 기호(~ ♪ ★)는 소리 내어 읽지 않게 빼요. "후~"는 "후우"로 길게
const sayText=t=>String(t).replace(/후~+/g,'후우').replace(/[~♪♫♬★☆♥♡…]+/g,' ').replace(/\s+/g,' ').trim();
function say(txt){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(sayText(txt));
  u.lang='ko-KR';u.pitch=1.12;u.rate=+store.get('yj_rate','.9')||.9;u.volume=1;if(!KO_VOICE)pickVoice();if(KO_VOICE)u.voice=KO_VOICE;s.speak(u);}catch(e){}}

/* 버튼 누르기를 확실하게 (특히 S펜): 브라우저의 click은 버튼이 눌리며 살짝 움직이거나 펜이 조금만 흔들려도 취소돼요.
   그래서 '누른 버튼'을 기억했다가, 뗀 곳이 그 버튼 근처(여유 28px)이고 크게 끌지 않았으면 직접 눌러줘요. */
let tapB=null,fastFiring=false,fastAt=0,fastX=0,fastY=0;
document.addEventListener('pointerdown',e=>{const b=e.target.closest&&e.target.closest('button');
  tapB=b&&!b.disabled&&(e.button===0||e.pointerType!=='mouse')?{b,id:e.pointerId,x:e.clientX,y:e.clientY,r:b.getBoundingClientRect()}:null;},true);
document.addEventListener('pointerup',e=>{const t=tapB;if(!t||t.id!==e.pointerId)return;tapB=null;
  const T=28,r=t.r,near=e.clientX>r.left-T&&e.clientX<r.right+T&&e.clientY>r.top-T&&e.clientY<r.bottom+T;
  if(!near||Math.hypot(e.clientX-t.x,e.clientY-t.y)>40||!document.contains(t.b))return;
  t.b.__tapAt=fastAt=Date.now();fastX=e.clientX;fastY=e.clientY;fastFiring=true;try{t.b.click();}finally{fastFiring=false;}},true);
document.addEventListener('pointercancel',e=>{if(tapB&&tapB.id===e.pointerId)tapB=null;},true);
// 브라우저가 뒤늦게 보내는 원래 click은 막아서 두 번 눌리지 않게.
// 누르면 버튼을 새로 그리는 곳(노래 고르기·옷장)은 손가락이면 원래 click이 '새' 버튼에 와서, 같은 자리 click도 막아요
document.addEventListener('click',e=>{if(fastFiring)return;const b=e.target.closest&&e.target.closest('button');
  if(b&&((b.__tapAt&&Date.now()-b.__tapAt<700)||(Date.now()-fastAt<700&&Math.hypot(e.clientX-fastX,e.clientY-fastY)<40))){e.stopPropagation();e.preventDefault();}},true);

const HAND_SVG=`<svg viewBox="0 0 100 100"><path d="M34 52 V14 Q34 5 41 5 Q48 5 48 14 V44 Q50 37 57 38 Q63 39 63 46 Q66 41 72 43 Q77 45 77 52 Q80 49 85 51 Q90 54 89 61 L86 78 Q82 94 64 95 L50 95 Q36 94 30 82 L19 64 Q15 56 21 53 Q28 50 34 58 Z" fill="#ffe0cc" stroke="#fff" stroke-width="5" stroke-linejoin="round"/><path d="M41 12 V30" stroke="#f5c6ad" stroke-width="3" stroke-linecap="round"/></svg>`;
function ghostHand(x0,y0,x1,y1,carry){if(document.querySelector('.ghand'))return;
  const z=Math.min(innerWidth,innerHeight)*.13,h=document.createElement('div');h.className='ghand';h.innerHTML=HAND_SVG;
  Object.assign(h.style,{width:z+'px',height:z+'px'});document.body.appendChild(h);
  const T=(x,y,k)=>`translate(${x-z*.41}px,${y-z*.05}px) scale(${k})`;
  const kf=(f)=>[{transform:f(x0,y0,1),opacity:0},{transform:f(x0,y0,1),opacity:1,offset:.12},{transform:f(x0,y0,.86),opacity:1,offset:.22},
    {transform:f(x1,y1,.86),opacity:1,offset:.72},{transform:f(x1,y1,1),opacity:1,offset:.84},{transform:f(x1,y1,1),opacity:0}];
  const opt={duration:2400,easing:'ease-in-out'};h.animate(kf(T),opt);

/* 색칠공부 밑그림: 캐릭터 그림에서 테두리를 뽑아 선 그림으로 */
const LINE={};
async function lineArt(ch){if(LINE[ch.id])return LINE[ch.id];const N=900,img=await loadImg(svgURL(ch.lineSvg()));
  const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,N,N);x.drawImage(img,0,0,N,N);const s=x.getImageData(0,0,N,N).data,m=new Uint8Array(N*N);
  const df=(a,b)=>Math.max(Math.abs(s[a]-s[b]),Math.abs(s[a+1]-s[b+1]),Math.abs(s[a+2]-s[b+2]));
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx,k=i*4;
    if(.3*s[k]+.59*s[k+1]+.11*s[k+2]<62){m[i]=1;continue;}
    if((xx<N-1&&df(k,k+4)>34)||(y<N-1&&df(k,k+N*4)>34))m[i]=1;}
  const r=3,t=new Uint8Array(N*N),o=new Uint8Array(N*N);
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let v=0;for(let q=-r;q<=r&&!v;q++){const X=xx+q;if(X>=0&&X<N&&m[y*N+X])v=1;}t[y*N+xx]=v;}
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let v=0;for(let q=-r;q<=r&&!v;q++){const Y=y+q;if(Y>=0&&Y<N&&t[Y*N+xx])v=1;}o[y*N+xx]=v;}
  const out=x.createImageData(N,N);for(let i=0;i<N*N;i++)if(o[i]){const k=i*4;out.data[k]=43;out.data[k+1]=58;out.data[k+2]=85;out.data[k+3]=255;}
  x.putImageData(out,0,0);LINE[ch.id]=c;return c;}
async function setPage(ch){D.undo=[];pctx.clearRect(0,0,PW,PH);lctx.clearRect(0,0,PW,PH);D.page=ch?ch.id:null;D.lineAlpha=null;D.alive=false;D.sil=null;
  if(ch){const c=await lineArt(ch),s=PH*.94;lctx.drawImage(c,(PW-s)/2,(PH-s)/2,s,s);
    // 칠할 수 있는 곳(캐릭터 모양) 기억해두기
    try{const im=await loadImg(svgURL(ch.lineSvg())),cv=document.createElement('canvas');cv.width=PW;cv.height=PH;const x=cv.getContext('2d',{willReadFrequently:true});
      x.drawImage(im,(PW-s)/2,(PH-s)/2,s,s);const d=x.getImageData(0,0,PW,PH).data,M=new Uint8Array(PW*PH);for(let i=0;i<M.length;i++)M[i]=d[i*4+3]>100?1:0;D.sil=M;}catch(e){}
    const a=lctx.getImageData(0,0,PW,PH).data,L=new Uint8Array(PW*PH);for(let i=0;i<L.length;i++)L[i]=a[i*4+3];D.lineAlpha=L;
    if(D.tool==='eraser'||D.tool==='stamp')D.tool='crayon';renderTools();}}

];

const DCATS=[['dress','dress','옷'],['hair','hair','머리'],['head','crown','머리 장식'],['shoes','shoe','신발'],['acc','bow','소품']];

const BASE=`<g stroke="${SKIN}" stroke-width="34" stroke-linecap="round"><path d="M178 460 L176 600"/><path d="M222 460 L224 600"/></g>
  <g stroke="${SKIN}" stroke-width="28" stroke-linecap="round"><path d="M160 300 L122 410"/><path d="M240 300 L278 410"/></g>
  <circle cx="120" cy="418" r="17" fill="${SKIN}"/><circle cx="280" cy="418" r="17" fill="${SKIN}"/>
  <rect x="186" y="245" width="28" height="48" rx="10" fill="${SKIN2}"/>
  <path d="M156 292 Q200 306 244 292 L252 410 L148 410 Z" fill="#fff"/>
  <path d="M146 400 L254 400 L262 478 L210 478 L200 450 L190 478 L138 478 Z" fill="#a8dcff"/>
  <g fill="${SKIN}"><ellipse cx="174" cy="610" rx="18" ry="11"/><ellipse cx="226" cy="610" rx="18" ry="11"/></g>`;
function dollSVG(st,happy,changed,bg){
  const g=(slot,inner)=>inner?`<g class="L-${slot}${changed===slot?' pop':''}">${inner}</g>`:'';
  const it=s=>st[s]&&DI[st[s]]?DI[st[s]].svg:'';const H=DI[st.hair]||DI.h1;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -40 400 700" width="400" height="700">${bg||''}
   ${g('back',it('back'))}<g class="L-hair${changed==='hair'?' pop':''}"><g fill="${H.c}">${H.back}</g></g>
   ${BASE}${g('shoes',it('shoes'))}${g('dress',it('dress'))}${g('neck',it('neck'))}
   <g>${headSVG(happy)}</g><g class="${changed==='hair'?'pop':''}"><g fill="${H.c}">${H.front}</g>${H.deco}</g>
   ${g('face',it('face'))}${g('head',it('head'))}${g('hand',it('hand'))}</svg>`;}
function drawDoll(changed){$('doll').innerHTML=dollSVG(DS,dHappy,changed);}
function thumb(it){
  if(it.cat==='hair')return `<svg viewBox="70 0 260 440"><g fill="${it.c}">${it.back}</g><circle cx="200" cy="170" r="95" fill="${SKIN}"/>
    <g fill="#2b2b3a"><ellipse cx="163" cy="190" rx="12" ry="15"/><ellipse cx="237" cy="190" rx="12" ry="15"/></g><g fill="${it.c}">${it.front}</g>${it.deco}</svg>`;
  return `<svg viewBox="${it.box}">${it.svg}</svg>`;}
function renderCloset(){
  const t=$('dTabs');t.innerHTML='';
  DCATS.forEach(([id,icn,name])=>{const b=document.createElement('button');b.className='dtab'+(dTab===id?' sel':'');b.innerHTML=ic(icn);
    b.onclick=()=>{dTab=id;sfx.bubble();say(name);renderCloset();};t.appendChild(b);});
  const g=$('dItems');g.innerHTML='';const list=DITEMS.filter(i=>i.cat===dTab);
  g.style.gridTemplateColumns=`repeat(${list.length>8?5:4},1fr)`;   // 스크롤 없이 한 화면에
  list.forEach(it=>{const b=document.createElement('button');b.className='ditem'+(DS[slotOf(it)]===it.id?' on':'');
    b.innerHTML=thumb(it);bindItemDrag(it,b);g.appendChild(b);});}

/* 옷을 눌러서 인형 쪽으로 끌고 가면 '딱' 붙기 (퍼즐처럼). 톡 누르기만 해도 날아가서 입혀짐 */
let DG=null;
function dollMap(){const r=$('doll').getBoundingClientRect(),s=Math.min(r.width/400,r.height/700);
  return{r,s,ox:r.left+(r.width-400*s)/2,oy:r.top+(r.height-700*s)/2+40*s};}   // 인형 좌표 (x,y) → 화면 (ox+x*s, oy+y*s)
const itemBox=it=>(it.cat==='hair'?'70 0 260 440':it.box).split(' ').map(Number);
const itemArt=it=>it.cat==='hair'?`<g fill="${it.c}">${it.back}</g><g fill="${it.c}">${it.front}</g>${it.deco}`:it.svg;
function dgSet(x,y,k,dur){const el=DG.el;el.style.transition=dur?`transform ${dur}s cubic-bezier(.3,1.2,.5,1),opacity ${dur}s`:'none';
  el.style.transform=`translate(${x}px,${y}px) scale(${k})`;DG.x=x;DG.y=y;DG.k=k;}
function bindItemDrag(it,tile){
  tile.addEventListener('pointerdown',e=>{if(DG)return;e.preventDefault();try{tile.setPointerCapture(e.pointerId);}catch(_){}
    const tr=tile.getBoundingClientRect(),[bx,by,bw,bh]=itemBox(it),M=dollMap(),W=bw*M.s,H=bh*M.s;
    const el=document.createElement('div');el.className='dragItem';el.style.width=W+'px';el.style.height=H+'px';
    el.innerHTML=`<svg viewBox="${bx} ${by} ${bw} ${bh}">${itemArt(it)}</svg>`;document.body.appendChild(el);
    const k0=Math.min(tr.width/W,tr.height/H)*.85,hx=tr.left+tr.width/2-W*k0/2,hy=tr.top+tr.height/2-H*k0/2;
    DG={it,tile,el,W,H,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,k0,hx,hy,tx:M.ox+bx*M.s,ty:M.oy+by*M.s,M};
    dgSet(hx,hy,k0,0);tile.classList.add('lift');sfx.pick();});
  tile.addEventListener('pointermove',e=>{if(!DG||DG.id!==e.pointerId)return;
    if(!DG.moved&&Math.hypot(e.clientX-DG.sx,e.clientY-DG.sy)<12)return;
    const first=!DG.moved;DG.moved=true;
    dgSet(e.clientX-DG.W/2,e.clientY-DG.H*.45,1,first?.18:0);                     // 끌면 인형 크기로 커짐
    $('dollStage').classList.toggle('near',nearDoll(e));});
  const up=e=>{if(!DG||DG.id!==e.pointerId)return;const d=DG,s=slotOf(d.it),worn=DS[s]===d.it.id;$('dollStage').classList.remove('near');
    if(!d.moved){ if(worn&&s!=='hair')takeOff(d);else snapOn(d,.5); }      // 톡: 입었으면 벗기, 아니면 날아가서 입히기
    else if(nearDoll(e))snapOn(d,.22);
    else{sfx.drop();dgSet(d.hx,d.hy,d.k0,.32);d.el.style.opacity=.2;setTimeout(()=>dgEnd(d),330);}};
  tile.addEventListener('pointerup',up);tile.addEventListener('pointercancel',up);}
function nearDoll(e){const r=DG.M.r,mx=r.width*.12,my=r.height*.04;   // 인형 몸 근처면 붙음 (아이 손에 맞게 넉넉히)
  return e.clientX>r.left+mx&&e.clientX<r.right-mx&&e.clientY>r.top+my&&e.clientY<r.bottom-my;}
function snapOn(d,dur){dgSet(d.tx,d.ty,1,dur);setTimeout(()=>{const s=slotOf(d.it);DS[s]=d.it.id;
    tone({f:700,f2:1500,d:.08,v:.2});sparkle();say(d.it.name);happyFace();drawDoll(s);hop();
    burst(d.tx+d.W/2,d.ty+d.H/2,16,Math.max(d.W,d.H)*.6);store.set('yj_doll',JSON.stringify(DS));dgEnd(d);renderCloset();},dur*1000);}
function takeOff(d){const s=slotOf(d.it);DS[s]=null;drawDoll();store.set('yj_doll',JSON.stringify(DS));sfx.drop();
  dgSet(d.tx,d.ty,1,0);requestAnimationFrame(()=>{dgSet(d.hx,d.hy,d.k0,.38);setTimeout(()=>{dgEnd(d);renderCloset();},400);});}
function dgEnd(d){d.el.remove();d.tile.classList.remove('lift');if(DG===d)DG=null;}
function happyFace(){dHappy=true;clearTimeout(dHappyT);dHappyT=setTimeout(()=>{dHappy=false;drawDoll();},1100);}
function hop(){const d=$('doll');d.classList.remove('hop');void d.offsetWidth;d.classList.add('hop');}
function sparkle(){[0,1,2,3,4,5].forEach(i=>bell(mtof(PENT[i+2]),i*.05,.09,.45));}
function dollBurst(n=18){const r=$('doll').getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height*.45,n,Math.min(r.width,r.height)*.45);}
function wear(it,e){const s=slotOf(it);
  if(DS[s]===it.id&&s!=='hair'){DS[s]=null;sfx.drop();drawDoll();}
  else{DS[s]=it.id;sparkle();say(it.name);happyFace();drawDoll(s);hop();dollBurst(14);}
  store.set('yj_doll',JSON.stringify(DS));renderCloset();}
const pick=a=>a[Math.floor(Math.random()*a.length)];
$('magicBtn').onclick=()=>{const of=c=>DITEMS.filter(i=>i.cat===c),acc=s=>DITEMS.filter(i=>i.slot===s);
  DS={dress:pick(of('dress')).id,hair:pick(of('hair')).id,head:Math.random()<.75?pick(of('head')).id:null,shoes:pick(of('shoes')).id,
      neck:Math.random()<.6?pick(acc('neck')).id:null,face:Math.random()<.3?pick(acc('face')).id:null,hand:Math.random()<.6?pick(acc('hand')).id:null,back:Math.random()<.4?'b1':null};
  store.set('yj_doll',JSON.stringify(DS));sfx.fanfare();say('새 옷으로 바꿨어요');happyFace();drawDoll('dress');hop();dollBurst(40);renderCloset();};
$('resetBtn').onclick=()=>{DS={...DDEF};store.set('yj_doll','{}');sfx.whoosh();drawDoll();renderCloset();};
let dLastSave=0;
$('dSaveBtn').onclick=async()=>{if(Date.now()-dLastSave<3000)return;dLastSave=Date.now();

$('doll').addEventListener('pointerdown',()=>{sfx.bubble();happyFace();drawDoll();hop();say(pick(['안녕!','나 예뻐?','좋아!']));});
$('goDress').onclick=()=>{sfx.tap();say('옷 입혀 볼까요?');show('dress');drawDoll();renderCloset();};

function renderStars(id,n,total){$(id).innerHTML=Array.from({length:total},(_,i)=>`<span class="${i<n?'on':''}">★</span>`).join('');}
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const charSrc=ch=>{const i=CHARS.indexOf(ch);if(i>=0)return STAMPS[i].src;if(ch.photo)return ch.src;return ch._src||(ch._src=svgURL(ch.svg(false)));};

/* ================= 비눗방울: 톡톡 터뜨리기 → 색깔 방울 → 큰 방울에 갇힌 친구 구하기 → 친구가 불어 주는 무지개 방울 ================= */
const BB={timer:null,count:0,party:false,world:'sea',mode:'free',goal:8,target:null,lastNo:0,step:0,gen:0,giant:null,gt:0,rn:0};
const bbIcon=c=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><radialGradient id="g" cx=".32" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".22" stop-color="#fff" stop-opacity=".4"/><stop offset=".7" stop-color="${c}" stop-opacity=".45"/><stop offset="1" stop-color="${c}"/></radialGradient></defs><circle cx="32" cy="32" r="28" fill="url(#g)" stroke="${c}" stroke-width="2.5"/></svg>`);
// 진행 그림: 방울 · 색깔 방울 · 갇힌 친구 · 무지개
const bbProg=()=>stepBar('bbStars',[bbIcon('#7ec8ff'),bbIcon(BB.step>=1&&BB.target?BB.target[0]:'#ff8fc7'),BB.giant?charSrc(BB.giant):bbIcon('#b8a6ff'),'st_rainbow'],BB.step);
const NUM=['하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉','열'];
const BTINT=[['#ff8fc7','분홍'],['#7ec8ff','파란'],['#ffd93d','노란'],['#7ddc8a','초록']];
function bbGo(){BB.step=0;bbStart();}
function bbStart(){show('bubble');const g=++BB.gen;BB.count=0;BB.party=false;document.body.classList.toggle('land',BB.world==='land');$('bbArea').innerHTML='';
  clearInterval(BB.timer);BB.timer=null;BB.mode=BB.step===1?'color':'free';BB.goal=BB.step===1?5:8;
  if(BB.step===0)BB.giant=pick(BB.world==='land'&&LAND.length?LAND:CHARS);   // 이번 이야기에서 방울에 갇힐 친구
  if(BB.step===1)BB.target=pick(BTINT);
  bbProg();
  if(BB.step===2){bbGiant(g);return;}if(BB.step===3){bbRain(g);return;}
  if(BB.mode==='color'){const m=document.createElement('div');m.className='mission';m.id='bbMission';m.style.setProperty('--t',BB.target[0]);
    m.innerHTML=`<i></i><span>${BB.target[1]} 방울만 터뜨려요!</span>`;$('bbArea').appendChild(m);setTimeout(()=>say(`이번엔 ${BB.target[1]} 방울만 터뜨려요!`),400);}
  clearInterval(BB.timer);BB.timer=setInterval(bbTick,700);for(let i=0;i<3;i++)setTimeout(bbSpawn,i*400);}
function bbTick(){if(S.screen!=='bubble'){clearInterval(BB.timer);BB.timer=null;return;}
  if($('bbArea').querySelectorAll('.bb:not(.mini)').length<6&&Math.random()<.75)bbSpawn();}
function bbSpawn(){if(S.screen!=='bubble'||BB.step>1)return;const A=$('bbArea'),W=A.clientWidth,H=A.clientHeight;
  const rainbow=BB.mode==='free'&&!BB.party&&Math.random()<.1;   // 가끔 무지개 큰 방울
  const s=Math.min(W,H)*(.21+Math.random()*.08)*(rainbow?1.45:1);
  const ch=pick(BB.world==='land'&&LAND.length?LAND:CHARS),b=document.createElement('div');b.className='bb'+(rainbow?' rainbow':'');
  if(BB.mode==='color'){// 색깔 미션: 절반쯤은 정답 색이 나오게
    const t=Math.random()<.5?BB.target:pick(BTINT);b.classList.add('tint');b.style.setProperty('--t',t[0]);b.dataset.tint=t[1];}
  b.style.cssText+=`;left:${Math.random()*(W-s)}px;width:${s}px;height:${s}px;--dur:${(7+Math.random()*4)*(rainbow?1.3:1)}s;--rise:${H+s*1.2}px`;
  b.innerHTML=`<div class="bbw" style="animation-delay:-${(Math.random()*3).toFixed(2)}s"><img src="${charSrc(ch)}" alt=""></div>`;
  b.addEventListener('pointerdown',e=>{e.preventDefault();bbPop(b);});
  b.addEventListener('animationend',e=>{if(e.target===b)b.remove();});A.appendChild(b);}
function bbMini(x,y){const A=$('bbArea'),Ar=A.getBoundingClientRect();   // 무지개 방울이 터지면 작은 방울이 와르르
  for(let i=0;i<7;i++){const s=Math.min(Ar.width,Ar.height)*(.07+Math.random()*.05),b=document.createElement('div');b.className='bb mini';
    b.style.cssText=`left:${x-Ar.left-s/2}px;top:${y-Ar.top-s/2}px;width:${s}px;height:${s}px;--dur:${3.5+Math.random()*2}s;--dx:${(Math.random()-.5)*40}vw`;
    b.innerHTML=`<div class="bbw"></div>`;b.addEventListener('pointerdown',e=>{e.preventDefault();bbPop(b);});
    b.addEventListener('animationend',e=>{if(e.target===b)b.remove();});A.appendChild(b);}}
function bbPop(b){const r=b.getBoundingClientRect(),im=b.querySelector('img');
  if(im){const img=document.createElement('img');img.className='bbChar';img.src=im.src;
    img.style.cssText=`left:${r.left+r.width*.16}px;top:${r.top+r.height*.16}px;width:${r.width*.68}px;height:${r.height*.68}px`;
    img.addEventListener('animationend',()=>img.remove());document.body.appendChild(img);}
  b.remove();burst(r.left+r.width/2,r.top+r.height/2,b.classList.contains('rainbow')?30:14,r.width*.7);sfx.pop();
  if(b.classList.contains('rainbow')){bbMini(r.left+r.width/2,r.top+r.height/2);[0,1,2,3,4,5].forEach(i=>bell(mtof(PENT[i+2]),i*.05,.12,.45));
    if(!BB.party)say('우와! 무지개 방울이에요!');}
  if(b.classList.contains('rain')){bell(mtof(PENT[(BB.rn++)%PENT.length]),0,.14,.5);return;}   // 무지개 방울 비: 세지 않고 딩동댕
  if(BB.party||BB.step>1)return;
  if(BB.mode==='color'&&b.dataset.tint!==BB.target[1]){   // 다른 색은 터지긴 하지만 세지 않아요
    if(Date.now()-BB.lastNo>2500){BB.lastNo=Date.now();say(`이건 ${b.dataset.tint} 방울이에요. ${BB.target[1]} 방울을 찾아요!`);}return;}
  BB.count++;bell(mtof(PENT[Math.min(BB.count-1,8)]),.05,.16,.6);
  if(BB.count<BB.goal){if(!b.classList.contains('rainbow'))say(NUM[BB.count-1]);return;}
  BB.party=true;const t=BB.mode==='color'?`${BB.target[1]} 방울을 다 찾았어요!`:'다 터뜨렸어요!';
  say(BB.mode==='color'?t:`${NUM[BB.goal-1]}! 다 터뜨렸어요!`);cheer(t);sfx.fanfare();
  burst(innerWidth/2,innerHeight/2,50,Math.min(innerWidth,innerHeight)*.45,true);
  const g=BB.gen;setTimeout(()=>{if(S.screen!=='bubble'||BB.gen!==g)return;BB.step++;bbStart();},3200);}
// 3단계: 큰 비눗방울에 친구가 갇혔어요! 세 번 톡톡 → 펑, 친구가 나와요
function bbGiant(g){const A=$('bbArea'),W=A.clientWidth,H=A.clientHeight,z=Math.min(W*.42,H*.62),ch=BB.giant;BB.gt=0;
  const b=document.createElement('div');b.className='bb giant';b.id='bbGiant';Object.assign(b.style,{left:(W/2-z/2)+'px',top:(H*.56-z/2)+'px',width:z+'px',height:z+'px'});
  b.innerHTML=`<div class="bbw"><img src="${charSrc(ch)}" alt=""></div>`;b.addEventListener('pointerdown',e=>{e.preventDefault();bbGiantTap(g);});A.appendChild(b);
  b.animate([{transform:`translateY(${H*.7}px)`},{transform:'none'}],{duration:1800,easing:'ease-out'});
  setTimeout(()=>{if(BB.gen===g)say(`어머! ${ga(ch.name)} 큰 비눗방울에 갇혔어요! 톡톡 눌러서 꺼내 줘요!`);},900);
  BB.hintT=setInterval(()=>{if(BB.gen!==g||S.screen!=='bubble'||BB.gt>=3){clearInterval(BB.hintT);return;}if(Date.now()-lastTouch<6000)return;

  <g class="mClosed"><path d="M182 382 Q152 402 124 376" stroke="#2b3a55" stroke-width="8" fill="none" stroke-linecap="round"/></g>
  <g class="mOpen"><ellipse cx="150" cy="392" rx="46" ry="40" fill="#7a2338"/><ellipse cx="150" cy="413" rx="28" ry="13" fill="#ff7f9a"/>
   <path d="M118 366 L126 383 L134 364 Z M141 360 L149 378 L157 359 Z M164 361 L171 378 L178 366 Z" fill="#fff"/></g>
  <circle class="mHit" cx="150" cy="392" r="2" fill="none"/></svg>`;
// 밥 주는 친구: 바다는 상어+색깔 물고기, 숲속은 토끼+색깔 과일. 배부를 때마다(5번) 번갈아
const FEEDS={
 sea:{who:'상어',wait:'shark_open',chew:'shark_closed',full:'shark_closed',toggle:true,mouth:[.41,.61],flip:true,
   items:FISH_COLS.map(i=>({img:'fish'+i,say:FCOL[i][2]+' 물고기',wrong:`이건 ${FCOL[i][3]}이에요.`}))},
 land:{who:'토끼',wait:'rabbit_open',chew:'rabbit_open',full:'rabbit_closed',toggle:false,mouth:[.45,.57],flip:false,
   items:[['fr_apple','빨간 사과'],['fr_banana','노란 바나나'],['fr_blueberry','파란 블루베리'],['fr_peach','분홍 복숭아'],['fr_orange','주황 오렌지'],['fr_grape','보라 포도']]
     .map(([img,s])=>({img,say:s,wrong:`이건 ${s}예요.`}))}};
const FD={fed:0,target:null,busy:false,last:0,fish:[],shark:null,S:0,timer:null,world:'sea',need:1,got:0,cycles:0,stage:'eat',act:false,n:0,tool:null,mv:false,gen:0};
const FD_MEALS=4;   // 한 이야기에서 밥 먹는 횟수
// 진행 그림: 밥 · 배 톡톡 · 칫솔 · 컵
const fdProg=()=>stepBar('fdStars',[FW().items[0].img,'st_heart','fd_brush','fd_cup'],{eat:0,burp:1,brush:2,rinse:3,play:9}[FD.stage]||0);
const FW=()=>FEEDS[FD.world];
const itemImg=(it,flip)=>`<img src="chars/${it.img}.webp" alt=""${flip?' style="transform:scaleX(-1)"':''}>`;
function fdFace(kind){const sh=FD.shark;if(!sh)return;sh.querySelector('.so').src=`chars/${FW()[kind]}.webp`;sh.classList.add('open');}
function fdStart(){show('feed');FD.fed=0;FD.stage='eat';FD.act=false;FD.gen++;document.body.classList.toggle('land',FD.world==='land');fdBuild();fdProg();fdRound();
  clearInterval(FD.timer);FD.timer=setInterval(()=>{if(S.screen!=='feed'){clearInterval(FD.timer);FD.timer=null;return;}
    if(Date.now()-Math.max(FD.last,lastTouch)<7000)return;
    if(FD.stage!=='eat'){if(!FD.act||FD.mv)return;FD.last=Date.now();const el=FD.stage==='burp'?FD.shark:FD.tool;if(!el)return;const c=ctr(el);   // 단계별 손가락 힌트
      if(FD.tool){FD.tool.classList.remove('glow');void FD.tool.offsetWidth;FD.tool.classList.add('glow');setTimeout(()=>FD.tool&&FD.tool.classList.remove('glow'),2400);}
      ghostHand(c.x+c.w*.35,c.y+c.h*.35,c.x,c.y,null);say(FD.stage==='burp'?'배를 톡톡 두드려 줘요!':FD.stage==='brush'?'칫솔을 톡 눌러요! 치카치카':'컵을 톡 눌러요! 가글가글');return;}
    if(FD.busy)return;FD.last=Date.now();const f=FD.fish.find(f=>f.c===FD.target);
    if(f){f.el.classList.remove('hint');void f.el.offsetWidth;f.el.classList.add('hint');const m=mouthXY();
      ghostHand(f.x+f.w/2,f.y+f.h/2,m.x,m.y,{html:f.el.querySelector('.fb').innerHTML,w:f.w,h:f.h});}say(FD.askText||`${FD.target.say} 주세요!`);},1000);}
function fdBuild(){const A=$('fdArea');A.innerHTML='';FD.tool=null;const W=A.clientWidth,H=A.clientHeight,land=W>=H,w=FW();
  const Sz=land?Math.min(W*.46,H*.72):Math.min(W*.72,H*.42);FD.S=Sz;FD.land=land;
  const sh=document.createElement('div');sh.className='shark open';
  sh.innerHTML=`<div class="sb"><img class="sc" src="chars/${w.chew}.webp" alt=""><img class="so" src="chars/${w.wait}.webp" alt=""><i class="mHit" style="left:${w.mouth[0]*100}%;top:${w.mouth[1]*100}%"></i></div>`;
  const sx=land?W-Sz-W*.03:(W-Sz)/2,sy=land?(H-Sz)/2+H*.08:H-Sz-H*.03;
  Object.assign(sh.style,{left:sx+'px',top:sy+'px',width:Sz+'px',height:Sz+'px'});A.appendChild(sh);FD.shark=sh;
  sh.addEventListener('pointerdown',()=>{if(FD.stage!=='eat'){fdPoke();return;}if(FD.busy)return;sh.classList.remove('squish');void sh.offsetWidth;sh.classList.add('squish');sfx.giggle();FD.last=Date.now();});
  FD.region=land?{x:W*.03,y:Math.min(130,H*.16),w:sx-W*.06,h:H-Math.min(130,H*.16)-H*.04}:{x:W*.04,y:Math.min(130,H*.14),w:W*.92,h:sy-Math.min(130,H*.14)-H*.04};
  const ask=document.createElement('div');ask.className='ask';ask.id='fdAsk';A.appendChild(ask);
  Object.assign(ask.style,land?{left:(sx-Sz*.05)+'px',top:Math.max(Math.min(130,H*.16)-H*.04,sy-Sz*.08)+'px'}:{left:(W*.5)+'px',top:(sy-H*.02)+'px',transform:'translateX(-50%)'});}
function fdRound(){if(S.screen!=='feed')return;FD.busy=false;FD.last=Date.now();FD.fish.forEach(f=>f.el.remove());FD.fish=[];
  const w=FW(),pickd=shuffle(w.items.slice()).slice(0,3);FD.target=pickd[0];
  // 한 번 배부르게 먹인 뒤부터는 가끔 "두 마리 주세요" (숫자 세기)
  FD.need=FD.cycles>=1&&Math.random()<.4?2:1;FD.got=0;const unit=FD.world==='sea'?'마리':'개';
  const items=shuffle(FD.need===2?[pickd[0],pickd[0],pickd[1],pickd[2]]:pickd);
  const ask=FD.need===2?`${FD.target.say} 두 ${unit} 주세요!`:`${FD.target.say} 주세요!`;FD.askText=ask;
  $('fdAsk').innerHTML=`${itemImg(FD.target,false)}${FD.need===2?itemImg(FD.target,false):''}<span>${ask}</span>`;
  $('fdAsk').style.animation='none';void $('fdAsk').offsetWidth;$('fdAsk').style.animation='';
  say(ask);fdFace('wait');
  const R=FD.region,nI=items.length,fw=Math.min(FD.land?R.w*(nI>3?.5:.62):R.w/nI*.9,FD.land?R.h/nI*1.35:R.h*.7*1.5),fh=fw*.82;
  items.forEach((c,i)=>{const el=document.createElement('div');el.className='fish';el.innerHTML=`<div class="fb" style="animation-delay:-${i*.7}s">${itemImg(c,w.flip)}</div>`;
    let x,y;if(FD.land){x=R.x+(i%2?R.w-fw:0)*.5+Math.random()*Math.max(0,R.w-fw)*.5;y=R.y+R.h*(i+.5)/nI-fh/2;}
    else{x=R.x+R.w*(i+.5)/nI-fw/2;y=R.y+Math.random()*Math.max(0,R.h-fh);}
    const f={el,c,x,y,hx:x,hy:y,w:fw,h:fh};Object.assign(el.style,{left:x+'px',top:y+'px',width:fw+'px',height:fh+'px'});
    fdDrag(f);$('fdArea').appendChild(el);FD.fish.push(f);});}
function mouthXY(){const r=FD.shark.querySelector('.mHit').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function fdDrag(f){const el=f.el;
  el.addEventListener('pointerdown',e=>{if(FD.busy)return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
    f.drag={id:e.pointerId,ox:e.clientX-f.x,oy:e.clientY-f.y};el.classList.remove('back','hint');el.classList.add('hold');el.style.zIndex=20;FD.last=Date.now();sfx.pick();});
  el.addEventListener('pointermove',e=>{if(!f.drag||f.drag.id!==e.pointerId)return;f.x=e.clientX-f.drag.ox;f.y=e.clientY-f.drag.oy;
    el.style.left=f.x+'px';el.style.top=f.y+'px';});
  const up=e=>{if(!f.drag||f.drag.id!==e.pointerId)return;f.drag=null;el.classList.remove('hold');FD.last=Date.now();
    const m=mouthXY(),cx=f.x+f.w*(FW().flip?.75:.5),cy=f.y+f.h/2,d=Math.hypot(cx-m.x,cy-m.y);
    if(d<FD.S*.36){if(f.c===FD.target)fdEat(f,m);else fdWrong(f);}else fdHome(f);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);}
function fdHome(f){sfx.drop();f.el.classList.add('back');f.x=f.hx;f.y=f.hy;f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';
  setTimeout(()=>f.el.classList.remove('back'),450);}
function fdWrong(f){const sh=FD.shark;sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');sfx.nope();
  say(`${f.c.wrong} ${FD.askText||FD.target.say+' 주세요!'}`);setTimeout(()=>sh.classList.remove('shake'),550);
  setTimeout(()=>fdHome(f),150);}
function fdEat(f,m){FD.busy=true;const el=f.el,w=FW();el.classList.add('eaten');el.style.left=(m.x-f.w*.5)+'px';el.style.top=(m.y-f.h*.5)+'px';
  setTimeout(()=>{el.remove();FD.fish=FD.fish.filter(x=>x!==f);},300);
  const sh=FD.shark;let k=0;   // 냠냠: 상어는 입을 벌렸다 다물었다, 토끼는 꿀렁꿀렁
  const chew=setInterval(()=>{if(w.toggle)sh.classList.toggle('open');else{sh.classList.remove('squish');void sh.offsetWidth;sh.classList.add('squish');}
    if(++k>=5){clearInterval(chew);sh.classList.remove('open');}},140);
  sfx.chomp();FD.got++;
  if(FD.got<FD.need){setTimeout(()=>heartBurst(m.x,m.y),300);say('하나! 하나 더 주세요!');setTimeout(()=>{FD.busy=false;fdFace('wait');},700);return;}
  if(FD.need===2)setTimeout(()=>say('둘! 냠냠, 고마워요!'),50);
  FD.fed++;sh.querySelector('.sb').style.transform=`scale(${1+FD.fed*.05})`;
  setTimeout(()=>{heartBurst(m.x,m.y);},300);
  if(FD.fed<FD_MEALS){if(FD.need===1)say(pick(['냠냠, 맛있어요!','고마워요!','정말 맛있어요!']));setTimeout(fdRound,1800);return;}
  FD.cycles++;const g=FD.gen;
  setTimeout(()=>{if(FD.gen!==g)return;fdFace('full');say('배불러요! 고마워요!');cheer('배불러요!');sparkle();
    const r=sh.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,30,r.width*.5,true);
    FD.fish.forEach(f=>f.el.animate([{opacity:1},{opacity:0,transform:'scale(.6)'}],{duration:400,fill:'forwards'}));
    const a=$('fdAsk');if(a)a.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});},700);
  setTimeout(()=>fdBurp(g),2900);}
// 2단계: 배가 빵빵! 배를 톡톡 세 번 → 꺼억
function fdBurp(g){if(FD.gen!==g||S.screen!=='feed')return;FD.fish.forEach(f=>f.el.remove());FD.fish=[];
  FD.stage='burp';FD.act=true;FD.n=0;FD.busy=false;FD.last=Date.now();fdProg();say(`배가 빵빵해요! ${FW().who} 배를 톡톡 두드려 줘요`);}
function fdPoke(){const sh=FD.shark;if(!sh)return;FD.last=Date.now();sh.classList.remove('squish');void sh.offsetWidth;sh.classList.add('squish');
  if(FD.stage==='brush'){fdBrushGo();return;}if(FD.stage==='rinse'){fdRinseGo();return;}
  if(FD.stage==='play'){sfx.giggle();const r=sh.getBoundingClientRect();heartBurst(r.left+r.width/2,r.top+r.height*.35);return;}
  if(FD.stage!=='burp'||!FD.act)return;const n=++FD.n,g=FD.gen;
  tone({f:200,f2:130,d:.14,v:.3,type:'triangle'});noise({f:400,d:.08,v:.12});   // 둥둥
  if(n<3){say(n===1?'톡톡':'통통');return;}
  FD.act=false;
  setTimeout(()=>{if(FD.gen!==g)return;fdFace('wait');const m=mouthXY(),a=$('fdArea').getBoundingClientRect();
    tone({f:140,f2:70,d:.45,v:.35,type:'sawtooth'});tone({f:110,f2:60,t:.05,d:.4,v:.2,type:'triangle'});noise({f:300,d:.35,v:.15,q:.6});
    for(let i=0;i<4;i++)setTimeout(()=>puffAt($('fdArea'),m.x-a.left-FD.S*.06*i,m.y-a.top-FD.S*.03*i,FD.S*.12),i*90);
    say('꺼억! 아이, 시원해!');sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');
    setTimeout(()=>{if(FD.gen===g)fdFace('full');},900);setTimeout(()=>fdBrush(g),2600);},250);}
// 도구(칫솔·컵)를 밥 놓던 자리에 놓아요
function fdTool(img,ar){const A=$('fdArea'),R=FD.region,z=Math.min(R.w*.5,R.h*.55,FD.S*.5),w=z,h=z/ar,el=document.createElement('div');el.className='fdtool';
  el.innerHTML=`<img src="chars/${img}.webp" alt="">`;Object.assign(el.style,{left:(R.x+R.w/2-w/2)+'px',top:(R.y+R.h/2-h/2)+'px',width:w+'px',height:h+'px'});
  A.appendChild(el);if(FD.tool)FD.tool.remove();FD.tool=el;return el;}
// 3단계: 칫솔로 치카치카 네 번
function fdBrush(g){if(FD.gen!==g||S.screen!=='feed')return;FD.stage='brush';FD.act=true;FD.n=0;FD.last=Date.now();fdProg();fdFace('wait');
  const el=fdTool('fd_brush',IMG_AR.fd_brush);el.addEventListener('pointerdown',e=>{e.preventDefault();fdBrushGo();});
  say('밥 먹었으면 치카치카! 칫솔을 톡 눌러요');}
function fdBrushGo(){if(FD.stage!=='brush'||!FD.act||FD.mv||!FD.tool)return;FD.mv=true;FD.last=Date.now();const g=FD.gen,el=FD.tool,A=$('fdArea'),a=A.getBoundingClientRect();
  const r=el.getBoundingClientRect(),m=mouthXY(),dx=m.x-(r.left+r.width*.78),dy=m.y-(r.top+r.height*.22);   // 칫솔모(오른쪽 위)가 입에 닿게
  fdFace('wait');const T=(x,y,rt=0)=>`translate(${dx+x}px,${dy+y}px) rotate(${rt}deg)`,q=r.width*.1;
  el.animate([{transform:'none'},{transform:T(0,-r.height*.1),offset:.25},{transform:T(-q,0,-6),offset:.37},{transform:T(q,0,6),offset:.49},{transform:T(-q,0,-6),offset:.61},
    {transform:T(q,0,6),offset:.73},{transform:T(0,0),offset:.8},{transform:'none'}],{duration:1700,easing:'ease-in-out'});
  for(let i=0;i<4;i++)setTimeout(()=>{if(FD.gen!==g)return;noise({f:3200+Math.random()*900,d:.12,v:.09,q:1.3});
    const f=document.createElement('i');f.className='foam';const z=FD.S*(.05+Math.random()*.04);
    f.style.cssText=`left:${m.x-a.left-z/2+(Math.random()-.5)*FD.S*.12}px;top:${m.y-a.top-z/2+(Math.random()-.5)*FD.S*.08}px;width:${z}px;height:${z}px;z-index:11`;
    f.addEventListener('animationend',e=>{if(e.animationName==='foamFade')f.remove();});A.appendChild(f);},500+i*200);
  const n=++FD.n;setTimeout(()=>{if(FD.gen===g)say(['치카치카!','위에도 치카치카!','아래도 치카치카!','반짝반짝!'][Math.min(n,4)-1]);},450);
  setTimeout(()=>{if(FD.gen!==g)return;FD.mv=false;if(n<4)return;FD.act=false;fdShine(m.x-a.left,m.y-a.top);say('이가 반짝반짝 깨끗해요!');
    setTimeout(()=>fdRinse(g),2000);},1750);}
function fdShine(x,y){const A=$('fdArea');sparkle();for(let i=0;i<5;i++){const t=document.createElement('i');t.className='fdshine';t.textContent='✦';const z=FD.S*(.06+Math.random()*.05);
  t.style.cssText=`left:${x-z/2+(Math.random()-.5)*FD.S*.2}px;top:${y-z/2+(Math.random()-.5)*FD.S*.14}px;font-size:${z.toFixed(0)}px;animation-delay:-${(i*.13).toFixed(2)}s`;
  A.appendChild(t);setTimeout(()=>t.remove(),2000);}}
// 4단계: 컵으로 가글가글 퉤 (두 번)
function fdRinse(g){if(FD.gen!==g||S.screen!=='feed')return;FD.stage='rinse';FD.act=true;FD.n=0;FD.last=Date.now();fdProg();fdFace('full');
  const el=fdTool('fd_cup',IMG_AR.fd_cup);el.addEventListener('pointerdown',e=>{e.preventDefault();fdRinseGo();});
  say('물로 가글가글 헹궈요! 컵을 톡 눌러요');}
function fdRinseGo(){if(FD.stage!=='rinse'||!FD.act||FD.mv||!FD.tool)return;FD.mv=true;FD.last=Date.now();const g=FD.gen,el=FD.tool,A=$('fdArea'),a=A.getBoundingClientRect();
  const r=el.getBoundingClientRect(),m=mouthXY(),dx=m.x-(r.left+r.width*.5),dy=m.y-(r.top+r.height*.1);
  el.animate([{transform:'none'},{transform:`translate(${dx*.6}px,${dy*.6-r.height*.3}px)`,offset:.3},{transform:`translate(${dx}px,${dy}px) rotate(-40deg)`,offset:.5},
    {transform:`translate(${dx}px,${dy}px) rotate(-40deg)`,offset:.6},{transform:'none'}],{duration:1400,easing:'ease-in-out'});
  setTimeout(()=>{if(FD.gen!==g)return;fdFace('full');say('가글가글');for(let i=0;i<10;i++)tone({f:260+Math.random()*260,t:i*.09,d:.08,v:.12,type:'triangle'});},800);
  setTimeout(()=>{if(FD.gen!==g)return;fdFace('wait');say('퉤!');tone({f:500,f2:200,d:.15,v:.25});noise({f:1800,d:.2,v:.12,q:.8});
    for(let i=0;i<9;i++){const d=document.createElement('i');d.className='wdrop';d.style.cssText=`left:${m.x-a.left}px;top:${m.y-a.top}px;z-index:11;--dx:${((FW().flip?-1:1)*(-4-Math.random()*12)).toFixed(1)}vmin;--dy:${(4+Math.random()*12).toFixed(1)}vmin;--d:${(.45+Math.random()*.3).toFixed(2)}s`;
      d.addEventListener('animationend',()=>d.remove());A.appendChild(d);}},2100);
  const n=++FD.n;
  setTimeout(()=>{if(FD.gen!==g)return;FD.mv=false;fdFace('full');if(n<2){say('한 번 더 가글가글!');return;}FD.act=false;fdShine(m.x-a.left,m.y-a.top);setTimeout(()=>fdFinale(g),900);},2700);}
// 끝: 깨끗하게 다 했어요! → 다음엔 다른 친구
function fdFinale(g){if(FD.gen!==g||S.screen!=='feed')return;FD.stage='play';fdProg();if(FD.tool){FD.tool.remove();FD.tool=null;}
  const sh=FD.shark;fdFace('wait');cheer('냠냠 치카치카 다 했어요!');sfx.fanfare();say(`${FW().who} 기분 최고예요! 고마워요!`);
  const r=sh.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,46,r.width*.6,true);
  [0,700,1400].forEach(t=>setTimeout(()=>{if(FD.gen!==g)return;sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');heartBurst(r.left+r.width/2,r.top+r.height*.3);},t));
  setTimeout(()=>{if(FD.gen!==g||S.screen!=='feed')return;FD.fed=0;FD.stage='eat';FD.act=false;
    FD.world=FD.world==='sea'?'land':'sea';document.body.classList.toggle('land',FD.world==='land');   // 다음엔 다른 친구
    fdBuild();fdProg();say(`이번엔 ${FW().who}한테 밥 줘요!`);setTimeout(()=>{if(FD.gen===g)fdRound();},1800);},4600);}
function heartBurst(x,y){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='pt';s.textContent='♥';
  const a=-Math.PI/2+(Math.random()-.5)*1.6,r=60+Math.random()*80;
  s.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;--r:${(Math.random()*60-30)|0}deg;--c:#ff6b9a;--s:${22+Math.random()*18}px`;
  s.addEventListener('animationend',()=>s.remove());document.body.appendChild(s);}}
$('goFeed').onclick=()=>{sfx.tap();say(FD.world==='land'?'토끼한테 밥 줘요':'상어한테 밥 줘요');fdStart();};
$('fdBack').onclick=()=>{sfx.tap();FD.gen++;FD.mv=false;show('home');};

/* ================= 그림자 맞추기: 친구를 자기 그림자에 쏙 ================= */
const SH={story:0,step:0,items:[],done:0,n:0,last:0,gen:0,met:[]};
// 진행 그림: 바다 친구 · 숲속 친구 · 섞여서 · 퍼레이드
const shIcons=()=>[charSrc(CHARS[0]),charSrc(LAND[0]||CHARS[1]),'p_star','st_rainbow'];
function shStart(){show('shadow');SH.story=0;SH.step=0;SH.met=[];shRound();}
function shRound(){if(S.screen!=='shadow')return;SH.gen++;const A=$('shArea');A.innerHTML='';const W=A.clientWidth,H=A.clientHeight,land=W>=H;
  // 한 이야기 = 바다 친구 → 숲속 친구 → 섞여서 (2쌍 → 3쌍 → 4쌍, 처음 이야기는 2·2·3쌍)
  const n=(SH.story===0?[2,2,3]:[2,3,4])[SH.step],mix=SH.step===2&&LAND.length,inLand=LAND.length&&SH.step>0;document.body.classList.toggle('land',!!inLand);
  const pool=shuffle((mix?[...CHARS,...LAND]:inLand?LAND:CHARS).slice()).slice(0,n),z=Math.min(W/n*(land?.62:.8),H*.3);
  SH.items=[];SH.done=0;SH.n=n;SH.last=Date.now();pool.forEach(c=>{if(!SH.met.includes(c))SH.met.push(c);});
  // 친구 줄은 그림자 줄과 순서가 꼭 다르게 (바로 밑에 자기 그림자가 있으면 맞출 게 없어요)
  const so=shuffle(pool.slice());let fo;do fo=shuffle(pool.slice());while(n>1&&fo.every((c,i)=>c===so[i]));
  so.forEach((ch,i)=>{const s=document.createElement('img');s.className='shd';s.src=charSrc(ch);s.alt='';
    const x=W*(i+.5)/n-z/2,y=H*.36-z/2;Object.assign(s.style,{left:x+'px',top:y+'px',width:z+'px',height:z+'px'});A.appendChild(s);SH.items.push({ch,shd:s,sx:x,sy:y,z});});
  fo.forEach((ch,i)=>{const it=SH.items.find(t=>t.ch===ch),f=document.createElement('img');f.className='shf';f.src=charSrc(ch);f.alt='';
    it.f=f;it.hx=it.x=W*(i+.5)/n-z/2;it.hy=it.y=H*.76-z/2;Object.assign(f.style,{left:it.x+'px',top:it.y+'px',width:z+'px',height:z+'px'});A.appendChild(f);shDrag(it);});
  stepBar('shStars',shIcons(),SH.step);
  setTimeout(()=>{if(S.screen!=='shadow')return;say(SH.step===0?(SH.story===0?'친구를 자기 그림자에 쏙 넣어줘요! 톡 눌러도 돼요':'바다 친구들 그림자예요!'):SH.step===1?'이번엔 숲속 친구들 그림자예요!':'바다 친구랑 숲속 친구가 섞였어요! 누구 그림자일까요?');},500);}
// 끌어서 맞추거나, 톡 누르면 자기 그림자로 폴짝 날아가요 (아기는 끌기보다 톡을 먼저 해요)
function shDrag(it){const el=it.f;let ox=0,oy=0;
  const rel=()=>{it.drag=false;el.classList.remove('hold');el.style.zIndex='';SH.last=Date.now();};
  dragTap(el,{can:()=>!it.ok&&!it.fly,
    down:e=>{ox=e.clientX-it.x;oy=e.clientY-it.y;el.classList.remove('back');sfx.pick();SH.last=Date.now();},
    start:()=>{it.drag=true;el.classList.add('hold');el.style.zIndex=20;},
    move:e=>{it.x=e.clientX-ox;it.y=e.clientY-oy;el.style.left=it.x+'px';el.style.top=it.y+'px';},
    tap:()=>shFly(it),
    drop:()=>{rel();const cx=it.x+it.z/2,cy=it.y+it.z/2,near=SH.items.filter(t=>!t.ok).map(t=>({t,dd:Math.hypot(cx-(t.sx+t.z/2),cy-(t.sy+t.z/2))})).sort((a,b)=>a.dd-b.dd)[0];
      if(near&&near.dd<it.z*.55){if(near.t===it)shMatch(it);else shWrong(it,near.t);}else shHome(it);},
    lost:()=>{rel();shHome(it);}});}
function shFly(it){const el=it.f,g=SH.gen;it.fly=true;el.style.zIndex=20;SH.last=Date.now();tone({f:500,f2:1100,d:.18,v:.14});
  hopTo(el,it.sx-it.x,it.sy-it.y,1,600,80).then(()=>{it.fly=false;if(SH.gen!==g)return;el.style.zIndex='';
    el.style.left=it.sx+'px';el.style.top=it.sy+'px';el.getAnimations().forEach(a=>a.cancel());shMatch(it);});}
function shHome(it){sfx.drop();it.f.classList.add('back');it.x=it.hx;it.y=it.hy;it.f.style.left=it.x+'px';it.f.style.top=it.y+'px';}
let shNo=0;
function shWrong(it,t){sfx.nope();t.shd.animate([{transform:'none'},{transform:'rotate(-6deg)'},{transform:'rotate(6deg)'},{transform:'none'}],{duration:450});
  if(Date.now()-shNo>2500){shNo=Date.now();say(`여기는 ${eul(t.ch.name).slice(0,-1)} 그림자예요`);}shHome(it);}
function shMatch(it){it.ok=true;it.f.classList.add('back');it.x=it.sx;it.y=it.sy;it.f.style.left=it.x+'px';it.f.style.top=it.y+'px';
  tone({f:700,f2:1500,d:.08,v:.2});sparkle();say(`${it.ch.name}!`);SH.done++;
  setTimeout(()=>{it.f.remove();it.shd.classList.add('lit');const r=it.shd.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,16,r.width*.6);},380);
  if(SH.done<SH.n)return;
  setTimeout(()=>{cheer('그림자를 다 찾았어요!');say('와! 다 찾았어요!');sfx.fanfare();
    SH.items.forEach((t,j)=>setTimeout(()=>{t.shd.classList.remove('cheer');void t.shd.offsetWidth;t.shd.classList.add('cheer');},j*150));},700);
  const g=SH.gen;setTimeout(()=>{if(S.screen!=='shadow'||SH.gen!==g)return;SH.step++;SH.step<3?shRound():shParade();},3600);}
// 세 단계를 다 하면 만난 친구들이 줄지어 행진해요 (톡 누르면 폴짝)
function shParade(){const g=++SH.gen,A=$('shArea'),W=A.clientWidth,H=A.clientHeight;A.innerHTML='';SH.items=[];stepBar('shStars',shIcons(),3);
  document.body.classList.add('land');say('그림자를 모두 찾았어요! 친구들 퍼레이드!');cheer('친구들 퍼레이드!');sfx.fanfare();
  const list=shuffle(SH.met.slice()).slice(0,8),z=Math.min(H*.28,W*.17),gap=650,dur=6500;
  list.forEach((ch,i)=>{const w=document.createElement('div');w.className='paradeW';w.innerHTML=`<img src="${charSrc(ch)}" alt="" style="animation-delay:-${(i*.13).toFixed(2)}s">`;
    Object.assign(w.style,{left:(-z*1.1)+'px',top:(H*.6-z/2+(i%2?z*.18:-z*.05))+'px',width:z+'px',height:z+'px'});A.appendChild(w);
    w.addEventListener('pointerdown',e=>{e.preventDefault();w.classList.remove('jump');void w.offsetWidth;w.classList.add('jump');sfx.giggle();say(ch.name);});
    w.animate([{transform:'translateX(0)'},{transform:`translateX(${W+z*2.3}px)`}],{duration:dur,delay:i*gap,easing:'linear',fill:'both'});
    setTimeout(()=>{if(SH.gen===g)bell(mtof(PENT[i%PENT.length]),0,.16,.5);},i*gap+300);});
  setTimeout(()=>{if(S.screen!=='shadow'||SH.gen!==g)return;SH.story++;SH.step=0;SH.met=[];shRound();},dur+list.length*gap+300);}
// 가만히 있으면 손가락이 친구를 그림자로 끌어 보여주기
setInterval(()=>{if(S.screen!=='shadow'||Date.now()-SH.last<6000||SH.items.some(t=>t.drag))return;SH.last=Date.now();const it=SH.items.find(t=>!t.ok&&t.f);if(!it)return;
  ghostHand(it.x+it.z/2,it.y+it.z/2,it.sx+it.z/2,it.sy+it.z/2,{src:charSrc(it.ch),w:it.z,h:it.z});},1000);
$('goShadow').onclick=()=>{sfx.tap();say('그림자 맞추기 해요');shStart();};
$('shBack').onclick=()=>{sfx.tap();show('home');};

/* ================= 친구 악단: 자는 친구 깨우기 → 따라 하기 → 노래 골라 연주 → 불 끄고 공연 (노래를 고르면 다음에 누를 친구가 반짝) ================= */
const MU_NOTES=[60,62,64,65,67,69,71,72];   // 도 레 미 파 솔 라 시 도
const MU_COL=['#ff6b6b','#ff9f43','#ffd93d','#6fd36f','#4fc3f7','#5b8def','#a77bf3','#ff8fc7'];
const MU_NAME=['도','레','미','파','솔','라','시','도'];
// 옛날부터 내려오는 동요 가락 (저작권이 끝난 곡)
const MU_SONGS=[
 {id:'star',name:'작은 별',seq:[0,0,4,4,5,5,4, 3,3,2,2,1,1,0, 4,4,3,3,2,2,1, 4,4,3,3,2,2,1, 0,0,4,4,5,5,4, 3,3,2,2,1,1,0]},
 {id:'bfly',name:'나비야',seq:[4,2,2, 3,1,1, 0,1,2,3,4,4,4, 4,2,2,2, 3,1,1,1, 0,2,4,4,2,2,2]},
 {id:'plane',name:'비행기',seq:[2,1,0,1,2,2,2, 1,1,1, 2,4,4, 2,1,0,1,2,2,2, 1,1,2,1,0]},
 {id:'bridge',name:'런던 다리',seq:[4,5,4,3,2,3,4, 1,2,3, 2,3,4, 4,5,4,3,2,3,4, 1,4,2,0]},
 {id:'boat',name:'노 젓기',seq:[0,0,0,1,2, 2,1,2,3,4, 7,7,7,4,4,4,2,2,2,0,0,0, 4,3,2,1,0]},
];
const MU={song:null,pos:0,keys:[],lastNo:0,idleT:0,world:'sea',step:0,awake:[],gen:0,demo:false,nameT:0};
const muIcon=(c,two)=>'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><path fill="${c}" d="${two?'M22 14 L52 8 V44 a8 7 0 1 1 -5 -6.5 V20 L27 24 V50 a8 7 0 1 1 -5 -6.5 Z':'M30 8 h6 c2 8 14 10 14 22 c-4 -6 -9 -8 -14 -8 V48 a10 8.5 0 1 1 -6 -7.8 Z'}"/></svg>`);
// 진행 그림: 깨우기 · 따라 하기 · 노래 · 공연
const muProg=()=>stepBar('muStars',['ba_bed',muIcon('#4fc3f7'),muIcon('#ff6b9a',true),'p_star'],MU.step);
// 숲속 악단: 친구가 많아져서 들어올 때마다 여섯 명을 새로 뽑아요(+ 유주, 거북이)
let muLandBand=null;
const muBand=()=>{if(!(MU.world==='land'&&LAND.length))return CHARS.slice(0,8);
  if(!muLandBand)muLandBand=[...shuffle(LAND.slice()).slice(0,GIRL?6:7),...(GIRL?[GIRL]:[]),CHARS[4]];return muLandBand;};
function muNote(i,t=0){const f=mtof(MU_NOTES[i]);tone({f,t,d:.55,v:.24});tone({f:f*2,t,d:.25,v:.06});tone({f:f*4,t,d:.06,v:.05});}
function muStart(){muLandBand=null;show('music');document.body.classList.toggle('land',MU.world==='land');muWorldBtn();muStory0('친구 악단이에요! 쉿, 친구들이 자고 있어요. 톡톡 눌러서 깨워요');}
// 1단계: 자는 친구들을 톡톡 깨워요
function muStory0(msg){const g=++MU.gen;MU.step=0;MU.awake=[];MU.song=null;MU.demo=false;$('muSongs').classList.remove('pick');muSongs();muBuild();muProg();MU.idleT=Date.now();
  setTimeout(()=>{if(MU.gen===g&&S.screen==='music')say(msg);},500);}
function muWake(i){if(MU.awake[i])return;MU.awake[i]=true;const k=MU.keys[i];k.classList.remove('sleep');const ch=muBand()[i];
  if(MU.keys.every((_,j)=>MU.awake[j])){const g=MU.gen;MU.step=1;muProg();cheer('모두 일어났어요!');setTimeout(()=>{if(MU.gen===g)say('모두 일어났어요! 이제 같이 연주해요!');},400);
    MU.keys.forEach((kk,j)=>setTimeout(()=>{if(MU.gen===g)muHit(j);},900+j*110));setTimeout(()=>muEcho(g,0),3200);return;}
  if(ch&&Date.now()-MU.nameT>700){MU.nameT=Date.now();say(`${ch.name}!`);}}
// 2단계: 따라 하기 (친구들이 먼저 들려주면 똑같이)
function muEcho(g,k){if(MU.gen!==g||S.screen!=='music')return;MU.step=1;muProg();MU.song=null;muMark();
  const pat=pick(k===0?[[0,2,4],[4,2,0],[0,4,7],[2,1,0]]:[[0,2,4,7],[7,4,2,0],[0,0,4,4],[4,5,4,2]]);MU.demo=true;
  say(k===0?'잘 듣고 따라 해요!':'이번엔 네 번이에요! 잘 들어요');
  pat.forEach((i,j)=>setTimeout(()=>{if(MU.gen===g)muHit(i);},1500+j*650));
  setTimeout(()=>{if(MU.gen!==g)return;MU.demo=false;MU.song={name:'따라 하기',seq:pat,echo:k};MU.pos=0;muMark();say('따라 해 봐요!');MU.idleT=Date.now();},1500+pat.length*650+200);}
// 3단계: 노래 고르기
function muPick(g){if(MU.gen!==g||S.screen!=='music')return;MU.step=2;muProg();MU.idleT=Date.now();$('muSongs').classList.add('pick');say('어떤 노래 할까요? 노래를 골라요!');}
// 4단계: 불을 끄고 친구들이 공연해요 (따라 쳐도 돼요)
function muShow(done){const g=++MU.gen;MU.step=3;muProg();MU.song=null;muMark();cheer(`${done.name} 다 연주했어요!`);say('와! 정말 잘했어요! 이제 불을 끄고 공연해요!');
  const A=$('muArea'),n=document.createElement('div');n.className='munight';n.innerHTML='<i class="lite"></i>';A.prepend(n);
  const seq=done.seq.slice(0,28),T=360,t0=2800;
  seq.forEach((i,j)=>setTimeout(()=>{if(MU.gen!==g)return;muHit(i);const k=MU.keys[i],l=n.querySelector('.lite');if(k&&l)l.style.left=(k.offsetLeft+k.offsetWidth/2)+'px';},t0+j*T));
  const end=t0+seq.length*T+500;
  setTimeout(()=>{if(MU.gen!==g)return;for(let t=0;t<26;t++)noise({t:t*.08+Math.random()*.04,f:1800+Math.random()*1500,d:.06,v:.12,q:2});sfx.fanfare();
    cheer('멋진 공연이었어요!');say('짝짝짝! 멋진 공연이었어요!');burst(innerWidth/2,innerHeight/2,50,Math.min(innerWidth,innerHeight)*.45,true);
    MU.keys.forEach((k,j)=>setTimeout(()=>{if(MU.gen!==g)return;k.querySelector('img').animate([{transform:'none'},{transform:'rotate(10deg) translateY(8%) scale(.95)'},{transform:'none'}],{duration:800});},j*90));
    n.animate([{opacity:1},{opacity:0}],{duration:1200,delay:1500,fill:'forwards'});},end);
  setTimeout(()=>{if(MU.gen!==g||S.screen!=='music')return;   // 다음 이야기는 다른 악단
    if(LAND.length){MU.world=MU.world==='land'?'sea':'land';muLandBand=null;document.body.classList.toggle('land',MU.world==='land');muWorldBtn();}
    muStory0(MU.world==='land'?'이번엔 숲속 친구 악단이에요! 친구들을 깨워요':'이번엔 바다 친구 악단이에요! 친구들을 깨워요');},end+4800);}
function muWorldBtn(){const other=MU.world==='land'?CHARS[0]:(LAND[0]||CHARS[1]);$('muWorld').innerHTML=`<img src="${charSrc(other)}" alt="" style="width:80%;height:80%;object-fit:contain">`;}
function muBuild(){const A=$('muArea');A.innerHTML='';MU.keys=[];const W=A.clientWidth,H=A.clientHeight,cw=W*.94/8,x0=W*.03;
  muBand().forEach((ch,i)=>{const k=document.createElement('div');k.className='key'+(MU.step===0&&!MU.awake[i]?' sleep':'');const bh=H*(.36-i*.022),fz=Math.min(cw*.98,H*.27);
    Object.assign(k.style,{left:(x0+i*cw)+'px',width:cw+'px',bottom:(H*.05)+'px',height:(bh+fz)+'px'});
    k.innerHTML=`<div class="bar" style="--c:${MU_COL[i]};height:${bh}px"></div><img src="${charSrc(ch)}" alt="" style="bottom:${bh-fz*.12}px;width:${fz}px;height:${fz}px">`;
    k.addEventListener('pointerdown',e=>{e.preventDefault();muTap(i);});A.appendChild(k);MU.keys.push(k);});
  muMark();}
function muSongs(){const g=$('muSongs');g.innerHTML='';
  const icon={star:`<svg viewBox="0 0 64 64">${star(32,34,26,'#ffd65a')}</svg>`,bfly:`<img src="chars/st_butterfly.webp" alt="">`,plane:`<img src="chars/st_cloud.webp" alt="">`,
    bridge:`<img src="chars/st_rainbow.webp" alt="">`,boat:`<img src="chars/fish2.webp" alt="">`};
  MU_SONGS.forEach(sg=>{const b=document.createElement('button');b.className=MU.song===sg?'sel':'';b.innerHTML=icon[sg.id]+`<span>${sg.name}</span>`;
    b.onclick=()=>{if(MU.step===3)return;
      if(MU.step<2){MU.gen++;MU.demo=false;MU.keys.forEach((k,j)=>{MU.awake[j]=true;k.classList.remove('sleep');});MU.step=2;muProg();}   // 먼저 노래를 고르면 바로 연주로
      $('muSongs').classList.remove('pick');
      if(MU.song===sg){MU.song=null;say('마음대로 연주해요');}else{MU.song=sg;MU.pos=0;say(`${sg.name} 같이 연주해요! 반짝이는 친구를 눌러요`);}muSongs();muMark();};g.appendChild(b);});}
function muMark(){MU.keys.forEach((k,i)=>k.classList.toggle('next',!!MU.song&&MU.song.seq[MU.pos]===i));}
function muHit(i){const k=MU.keys[i];if(!k)return;muNote(i);k.classList.remove('hit');void k.offsetWidth;k.classList.add('hit');
  const r=k.querySelector('img').getBoundingClientRect(),n=document.createElement('span');n.className='mnote';n.textContent=pick(['♪','♫','♬']);
  n.style.cssText=`left:${r.left+r.width/2}px;top:${r.top}px;--c:${MU_COL[i]};--dx:${(Math.random()-.5)*12}vmin;--r:${(Math.random()*60-30)|0}deg`;
  n.addEventListener('animationend',()=>n.remove());document.body.appendChild(n);}
function muTap(i){const k=MU.keys[i];if(!k)return;muHit(i);MU.idleT=Date.now();
  if(MU.step===0){muWake(i);return;}
  if(!MU.song||MU.demo)return;
  if(MU.song.seq[MU.pos]!==i){if(Date.now()-MU.lastNo>3000){MU.lastNo=Date.now();const nx=MU.keys[MU.song.seq[MU.pos]];nx&&nx.animate([{transform:'none'},{transform:'translateY(-6%)'},{transform:'none'}],{duration:400});}return;}
  MU.pos++;if(MU.pos<MU.song.seq.length){muMark();return;}
  // 노래 끝! 친구들이 차례로 폴짝, 박수
  const done=MU.song;MU.song=null;muMark();
  if(done.echo!==undefined){const g=MU.gen;sparkle();   // 따라 하기 끝
    if(done.echo===0){say('잘했어요! 한 번 더 해요');setTimeout(()=>muEcho(g,1),1800);}else{cheer('따라 하기 최고!');setTimeout(()=>muPick(g),2000);}return;}
  muSongs();if(MU.step===2){muShow(done);return;}
  cheer(`${done.name} 다 연주했어요!`);setTimeout(()=>say('와! 정말 잘 연주했어요!'),400);
  MU.keys.forEach((kk,j)=>setTimeout(()=>{muNote(j);kk.classList.remove('hit');void kk.offsetWidth;kk.classList.add('hit');},600+j*110));
  setTimeout(()=>{for(let t=0;t<14;t++)noise({t:t*.09+Math.random()*.04,f:1800+Math.random()*1500,d:.06,v:.12,q:2});sfx.fanfare();},1600);}
// 노래 따라하기 중에 가만히 있으면 손가락이 반짝이는 친구를 톡
setInterval(()=>{if(S.screen!=='music'||MU.demo||Date.now()-Math.max(MU.idleT,lastTouch)<6000)return;
  if(MU.step===0){MU.idleT=Date.now();const k=MU.keys.find((_,j)=>!MU.awake[j]);if(!k)return;const r=k.querySelector('img').getBoundingClientRect();

function stkName(k){const [t,v]=k.split(':');if(t==='c'){const ch=ALLCH.find(c=>c.id===v);return ch?ch.name:'친구';}if(t==='f')return FCOL[+v][2]+' 물고기';return (SITEMS[v]||['스티커'])[0];}
function stkInner(k){const [t,v]=k.split(':');
  if(t==='c'){const ch=ALLCH.find(c=>c.id===v)||CHARS[0];return `<img src="${charSrc(ch)}" alt="">`;}
  if(t==='f')return fishImg(FCOL[+v]);
  if(PROP_IMG[v])return `<img src="chars/${PROP_IMG[v]}.webp" alt="">`;return `<svg viewBox="0 0 100 100">${(SITEMS[v]||SITEMS.star)[1]}</svg>`;}

function giveSticker(kind,src){return;   // 스티커 모으기는 뺐어요 (놀이 흐름이 끊겨서)
  if(src){if(Date.now()-(ST.last[src]||0)<90000)return;ST.last[src]=Date.now();}   // 그림 저장·사진은 1분 반에 한 번만
  if(!kind)kind='i:'+pick(document.body.classList.contains('land')?['flower','butterfly','mushroom','apple','carrot','rainbow','sun','cloud','heart']:['star','shell','pearl','coral','weed','chest','heart']);
  if(kind==='fish')kind='f:'+pick(FISH_COLS);
  const shiny=Math.random()<.15;
  ST.list.push({k:kind,shiny,placed:false,x:.5,y:.5,id:Date.now()+Math.random()});saveST();syncBadge();
  const R=$('reward');$('rewardStk').innerHTML=`<div class="stk${shiny?' shiny':''}">${stkInner(kind)}</div>`;
  R.classList.remove('pop');R.style.opacity=1;R.classList.add('on');void R.offsetWidth;R.classList.add('pop');
  sfx.fanfare();setTimeout(()=>say(shiny?'반짝반짝 스티커를 받았어요!':`${stkName(kind)} 스티커를 받았어요!`),300);
  setTimeout(()=>{ // 집 버튼 쪽으로 쏙 날아가기 (첫 화면 '내 바다'에 모여요)
    const btn=document.querySelector('.screen.on [data-ic="home"]'),rs=$('rewardStk');
    const a=rs.getBoundingClientRect(),t=btn?btn.getBoundingClientRect():{left:20,top:20,width:60,height:60};
    const dx=t.left+t.width/2-(a.left+a.width/2),dy=t.top+t.height/2-(a.top+a.height/2);
    const an=rs.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(.15)`}],{duration:650,easing:'ease-in',fill:'forwards'});
    R.querySelector('b').animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});R.querySelector('.rays').animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});
    let done=false;const fin=()=>{if(done)return;done=true;R.classList.remove('on','pop');an.cancel();R.querySelectorAll('b,.rays').forEach(el=>el.getAnimations().forEach(x=>x.cancel()));
      if(btn){btn.classList.remove('got');void btn.offsetWidth;btn.classList.add('got');}sfx.pop();};
    an.onfinish=fin;setTimeout(fin,1000);},1700);}

function seaSize(k){const A=$('seaArea');return Math.min(A.clientWidth,A.clientHeight)*.21*stkSize(k);}

function placedEl(s){const A=$('seaArea'),z=seaSize(s.k),el=document.createElement('div');
  el.className='stk'+(s.shiny?' shiny':'')+(s.k.startsWith('f:')?' swim':s.k.startsWith('c:')?' bob':'');
  el.style.cssText=`width:${z}px;height:${z}px;left:${s.x*A.clientWidth-z/2}px;top:${s.y*A.clientHeight-z/2}px;animation-delay:-${(s.id%3).toFixed(2)}s`;

function dragTap(el,h){let d=null;
