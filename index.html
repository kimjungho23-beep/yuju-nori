<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd3f7">
<title>유주 놀이터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sea1:#c4f1ff;--sea2:#86d4f6;--sea3:#55b4e6;--ink:#2b3a55;--pink:#ff8fb1;--yellow:#ffd65a;--green:#5ccf95;--purple:#b8a6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sea1),var(--sea2) 55%,var(--sea3));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;pointer-events:none}

/* 배경 거품 */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bub{position:absolute;bottom:-80px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.35) 30%,rgba(255,255,255,.08) 70%);
  border:2px solid rgba(255,255,255,.65);animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-120vh)}}

.screen{position:fixed;inset:0;display:none;z-index:1}
.screen.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:max(14px,2.2vmin);z-index:60;pointer-events:none}
.rbtn{pointer-events:auto;width:clamp(58px,9vmin,86px);height:clamp(58px,9vmin,86px);border-radius:50%;border:none;background:#fff;
  box-shadow:0 6px 0 rgba(30,90,140,.18);font-size:clamp(28px,4.6vmin,44px);display:grid;place-items:center;transition:transform .1s}
.rbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,90,140,.18)}
.rbtn.off{opacity:.6}
.musicBtn{position:relative}
#ver{position:absolute;right:max(12px,2vmin);bottom:max(8px,1.4vmin);font-size:clamp(12px,1.8vmin,16px);color:rgba(255,255,255,.85);pointer-events:none}
.musicBtn.off::after{content:'';position:absolute;left:16%;right:16%;top:calc(50% - 3px);height:6px;border-radius:6px;background:#ff5a6e;transform:rotate(-40deg)}
#toast{position:fixed;left:50%;top:max(18px,3vmin);transform:translate(-50%,-150%);z-index:200;pointer-events:none;background:rgba(43,58,85,.88);color:#fff;
  padding:1.4vmin 3.2vmin;border-radius:99px;font-size:clamp(16px,2.8vmin,26px);white-space:nowrap;transition:transform .3s ease}
#toast.on{transform:translate(-50%,0)}

/* 홈 */
.homeWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin}
.title{font-size:clamp(40px,9.5vmin,110px);color:#fff;letter-spacing:.04em;font-weight:400;
  text-shadow:0 .07em 0 #3a9fd6,0 .12em .2em rgba(0,60,120,.25);animation:bob 3s ease-in-out infinite}
.title span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2vmin)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-2vmin) rotate(-4deg)}}
.menu{display:grid;grid-template-columns:repeat(3,auto);gap:3.6vmin 4vmin;justify-content:center;padding:0 16px}
.homeWrap{gap:4vmin}
.card{position:relative;width:clamp(116px,21vmin,220px);aspect-ratio:1;border:none;border-radius:13%;background:#fff;
  box-shadow:0 1.4vmin 0 var(--c),0 2.2vmin 3vmin rgba(0,60,120,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;
  transition:transform .12s}
.card:active{transform:translateY(1vmin) scale(.97)}
.card .ic{font-size:clamp(48px,9.5vmin,96px);line-height:1}
.card b{font-weight:400;font-size:clamp(20px,4.2vmin,42px)}
.card.soon{opacity:.82}
.card i{position:absolute;top:-1.6vmin;right:-1.6vmin;font-style:normal;background:var(--c);color:#fff;padding:.6vmin 1.6vmin;border-radius:99px;
  font-size:clamp(14px,2.4vmin,22px);transform:rotate(8deg);box-shadow:0 .5vmin 0 rgba(0,0,0,.08)}
.wig{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}

.lane{position:absolute;bottom:6vmin;left:0;width:100%;height:20vmin;pointer-events:none}
.lane .swim{position:absolute;left:0;top:0;width:20vmin;animation:swim 16s linear infinite}
.lane .swim img{width:100%;animation:bob 1.6s ease-in-out infinite}
@keyframes swim{from{transform:translateX(-25vmin)}to{transform:translateX(calc(100vw + 5vmin))}}

/* 그림 고르기 */
.selWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;padding:12vmin 16px 4vmin}
.subtitle{font-weight:400;font-size:clamp(30px,6.5vmin,64px);color:#fff;text-shadow:0 .08em 0 #3a9fd6}
.picGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:3vmin;max-width:100vmin}
.pic{position:relative;width:clamp(110px,17vmin,180px);aspect-ratio:1;border:none;border-radius:14%;background:#fff;padding:1vmin;
  box-shadow:0 1.1vmin 0 rgba(30,90,140,.2);transition:transform .12s}
.pic:active{transform:scale(.94)}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:11%;display:block}
.pic b{position:absolute;left:50%;bottom:-1.8vmin;transform:translateX(-50%);background:var(--yellow);font-weight:400;
  font-size:clamp(18px,3.2vmin,30px);padding:.3vmin 2vmin;border-radius:99px;white-space:nowrap}
.pic.add{background:rgba(255,255,255,.55);border:.6vmin dashed #fff;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(40px,8vmin,80px);color:#fff}
.pic.add small{font-size:clamp(16px,2.8vmin,26px)}
.pic .del{position:absolute;top:-1.4vmin;right:-1.4vmin;width:clamp(28px,4.4vmin,40px);height:clamp(28px,4.4vmin,40px);border-radius:50%;
  background:#ff6b8b;color:#fff;font-size:clamp(18px,3vmin,28px);display:grid;place-items:center}
.pieceRow{display:flex;gap:2.4vmin;background:rgba(255,255,255,.45);padding:1.6vmin 2.4vmin;border-radius:99px}
.pbtn{border:none;background:#fff;border-radius:2.4vmin;padding:1.2vmin 1.6vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;
  box-shadow:0 .7vmin 0 rgba(30,90,140,.16);opacity:.75}
.pbtn.sel{background:var(--yellow);opacity:1;transform:translateY(-.4vmin)}
.pbtn .mini{display:grid;gap:3px;width:clamp(34px,5.6vmin,52px);height:clamp(34px,5.6vmin,52px)}
.pbtn .mini i{background:var(--sea3);border-radius:3px}
.pbtn .mini.sil i{background:#2f4a7a;border-radius:50% 50% 40% 40%;opacity:.55}
.pbtn small{font-size:clamp(13px,2.1vmin,20px)}

/* 게임 */
#stage{position:absolute;inset:0;overflow:hidden}
.board{position:absolute;border-radius:2.2vmin}
.board.grid{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 .6vmin rgba(255,255,255,.85)}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board.grid canvas{border-radius:2.2vmin}
.board .full{display:none}
.board.cheer{background:none;box-shadow:none;animation:cheer 1.1s ease-in-out infinite}
.board.cheer .full{display:block}
.board.cheer .guide{display:none}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-4%) scale(1.03,.98)}55%{transform:translateY(0) scale(1.02,.97)}}
.piece{position:absolute;touch-action:none;filter:drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.28));transition:transform .15s;animation:popsoft .3s}
.piece.grid{border-radius:1.2vmin}
.piece.hold{transform:scale(1.07);filter:drop-shadow(0 2vmin 1.6vmin rgba(0,50,100,.3))}
.piece.locked{transition:left .22s ease-out,top .22s ease-out;filter:none;border-radius:0}
.piece.hint{animation:hint 1s}
.piece.back{transition:left .4s cubic-bezier(.3,1.35,.5,1),top .4s cubic-bezier(.3,1.35,.5,1),transform .15s}
.slotHint{position:absolute;z-index:3;pointer-events:none;border-radius:1.2vmin;background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 .8vmin #fff,0 0 3vmin 1vmin rgba(255,255,255,.9);animation:slotHint 1.6s ease-out forwards}
@keyframes slotHint{0%,30%,60%{opacity:1}15%,45%{opacity:.25}100%{opacity:0}}
@keyframes popin{from{transform:scale(0)}70%{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes popsoft{from{transform:scale(.7)}70%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes hint{0%,100%{transform:none}20%{transform:rotate(-7deg) scale(1.06)}40%{transform:rotate(7deg) scale(1.06)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}

#stage.enter{animation:slideIn .3s ease-out}
#stage.leave{animation:slideOut .45s ease-in forwards}
@keyframes slideIn{from{transform:translateX(6vw);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(-30vw);opacity:0}}

/* 그림 그리기 */
.dwrap{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:1.8vmin;padding:max(12px,1.8vmin) max(14px,2.2vmin)}
.dtop{grid-column:1/-1;display:flex;align-items:center;gap:1.8vmin}
.dtop .sp{flex:1}
.dtop .rbtn{border-radius:2.6vmin}
.tools{display:flex;flex-direction:column;gap:1.5vmin;justify-content:center}
.colors{display:grid;grid-template-columns:repeat(2,auto);align-content:center;gap:1.6vmin}
.paperBox{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.paper{position:relative;background:#fff;border-radius:2vmin;overflow:hidden;touch-action:none;
  box-shadow:0 1vmin 0 rgba(30,90,140,.18),0 2vmin 4vmin rgba(0,60,120,.15)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lineCv{pointer-events:none}
.tbtn{position:relative;width:clamp(56px,10vmin,92px);height:clamp(56px,10vmin,92px);border:none;border-radius:2.6vmin;background:#fff;
  font-size:clamp(28px,5.6vmin,52px);box-shadow:0 .7vmin 0 rgba(30,90,140,.18);display:grid;place-items:center;transition:transform .12s,background .12s}
.tbtn.sel{background:var(--yellow);transform:scale(1.1)}
.tbtn .bar{position:absolute;left:18%;right:18%;bottom:9%;height:12%;border-radius:99px;background:var(--cc)}
.tbtn img{width:72%;height:72%;object-fit:contain}
.tbtn .dot{border-radius:50%;background:var(--ink)}
.cbtn{width:clamp(44px,7.6vmin,70px);height:clamp(44px,7.6vmin,70px);border-radius:50%;border:.6vmin solid #fff;background:var(--c);
  box-shadow:0 .6vmin 0 rgba(0,0,0,.12);transition:transform .12s}
.cbtn.sel{transform:scale(1.2);box-shadow:0 0 0 .5vmin var(--c),0 .8vmin 0 rgba(0,0,0,.12)}
.overlay{position:absolute;inset:0;z-index:90;background:rgba(25,70,120,.45);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex;animation:fadein .25s}
.ovBox{background:rgba(255,255,255,.9);border-radius:4vmin;padding:3vmin 4vmin 4vmin;display:flex;flex-direction:column;align-items:center;gap:3vmin;max-height:100%;overflow:auto}
.ovBox h3{font-weight:400;font-size:clamp(24px,5vmin,48px)}
.ovGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4vmin;max-width:94vmin}
.ovGrid .pic{width:clamp(96px,15vmin,160px)}
.ovGrid .pic.blank{display:grid;place-items:center;font-size:clamp(18px,3vmin,28px);color:#9ab}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (orientation:portrait){
  .dwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  .paperBox{grid-row:2}.tools{grid-row:3;flex-direction:row;justify-content:center;flex-wrap:wrap}
  .colors{grid-row:4;grid-template-columns:repeat(5,auto);justify-content:center}
}

/* 옷입히기 */
#dress{background:linear-gradient(180deg,#ffe6f1,#ffd0e4 60%,#ffc0da)}
.dsWrap{position:absolute;inset:0;display:grid;grid-template-columns:44% 1fr;gap:2vmin;padding:max(14px,2.2vmin);padding-top:max(14px,2.2vmin)}
.dollStage{position:relative;min-height:0;overflow:hidden;border-radius:4vmin;
  background:radial-gradient(ellipse at 50% 35%,#fff 0,rgba(255,255,255,.7) 35%,rgba(255,255,255,0) 70%)}
.floor{position:absolute;left:12%;right:12%;bottom:3%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#ffadc9 0,rgba(255,173,201,0) 70%)}
.doll{position:absolute;inset:2% 4% 2%}
.doll svg{width:100%;height:100%;display:block;animation:sway 4s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.doll.hop svg{animation:hop2 .6s ease}
@keyframes hop2{0%,100%{transform:none}35%{transform:translateY(-5%) scale(1.02,.98)}65%{transform:translateY(0) scale(1.03,.97)}}
.doll .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.doll g.pop{animation:pop .55s ease;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fh{position:absolute;bottom:-8%;color:#fff;font-size:clamp(20px,4vmin,40px);opacity:.8;animation:floatUp 7s linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.closet{display:flex;flex-direction:column;gap:2vmin;min-height:0;background:rgba(255,255,255,.65);border-radius:4vmin;padding:2.4vmin;margin-top:clamp(64px,10.5vmin,100px)}
.dtabs{display:flex;gap:1.6vmin;justify-content:center}
.dtab{width:clamp(56px,10vmin,90px);height:clamp(56px,10vmin,90px);border:none;border-radius:2.6vmin;background:#fff;font-size:clamp(28px,5.4vmin,50px);
  box-shadow:0 .7vmin 0 rgba(200,80,130,.18);display:grid;place-items:center;transition:transform .12s}
.dtab.sel{background:#ff8fb8;transform:translateY(-.6vmin) scale(1.06)}
.ditems{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;align-content:start;padding:1vmin}
.ditem{position:relative;aspect-ratio:1;border:none;border-radius:3vmin;background:#fff;box-shadow:0 .8vmin 0 rgba(200,80,130,.15);padding:.8vmin;transition:transform .12s}
.ditem:active{transform:scale(.93)}
.ditem svg{width:100%;height:100%;display:block}
.ditem.on{box-shadow:0 0 0 .7vmin #ff6b9a,0 .8vmin 0 rgba(200,80,130,.15)}
.ditem.on::after{content:'♥';position:absolute;top:-1.2vmin;right:-1.2vmin;width:4.4vmin;height:4.4vmin;border-radius:50%;background:#ff6b9a;color:#fff;
  display:grid;place-items:center;font-size:2.6vmin}
.dacts{display:flex;justify-content:center;gap:3vmin}
.abtn{border:none;background:var(--c);color:#fff;border-radius:99px;padding:1vmin 3vmin;font-size:clamp(26px,4.6vmin,44px);display:flex;align-items:center;gap:1vmin;
  box-shadow:0 .8vmin 0 rgba(0,0,0,.12)}
.abtn small{font-size:clamp(16px,2.8vmin,26px)}
.abtn:active{transform:translateY(.6vmin)}
@media (orientation:portrait){
  .dsWrap{grid-template-columns:1fr;grid-template-rows:52% 1fr;padding-top:clamp(70px,11vmin,100px)}
  .closet{margin-top:0}
  .ditems{grid-template-columns:repeat(4,1fr)}
}

/* 공통 */
.area{position:absolute;inset:0;overflow:hidden}
.stars{display:flex;gap:.5vmin;align-self:center;font-size:clamp(20px,4.2vmin,40px);color:rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,60,120,.15)}
.stars .on{color:#ffd65a;animation:pop .45s}

/* 비눗방울 */
.bb{position:absolute;bottom:0;touch-action:none;animation:bbRise var(--dur) linear forwards}
@keyframes bbRise{from{transform:translateY(100%)}to{transform:translateY(calc(-1 * var(--rise)))}}
.bbw{position:absolute;inset:0;border-radius:50%;animation:bbWob 3s ease-in-out infinite;
  background:radial-gradient(circle at 30% 27%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.25) 20%,rgba(200,240,255,.15) 55%,rgba(255,190,235,.35) 84%,rgba(255,255,255,.75) 100%);
  box-shadow:inset 0 0 2vmin rgba(255,255,255,.8),0 0 1.2vmin rgba(255,255,255,.45)}
.bbw img{position:absolute;left:16%;top:16%;width:68%;height:68%}
@keyframes bbWob{0%,100%{transform:translateX(-7%) scale(1,1)}25%{transform:translateX(0) scale(1.04,.96)}50%{transform:translateX(7%)}75%{transform:translateX(0) scale(.96,1.04)}}
.bbChar{position:fixed;z-index:50;pointer-events:none;animation:bbOut 1.1s ease-in forwards}
@keyframes bbOut{0%{transform:scale(1)}25%{transform:translateY(-30%) scale(1.3) rotate(-10deg)}100%{transform:translateY(70vh) scale(1) rotate(30deg);opacity:0}}

/* 까꿍 */
.spot{position:absolute;animation:popin .5s backwards;touch-action:none}
.spot .obj{position:absolute;inset:0;z-index:2;transform-origin:50% 100%}
.spot .obj svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.18))}
.spot .hider{position:absolute;left:22%;top:32%;width:56%;height:56%;z-index:1;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.spot.peekHint .hider{animation:peekUp 1.3s ease-in-out}
.spot.peekHint .obj{animation:wig .6s .15s}
@keyframes peekUp{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-40%)}}
.spot.found .hider{transform:translateY(-95%) scale(1.35);z-index:3}
.spot.found .obj{animation:squash .5s}
.spot.nope .obj{animation:lift .7s}
@keyframes lift{0%,100%{transform:none}30%,60%{transform:translateY(-14%) rotate(-4deg)}}
@keyframes squash{0%,100%{transform:none}40%{transform:scale(1.12,.84)}}

/* 상어 밥 주기 */
.shark{position:absolute;animation:bob 2.6s ease-in-out infinite}
.shark svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 60%}
.shark .mOpen{display:none}.shark.open .mOpen{display:inline}.shark.open .mClosed{display:none}
.shark.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.ask{position:absolute;z-index:5;background:#fff;border-radius:4vmin;padding:1.4vmin 3vmin;display:flex;align-items:center;gap:1.6vmin;
  font-size:clamp(22px,4.6vmin,46px);box-shadow:0 1vmin 0 rgba(30,90,140,.15);animation:popin .45s;white-space:nowrap}
.ask svg{width:clamp(60px,12vmin,120px);height:auto}
.fish{position:absolute;touch-action:none;filter:drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.22));transition:transform .15s;animation:popsoft .3s}
.fish .fb{width:100%;height:100%;animation:fishBob 2.2s ease-in-out infinite}
.fish svg{width:100%;height:100%;display:block}
@keyframes fishBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
.fish.hold{transform:scale(1.15)}.fish.hold .fb{animation:none}
.fish.back{transition:left .4s cubic-bezier(.3,1.35,.5,1),top .4s cubic-bezier(.3,1.35,.5,1)}
.fish.eaten{transition:left .28s ease-in,top .28s ease-in,transform .28s ease-in;transform:scale(.15)}
.fish.hint .fb{animation:hint 1s}

.pt{position:fixed;font-size:var(--s);color:var(--c);pointer-events:none;z-index:999;line-height:1;animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards;
  text-shadow:0 2px 0 rgba(255,255,255,.7)}
.pt.long{animation-duration:1.8s}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:1}
  100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div id="bubbles"></div>
<div id="toast"></div>

<section id="home" class="screen on">
  <div class="topbar"><span></span><button class="rbtn musicBtn" aria-label="음악">🎵</button></div>
  <div class="lane"><div class="swim"><img id="swimImg" alt=""></div></div>
  <span id="ver"></span>

const svgURL=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const loadImg=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});

/* ================= 소리 (Web Audio로 직접 합성) ================= */
const AU={ctx:null,master:null,bgm:null};
function audio(){
  if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ctx.destination);
    AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.55;AU.bgm.connect(AU.master);}
  if(AU.ctx.state==='suspended')AU.ctx.resume();
  return AU.ctx;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone({f,f2,t=0,at,d=.15,type='sine',v=.3,a=.006,out}){
  const c=audio();if(!c)return;const s=at??c.currentTime+t;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,s);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d*.8);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(out||AU.master);o.start(s);o.stop(s+d+.05);
}
function bell(f,t,v=.22,d=.6,at){tone({f,t,at,d,v});tone({f:f*2,t,at,d:d*.5,v:v*.28});tone({f:f*3.01,t,at,d:d*.25,v:v*.1});}
const PENT=[72,74,76,79,81,84,86,88,91];
const sfx={
  tap(){tone({f:660,f2:990,d:.1,v:.22});tone({f:1320,t:.04,d:.07,v:.08});},
  pick(){tone({f:320,f2:900,d:.13,v:.28});},                       // 뽀록
  drop(){tone({f:520,f2:260,d:.2,v:.18,type:'triangle'});},         // 뿅~
  snap(i){tone({f:900,f2:1700,d:.07,v:.18});bell(mtof(PENT[Math.min(i,PENT.length-1)]),.05,.26,.7);},
  nope(){tone({f:440,f2:380,d:.16,v:.18,type:'triangle'});tone({f:380,f2:300,t:.18,d:.22,v:.18,type:'triangle'});},
  bubble(){tone({f:500+Math.random()*300,f2:1400,d:.09,v:.15});},
  fanfare(){[72,76,79,84].forEach((m,i)=>{tone({f:mtof(m),t:i*.12,d:.28,v:.2,type:'triangle'});bell(mtof(m+12),i*.12,.08,.3);});
    [84,88,91].forEach(m=>bell(mtof(m),.52,.16,1.2));
    for(let i=0;i<10;i++)tone({f:1800+Math.random()*2200,t:.55+i*.08,d:.15,v:.05});}
};

let NB=null;
function noise({t=0,d=.2,v=.2,f=1200,f2,q=.8,type='bandpass'}){const c=audio();if(!c)return;
  if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=c.currentTime+t,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();src.buffer=NB;
  fl.type=type;fl.frequency.setValueAtTime(f,s);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  src.connect(fl);fl.connect(g);g.connect(AU.master);src.start(s);src.stop(s+d+.05);}
Object.assign(sfx,{
  whoosh(){noise({f:3500,f2:250,d:.55,v:.35,q:.6});tone({f:900,f2:200,d:.5,v:.1,type:'triangle'});},
  pour(){[0,.07,.14,.21].forEach((t,i)=>tone({f:300+i*120,f2:900+i*150,t,d:.1,v:.16}));},
  stamp(){tone({f:180,f2:90,d:.12,v:.35,type:'triangle'});tone({f:600,f2:1500,t:.06,d:.1,v:.14});},
  shutter(){noise({f:5000,d:.05,v:.4,type:'highpass'});noise({f:3000,t:.09,d:.07,v:.3,type:'highpass'});bell(mtof(84),.2,.12,.5);bell(mtof(91),.3,.1,.6);},
  undo(){tone({f:900,f2:450,d:.14,v:.18});},
  rub(){noise({f:1800,d:.08,v:.05,q:1.5});},
  pop(){noise({f:4500,d:.05,v:.3,type:'highpass'});tone({f:1400,f2:320,d:.12,v:.22});},
  giggle(){[0,.13,.26].forEach((t,i)=>tone({f:900+i*90,f2:1300+i*90,t,d:.09,v:.12,type:'triangle'}));},
  peek(){tone({f:300,f2:1200,d:.3,v:.2,type:'triangle'});[0,1,2,3].forEach(i=>bell(mtof(PENT[i+3]),.25+i*.07,.1,.4));},
  chomp(){[0,.2].forEach(t=>{tone({f:230,f2:110,t,d:.13,v:.35,type:'triangle'});noise({f:700,t,d:.08,v:.15});});},
});

/* 배경음: 직접 작곡한 오르골 풍 루프 */
const BPM=108,SPB=60/BPM;
const MEL=[[76,1],[79,1],[81,1],[79,1],[76,1],[74,1],[72,2],[74,1],[76,1],[79,1],[76,1],[74,3],[0,1],
           [76,1],[79,1],[81,1],[84,1],[81,1],[79,1],[76,2],[74,1],[76,1],[74,1],[72,1],[72,3],[0,1]];
const ROOTS=[48,48,43,43,48,45,43,48];
const BGM=(()=>{const ev=[];let t=0;MEL.forEach(([m,b])=>{if(m)ev.push({t,m,b,k:'mel'});t+=b;});
  ROOTS.forEach((r,i)=>{ev.push({t:i*4,m:r,k:'bass'});ev.push({t:i*4+2,m:r+7,k:'bass'});ev.push({t:i*4+1,k:'tick'});ev.push({t:i*4+3,k:'tick'});});
  ev.sort((a,b)=>a.t-b.t);return{ev,len:32};})();
let bgmTimer=null,loopStart=0,bIdx=0;
function bgmNote(e,at){
  if(e.k==='mel'){const f=mtof(e.m);tone({f,at,d:e.b*SPB*.9+.45,v:.13,out:AU.bgm});tone({f:f*2,at,d:.35,v:.035,out:AU.bgm});}
  else if(e.k==='bass')tone({f:mtof(e.m),at,d:.55,v:.09,type:'triangle',out:AU.bgm});
  else tone({f:1500,f2:2300,at,d:.05,v:.025,out:AU.bgm});
}
function bgmTick(){const c=AU.ctx,h=c.currentTime+.35;
  for(;;){const e=BGM.ev[bIdx],at=loopStart+e.t*SPB;if(at>h)break;bgmNote(e,at);
    if(++bIdx>=BGM.ev.length){bIdx=0;loopStart+=BGM.len*SPB;}}}
function bgmStart(){const c=audio();if(!c||bgmTimer)return;AU.bgm.gain.setValueAtTime(.55,c.currentTime);
  loopStart=c.currentTime+.15;bIdx=0;bgmTick();bgmTimer=setInterval(bgmTick,90);}
function bgmStop(){if(!bgmTimer)return;clearInterval(bgmTimer);bgmTimer=null;const c=AU.ctx;
  AU.bgm.gain.setTargetAtTime(0,c.currentTime,.05);}

function say(txt){try{const s=window.speechSynthesis;if(!s)return;s.cancel();const u=new SpeechSynthesisUtterance(txt);
  u.lang='ko-KR';u.pitch=1.6;u.rate=.95;const v=s.getVoices().find(v=>/^ko/i.test(v.lang));if(v)u.voice=v;s.speak(u);}catch(e){}}

function burst(x,y,n=12,spread=120,long=false){const C=['#ffd65a','#ff8fb1','#5ccf95','#7ec8ff','#b8a6ff','#ffa733'];
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pt'+(long?' long':'');s.textContent=rand(['★','♥','●','✦','★']);
    const a=Math.random()*Math.PI*2,r=spread*(.45+Math.random()*.75);
    s.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r+(long?spread*.5:0)}px;--r:${(Math.random()*400-200)|0}deg;--c:${rand(C)};--s:${16+Math.random()*(long?34:22)}px`;
    s.addEventListener('animationend',()=>s.remove());document.body.appendChild(s);}}

    a.onclick=()=>{sfx.tap();$('photoIn').click();};g.appendChild(a);}

/* ================= 퍼즐 게임 ================= */
const stage=$('stage');let G=null;
const ov=(x,y,w,h,X,Y,W,H)=>Math.max(0,Math.min(x+w,X+W)-Math.max(x,X))*Math.max(0,Math.min(y+h,Y+H)-Math.max(y,Y));

async function startGame(){
  show('game');G=null;stage.innerHTML='';stage.classList.remove('leave','enter');void stage.offsetWidth;stage.classList.add('enter');
  const list=items();S.cur=((S.cur%list.length)+list.length)%list.length;const it=list[S.cur];
  const n=S.pieces,[cols,rows]=LAYOUT[n],sil=n===1&&!it.photo;
  const W=stage.clientWidth,H=stage.clientHeight,land=W>=H,top=Math.min(120,H*.13);
  let B=n===1?(land?Math.min(H*.66,W*.42):Math.min(W*.66,H*.4)):(land?Math.min(H*.62,W*.46):Math.min(W*.74,H*.44));
  B=Math.round(B);
  let bx,by;
  if(n===1&&land){bx=W*.7-B/2;by=(H-B)/2+top*.3;}else if(n===1){bx=(W-B)/2;by=H*.7-B/2;}else{bx=(W-B)/2;by=(H-B)/2+top*.3;}
  const dpr=Math.min(2,window.devicePixelRatio||1),R=Math.round(B*dpr);
  const src=await loadImg(it.photo?it.src:svgURL(it.svg(!sil)));
  const full=document.createElement('canvas');full.width=full.height=R;full.className='full';full.getContext('2d').drawImage(src,0,0,R,R);
  const guide=document.createElement('canvas');guide.width=guide.height=R;guide.className='guide';const g=guide.getContext('2d');
  if(sil){g.drawImage(full,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(35,75,135,.38)';g.fillRect(0,0,R,R);}
  else{g.globalAlpha=.24;g.drawImage(full,0,0);g.globalAlpha=1;g.setLineDash([R*.03,R*.025]);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(3,R*.008);
    for(let c=1;c<cols;c++){g.beginPath();g.moveTo(c*R/cols,0);g.lineTo(c*R/cols,R);g.stroke();}
    for(let r=1;r<rows;r++){g.beginPath();g.moveTo(0,r*R/rows);g.lineTo(R,r*R/rows);g.stroke();}}
  const board=document.createElement('div');board.className='board'+(sil?'':' grid');
  Object.assign(board.style,{left:bx+'px',top:by+'px',width:B+'px',height:B+'px'});board.append(guide,full);stage.appendChild(board);

  const pw=B/cols,ph=B/rows,P=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const cv=document.createElement('canvas');cv.width=Math.round(R/cols);cv.height=Math.round(R/rows);
    cv.getContext('2d').drawImage(full,c*R/cols,r*R/rows,R/cols,R/rows,0,0,cv.width,cv.height);
    cv.className='piece'+(sil?'':' grid');cv.style.width=pw+'px';cv.style.height=ph+'px';
    P.push({el:cv,tx:bx+c*pw,ty:by+r*ph,w:pw,h:ph,x:0,y:0,locked:false});}
  // 판을 피해서 흩어 놓기
  const m=14,placed=[];
  P.sort(()=>Math.random()-.5).forEach((p,i)=>{let best=[m,top],bs=1e18;
    for(let k=0;k<90;k++){const x=m+Math.random()*Math.max(1,W-p.w-2*m),y=top+Math.random()*Math.max(1,H-p.h-top-m);
      let s=ov(x,y,p.w,p.h,bx,by,B,B)*4;placed.forEach(q=>s+=ov(x,y,p.w,p.h,q.x,q.y,q.w,q.h));if(s<bs){bs=s;best=[x,y];}}
    p.x=p.hx=best[0];p.y=p.hy=best[1];placed.push(p);});

  G={P,board,done:0,W,H,z:10,last:Date.now(),over:false};
  P.forEach(p=>{const el=p.el;pos(p);stage.appendChild(el);
    el.addEventListener('pointerdown',e=>{if(p.locked||G.over)return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
      p.drag={id:e.pointerId,ox:e.clientX-p.x,oy:e.clientY-p.y};el.classList.remove('hint','back');el.classList.add('hold');el.style.zIndex=++G.z;G.last=Date.now();sfx.pick();});
    el.addEventListener('pointermove',e=>{if(!p.drag||p.drag.id!==e.pointerId)return;
      p.x=Math.max(-p.w*.4,Math.min(G.W-p.w*.6,e.clientX-p.drag.ox));p.y=Math.max(-p.h*.4,Math.min(G.H-p.h*.6,e.clientY-p.drag.oy));pos(p);});
    const up=e=>{if(!p.drag||p.drag.id!==e.pointerId)return;p.drag=null;el.classList.remove('hold');G.last=Date.now();
      if(Math.hypot(p.x-p.tx,p.y-p.ty)<Math.min(p.w,p.h)*.5)lock(p);else goHome(p);};
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);});
}
function pos(p){p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';}
// 틀린 곳에 놓으면: 처음 자리로 통통 돌아가고, 맞는 자리가 반짝반짝
let lastHereSay=0;
function goHome(p){sfx.drop();const el=p.el;el.classList.add('back');p.x=p.hx;p.y=p.hy;pos(p);
  setTimeout(()=>el.classList.remove('back'),450);
  const h=document.createElement('div');h.className='slotHint';
  Object.assign(h.style,{left:p.tx+'px',top:p.ty+'px',width:p.w+'px',height:p.h+'px'});
  h.addEventListener('animationend',()=>h.remove());stage.appendChild(h);
  if(Date.now()-lastHereSay>4000){lastHereSay=Date.now();setTimeout(()=>say('여기야!'),250);}}
function lock(p){p.locked=true;p.x=p.tx;p.y=p.ty;p.el.classList.add('locked');p.el.style.zIndex=2;pos(p);
  sfx.snap(G.done++);burst(p.tx+p.w/2,p.ty+p.h/2,14,Math.min(p.w,p.h)*.7);
  if(G.done===G.P.length)finish();}
function finish(){G.over=true;const b=G.board,r=b.getBoundingClientRect();
  setTimeout(()=>{b.classList.add('cheer');G.P.forEach(p=>p.el.style.visibility='hidden');sfx.fanfare();
    burst(r.left+r.width/2,r.top+r.height/2,46,Math.min(innerWidth,innerHeight)*.45,true);
    say(rand(['잘했어요!','최고야!','와, 멋지다!','짝짝짝!']));
    // 축하가 끝나면 다음 그림으로 자연스럽게 넘어가기
    const me=G;setTimeout(()=>{if(S.screen!=='game'||G!==me)return;stage.classList.add('leave');
      setTimeout(()=>{if(S.screen!=='game'||G!==me)return;S.cur++;startGame();},450);},2600);},300);}
// 한동안 안 만지면 조각이 살랑살랑 힌트
setInterval(()=>{if(S.screen!=='game'||!G||G.over)return;if(Date.now()-G.last<7000)return;G.last=Date.now();
  const free=G.P.filter(p=>!p.locked&&!p.drag);if(!free.length)return;const p=rand(free);
  p.el.classList.remove('hint');void p.el.offsetWidth;p.el.classList.add('hint');sfx.bubble();},1000);

// 화면 크기 변화: 작업 표시줄·상태바가 잠깐 나타나는 정도는 무시하고, 가로↔세로가 바뀔 때만 다시 배치

/* ================= 그림 그리기 ================= */
const PW=1600,PH=1100;
const paper=$('paper'),paintCv=$('paintCv'),lineCv=$('lineCv');
paintCv.width=lineCv.width=PW;paintCv.height=lineCv.height=PH;
const pctx=paintCv.getContext('2d',{willReadFrequently:true}),lctx=lineCv.getContext('2d',{willReadFrequently:true});
const COLORS=[['#ff5a5f','빨강'],['#ff9f43','주황'],['#ffd93d','노랑'],['#5ccf6e','초록'],['#4fc3f7','하늘색'],
              ['#3d6ff0','파랑'],['#a77bf3','보라'],['#ff8fc7','분홍'],['#a0673f','갈색'],['#2b3a55','검정']];
const TOOLS=[['crayon','🖍️','크레용'],['rainbow','🌈','무지개'],['stamp','','도장'],['fill','🪣','물감 붓기'],['eraser','🧽','지우개'],['size','','']];
const SIZES=[16,34,62];
const D={tool:'crayon',color:COLORS[0][0],size:1,hue:0,stampIdx:0,undo:[],strokes:new Map(),lastPen:0,lineAlpha:null,page:null,lastNote:0,lastSave:0};
const STAMPS=CHARS.map(c=>{const i=new Image();i.src=svgURL(c.svg(false));return i;});

function fitPaper(){const b=$('paperBox').getBoundingClientRect(),a=PW/PH;let w=b.width,h=w/a;if(h>b.height){h=b.height;w=h*a;}
  paper.style.width=Math.floor(w)+'px';paper.style.height=Math.floor(h)+'px';}
function renderTools(){const t=$('tools');t.innerHTML='';
  TOOLS.forEach(([id,ic,name])=>{const b=document.createElement('button');b.className='tbtn'+(D.tool===id?' sel':'');
    if(id==='stamp')b.innerHTML=`<img src="${STAMPS[D.stampIdx].src}" alt="">`;
    else if(id==='size'){const s=[16,28,42][D.size];b.innerHTML=`<i class="dot" style="width:${s}%;height:${s}%"></i>`;}
    else b.innerHTML=ic+((id==='crayon'||id==='fill')?`<i class="bar" style="--cc:${D.color}"></i>`:'');
    b.onclick=()=>{if(id==='size'){D.size=(D.size+1)%3;sfx.bubble();}else{D.tool=id;sfx.tap();say(name);}renderTools();};t.appendChild(b);});}
function renderColors(){const c=$('colors');c.innerHTML='';
  COLORS.forEach(([col,name])=>{const b=document.createElement('button');b.className='cbtn'+(D.color===col?' sel':'');b.style.setProperty('--c',col);
    b.onclick=()=>{D.color=col;if(D.tool==='eraser'||D.tool==='stamp'||D.tool==='rainbow')D.tool='crayon';sfx.bubble();say(name);renderColors();renderTools();};c.appendChild(b);});}

function pushUndo(){try{D.undo.push(pctx.getImageData(0,0,PW,PH));if(D.undo.length>8)D.undo.shift();}catch(e){}}
function toPaper(e){const r=paintCv.getBoundingClientRect();return{x:(e.clientX-r.left)*PW/r.width,y:(e.clientY-r.top)*PH/r.height};}
function inkFor(e,d){const er=D.tool==='eraser'||(e.buttons&32);pctx.globalCompositeOperation=er?'destination-out':'source-over';
  const base=SIZES[D.size]*(er?1.8:1);pctx.lineWidth=e.pointerType==='pen'?base*(.35+Math.min(1,e.pressure||.5)*1.3):base;
  if(D.tool==='rainbow'&&!er){D.hue=(D.hue+d*.35)%360;pctx.strokeStyle=pctx.fillStyle=`hsl(${D.hue},92%,60%)`;}else pctx.strokeStyle=pctx.fillStyle=D.color;
  pctx.lineCap='round';pctx.lineJoin='round';return er;}
function note(y,er){const now=performance.now();if(now-D.lastNote<85)return;D.lastNote=now;
  if(er){sfx.rub();return;}const i=Math.max(0,Math.min(PENT.length-1,Math.floor((1-y/PH)*PENT.length)));bell(mtof(PENT[i]),0,.06,.35);}

paper.addEventListener('pointerdown',e=>{
  if(e.pointerType==='pen')D.lastPen=Date.now();else if(e.pointerType==='touch'&&Date.now()-D.lastPen<1000)return; // 펜 쓸 때 손바닥 무시
  e.preventDefault();try{paper.setPointerCapture(e.pointerId);}catch(_){}
  const p=toPaper(e);
  if(D.tool==='fill'&&!(e.buttons&32)){pushUndo();floodFill(p,e);return;}
  if(D.tool==='stamp'&&!(e.buttons&32)){pushUndo();stampAt(p,e);return;}
  if(D.strokes.size===0)pushUndo();
  D.strokes.set(e.pointerId,{last:p,mid:p,ink:0});
  const er=inkFor(e,0);pctx.beginPath();pctx.arc(p.x,p.y,pctx.lineWidth/2,0,Math.PI*2);pctx.fill();note(p.y,er);});
paper.addEventListener('pointermove',e=>{const s=D.strokes.get(e.pointerId);if(!s)return;if(e.pointerType==='pen')D.lastPen=Date.now();
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents())||[];
  for(const ce of (evs.length?evs:[e])){const p=toPaper(ce),dx=p.x-s.last.x,dy=p.y-s.last.y,d=Math.hypot(dx,dy);if(d<1.5)continue;
    const mid={x:(s.last.x+p.x)/2,y:(s.last.y+p.y)/2},er=inkFor(ce,d);
    pctx.beginPath();pctx.moveTo(s.mid.x,s.mid.y);pctx.quadraticCurveTo(s.last.x,s.last.y,mid.x,mid.y);pctx.stroke();
    s.last=p;s.mid=mid;s.ink+=d;if(s.ink>100){s.ink=0;note(p.y,er);}}});
const endStroke=e=>{const s=D.strokes.get(e.pointerId);if(!s)return;
  pctx.beginPath();pctx.moveTo(s.mid.x,s.mid.y);pctx.lineTo(s.last.x,s.last.y);pctx.stroke();D.strokes.delete(e.pointerId);pctx.globalCompositeOperation='source-over';};
paper.addEventListener('pointerup',endStroke);paper.addEventListener('pointercancel',endStroke);

function stampAt(p,e){const img=STAMPS[D.stampIdx],s=PH*.26;pctx.globalCompositeOperation='source-over';
  pctx.drawImage(img,p.x-s/2,p.y-s/2,s,s);D.stampIdx=(D.stampIdx+1)%STAMPS.length;sfx.stamp();burst(e.clientX,e.clientY,10,70);renderTools();}

let FST=null;
function floodFill(p,e){const x0=Math.floor(p.x),y0=Math.floor(p.y);if(x0<0||y0<0||x0>=PW||y0>=PH)return;
  const L=D.lineAlpha,i0=y0*PW+x0;if(L&&L[i0]>=60)return;
  const img=pctx.getImageData(0,0,PW,PH),d=img.data,k0=i0*4,tr=d[k0],tg=d[k0+1],tb=d[k0+2],ta=d[k0+3];
  const n=parseInt(D.color.slice(1),16),fr=n>>16,fg=(n>>8)&255,fb=n&255;
  if(ta===255&&Math.abs(tr-fr)<8&&Math.abs(tg-fg)<8&&Math.abs(tb-fb)<8)return;
  const seen=new Uint8Array(PW*PH);if(!FST)FST=new Int32Array(PW*PH);let sp=0;FST[sp++]=i0;seen[i0]=1;
  const T=48,match=i=>{const k=i*4;return Math.abs(d[k+3]-ta)<=T&&(ta<10||(Math.abs(d[k]-tr)<=T&&Math.abs(d[k+1]-tg)<=T&&Math.abs(d[k+2]-tb)<=T));};
  const visit=j=>{if(seen[j])return;if(match(j)||(L&&L[j]>=60)){seen[j]=1;FST[sp++]=j;}};
  while(sp){const i=FST[--sp],k=i*4;d[k]=fr;d[k+1]=fg;d[k+2]=fb;d[k+3]=255;
    if(L&&L[i]>=60)continue; // 선 밑까지만 칠하고 더 퍼지지 않기
    const x=i%PW;if(x>0)visit(i-1);if(x<PW-1)visit(i+1);if(i>=PW)visit(i-PW);if(i<PW*(PH-1))visit(i+PW);}
  pctx.putImageData(img,0,0);sfx.pour();burst(e.clientX,e.clientY,12,90);}

/* 색칠공부 밑그림: 캐릭터 그림에서 테두리를 뽑아 선 그림으로 */
const LINE={};
async function lineArt(ch){if(LINE[ch.id])return LINE[ch.id];const N=900,img=await loadImg(svgURL(ch.svg(false)));
  const c=document.createElement('canvas');c.width=c.height=N;const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff';x.fillRect(0,0,N,N);x.drawImage(img,0,0,N,N);const s=x.getImageData(0,0,N,N).data,m=new Uint8Array(N*N);
  const df=(a,b)=>Math.max(Math.abs(s[a]-s[b]),Math.abs(s[a+1]-s[b+1]),Math.abs(s[a+2]-s[b+2]));
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx,k=i*4;
    if(.3*s[k]+.59*s[k+1]+.11*s[k+2]<62){m[i]=1;continue;}
    if((xx<N-1&&df(k,k+4)>34)||(y<N-1&&df(k,k+N*4)>34))m[i]=1;}
  const r=3,t=new Uint8Array(N*N),o=new Uint8Array(N*N);
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let v=0;for(let q=-r;q<=r&&!v;q++){const X=xx+q;if(X>=0&&X<N&&m[y*N+X])v=1;}t[y*N+xx]=v;}
  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){let v=0;for(let q=-r;q<=r&&!v;q++){const Y=y+q;if(Y>=0&&Y<N&&t[Y*N+xx])v=1;}o[y*N+xx]=v;}
  const out=x.createImageData(N,N);for(let i=0;i<N*N;i++)if(o[i]){const k=i*4;out.data[k]=43;out.data[k+1]=58;out.data[k+2]=85;out.data[k+3]=255;}
  x.putImageData(out,0,0);LINE[ch.id]=c;return c;}
async function setPage(ch){D.undo=[];pctx.clearRect(0,0,PW,PH);lctx.clearRect(0,0,PW,PH);D.page=ch?ch.id:null;D.lineAlpha=null;
  if(ch){const c=await lineArt(ch),s=PH*.94;lctx.drawImage(c,(PW-s)/2,(PH-s)/2,s,s);
    const a=lctx.getImageData(0,0,PW,PH).data,L=new Uint8Array(PW*PH);for(let i=0;i<L.length;i++)L[i]=a[i*4+3];D.lineAlpha=L;
    if(D.tool!=='crayon')D.tool='fill';renderTools();}}
async function openPagePick(){const g=$('pageGrid');g.innerHTML='';
  const blank=document.createElement('button');blank.className='pic blank';blank.textContent='빈 종이';
  blank.onclick=()=>{sfx.tap();setPage(null);$('pagePick').classList.remove('on');};g.appendChild(blank);
  for(const ch of CHARS){const b=document.createElement('button');b.className='pic';b.innerHTML=`<img alt=""><b>${ch.name}</b>`;g.appendChild(b);
    b.onclick=()=>{sfx.tap();say(ch.name);setPage(ch);$('pagePick').classList.remove('on');};}
  $('pagePick').classList.add('on');
  const imgs=g.querySelectorAll('.pic:not(.blank) img');
  for(let i=0;i<CHARS.length;i++){const c=await lineArt(CHARS[i]);imgs[i].src=c.toDataURL();}}

  const c=document.createElement('canvas');c.width=PW;c.height=PH;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,PW,PH);
  x.drawImage(paintCv,0,0);x.drawImage(lineCv,0,0);
  c.toBlob(b=>{const a=document.createElement('a'),dt=new Date(),p=n=>String(n).padStart(2,'0');a.href=URL.createObjectURL(b);
    a.download=`유주그림-${dt.getFullYear()}${p(dt.getMonth()+1)}${p(dt.getDate())}-${p(dt.getHours())}${p(dt.getMinutes())}${p(dt.getSeconds())}.png`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);},'image/png');
  const f=$('flash');f.classList.remove('go');void f.offsetWidth;f.classList.add('go');sfx.shutter();say('찰칵! 저장했어요');};

    let x,y;if(FD.land){x=R.x+(i%2?R.w-fw:0)*.5+Math.random()*Math.max(0,R.w-fw)*.5;y=R.y+R.h*(i+.5)/3-fh/2;}
    else{x=R.x+R.w*(i+.5)/3-fw/2;y=R.y+Math.random()*Math.max(0,R.h-fh);}
    const f={el,c,x,y,hx:x,hy:y,w:fw,h:fh};Object.assign(el.style,{left:x+'px',top:y+'px',width:fw+'px',height:fh+'px'});
    fdDrag(f);$('fdArea').appendChild(el);FD.fish.push(f);});}
function mouthXY(){const r=FD.shark.querySelector('.mHit').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2};}
function fdDrag(f){const el=f.el;
  el.addEventListener('pointerdown',e=>{if(FD.busy)return;e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}
    f.drag={id:e.pointerId,ox:e.clientX-f.x,oy:e.clientY-f.y};el.classList.remove('back','hint');el.classList.add('hold');el.style.zIndex=20;FD.last=Date.now();sfx.pick();});
  el.addEventListener('pointermove',e=>{if(!f.drag||f.drag.id!==e.pointerId)return;f.x=e.clientX-f.drag.ox;f.y=e.clientY-f.drag.oy;
    el.style.left=f.x+'px';el.style.top=f.y+'px';});
  const up=e=>{if(!f.drag||f.drag.id!==e.pointerId)return;f.drag=null;el.classList.remove('hold');FD.last=Date.now();
    const m=mouthXY(),cx=f.x+f.w*.75,cy=f.y+f.h/2,d=Math.hypot(cx-m.x,cy-m.y);
    if(d<FD.S*.34){if(f.c===FD.target)fdEat(f,m);else fdWrong(f);}else fdHome(f);};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);}
function fdHome(f){sfx.drop();f.el.classList.add('back');f.x=f.hx;f.y=f.hy;f.el.style.left=f.x+'px';f.el.style.top=f.y+'px';
  setTimeout(()=>f.el.classList.remove('back'),450);}
function fdWrong(f){const sh=FD.shark;sh.classList.remove('open','shake');void sh.offsetWidth;sh.classList.add('shake');sfx.nope();
  say(`음~ 이건 ${f.c[3]}이야. ${FD.target[2]} 물고기 줘!`);setTimeout(()=>{sh.classList.remove('shake');sh.classList.add('open');},550);
  setTimeout(()=>fdHome(f),150);}
function fdEat(f,m){FD.busy=true;const el=f.el;el.classList.add('eaten');el.style.left=(m.x-f.w*.5)+'px';el.style.top=(m.y-f.h*.5)+'px';
  setTimeout(()=>{el.remove();FD.fish=FD.fish.filter(x=>x!==f);},300);
  const sh=FD.shark;let k=0;const chew=setInterval(()=>{sh.classList.toggle('open');if(++k>=5){clearInterval(chew);sh.classList.remove('open');}},140);
  sfx.chomp();FD.fed++;renderStars('fdStars',FD.fed,5);sh.querySelector('svg').style.transform=`scale(${1+FD.fed*.05})`;
  setTimeout(()=>{heartBurst(m.x,m.y);},300);
  if(FD.fed<5){say(pick(['냠냠! 맛있다!','냠냠냠! 고마워!','와, 맛있어!']));setTimeout(fdRound,1800);return;}
  setTimeout(()=>{say('배불러! 고마워!');sfx.fanfare();const r=sh.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,46,r.width*.6,true);
    sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');},700);
  setTimeout(()=>{if(S.screen!=='feed')return;FD.fed=0;renderStars('fdStars',0,5);sh.querySelector('svg').style.transform='';fdRound();},4200);}
function heartBurst(x,y){for(let i=0;i<8;i++){const s=document.createElement('span');s.className='pt';s.textContent='♥';
  const a=-Math.PI/2+(Math.random()-.5)*1.6,r=60+Math.random()*80;
  s.style.cssText=`left:${x}px;top:${y}px;--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;--r:${(Math.random()*60-30)|0}deg;--c:#ff6b9a;--s:${22+Math.random()*18}px`;
  s.addEventListener('animationend',()=>s.remove());document.body.appendChild(s);}}
$('goFeed').onclick=()=>{sfx.tap();say('상어 밥 주기!');fdStart();};
$('fdBack').onclick=()=>{sfx.tap();show('home');};
</script>
</body>
