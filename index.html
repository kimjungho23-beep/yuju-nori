<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fd3f7">
<title>유주 놀이터</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{--sea1:#c4f1ff;--sea2:#86d4f6;--sea3:#55b4e6;--ink:#2b3a55;--pink:#ff8fb1;--yellow:#ffd65a;--green:#5ccf95;--purple:#b8a6ff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Jua',system-ui,sans-serif;color:var(--ink);background:linear-gradient(180deg,var(--sea1),var(--sea2) 55%,var(--sea3));
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
button{font-family:inherit;color:inherit;cursor:pointer}
img{-webkit-user-drag:none;pointer-events:none}

/* 배경 거품 */
#bubbles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bub{position:absolute;bottom:-80px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#fff 0 12%,rgba(255,255,255,.35) 30%,rgba(255,255,255,.08) 70%);
  border:2px solid rgba(255,255,255,.65);animation:rise linear forwards}
@keyframes rise{to{transform:translate(var(--dx),-120vh)}}

.screen{position:fixed;inset:0;display:none;z-index:1}
.screen.on{display:block;animation:fadein .35s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}

.topbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:max(14px,2.2vmin);z-index:60;pointer-events:none}
.rbtn{pointer-events:auto;width:clamp(58px,9vmin,86px);height:clamp(58px,9vmin,86px);border-radius:50%;border:none;background:#fff;
  box-shadow:0 6px 0 rgba(30,90,140,.18);font-size:clamp(28px,4.6vmin,44px);display:grid;place-items:center;transition:transform .1s}
.rbtn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(30,90,140,.18)}
.rbtn.off{opacity:.6}
.musicBtn{position:relative}
#ver{position:absolute;right:max(12px,2vmin);bottom:max(8px,1.4vmin);font-size:clamp(12px,1.8vmin,16px);color:rgba(255,255,255,.85);pointer-events:none}
.musicBtn.off::after{content:'';position:absolute;left:16%;right:16%;top:calc(50% - 3px);height:6px;border-radius:6px;background:#ff5a6e;transform:rotate(-40deg)}
#toast{position:fixed;left:50%;top:max(18px,3vmin);transform:translate(-50%,-150%);z-index:200;pointer-events:none;background:rgba(43,58,85,.88);color:#fff;
  padding:1.4vmin 3.2vmin;border-radius:99px;font-size:clamp(16px,2.8vmin,26px);white-space:nowrap;transition:transform .3s ease}
#toast.on{transform:translate(-50%,0)}

/* 홈 */
.homeWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vmin}
.title{font-size:clamp(40px,9.5vmin,110px);color:#fff;letter-spacing:.04em;font-weight:400;
  text-shadow:0 .07em 0 #3a9fd6,0 .12em .2em rgba(0,60,120,.25);animation:bob 3s ease-in-out infinite}
.title span{display:inline-block;animation:hop 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-1.2vmin)}}
@keyframes hop{0%,70%,100%{transform:translateY(0)}80%{transform:translateY(-2vmin) rotate(-4deg)}}
.menu{display:grid;grid-template-columns:repeat(3,auto);gap:3.6vmin 4vmin;justify-content:center;padding:0 16px}
.homeWrap{gap:4vmin}
.card{position:relative;width:clamp(116px,21vmin,220px);aspect-ratio:1;border:none;border-radius:13%;background:#fff;
  box-shadow:0 1.4vmin 0 var(--c),0 2.2vmin 3vmin rgba(0,60,120,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vmin;
  transition:transform .12s}
.card:active{transform:translateY(1vmin) scale(.97)}
.card .ic{font-size:clamp(48px,9.5vmin,96px);line-height:1}
.card b{font-weight:400;font-size:clamp(20px,4.2vmin,42px)}
.card.soon{opacity:.82}
.card i{position:absolute;top:-1.6vmin;right:-1.6vmin;font-style:normal;background:var(--c);color:#fff;padding:.6vmin 1.6vmin;border-radius:99px;
  font-size:clamp(14px,2.4vmin,22px);transform:rotate(8deg);box-shadow:0 .5vmin 0 rgba(0,0,0,.08)}
.wig{animation:wig .6s}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg)}}

.lane{position:absolute;bottom:6vmin;left:0;width:100%;height:20vmin;pointer-events:none}
.lane .swim{position:absolute;left:0;top:0;width:20vmin;animation:swim 16s linear infinite}
.lane .swim img{width:100%;animation:bob 1.6s ease-in-out infinite}
@keyframes swim{from{transform:translateX(-25vmin)}to{transform:translateX(calc(100vw + 5vmin))}}

/* 그림 고르기 */
.selWrap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4vmin;padding:12vmin 16px 4vmin}
.subtitle{font-weight:400;font-size:clamp(30px,6.5vmin,64px);color:#fff;text-shadow:0 .08em 0 #3a9fd6}
.picGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:3vmin;max-width:100vmin}
.pic{position:relative;width:clamp(110px,17vmin,180px);aspect-ratio:1;border:none;border-radius:14%;background:#fff;padding:1vmin;
  box-shadow:0 1.1vmin 0 rgba(30,90,140,.2);transition:transform .12s}
.pic:active{transform:scale(.94)}
.pic img{width:100%;height:100%;object-fit:cover;border-radius:11%;display:block}
.pic b{position:absolute;left:50%;bottom:-1.8vmin;transform:translateX(-50%);background:var(--yellow);font-weight:400;
  font-size:clamp(18px,3.2vmin,30px);padding:.3vmin 2vmin;border-radius:99px;white-space:nowrap}
.pic.add{background:rgba(255,255,255,.55);border:.6vmin dashed #fff;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(40px,8vmin,80px);color:#fff}
.pic.add small{font-size:clamp(16px,2.8vmin,26px)}
.pic .del{position:absolute;top:-1.4vmin;right:-1.4vmin;width:clamp(28px,4.4vmin,40px);height:clamp(28px,4.4vmin,40px);border-radius:50%;
  background:#ff6b8b;color:#fff;font-size:clamp(18px,3vmin,28px);display:grid;place-items:center}
.pieceRow{display:flex;gap:2.4vmin;background:rgba(255,255,255,.45);padding:1.6vmin 2.4vmin;border-radius:99px}
.pbtn{border:none;background:#fff;border-radius:2.4vmin;padding:1.2vmin 1.6vmin;display:flex;flex-direction:column;align-items:center;gap:.6vmin;
  box-shadow:0 .7vmin 0 rgba(30,90,140,.16);opacity:.75}
.pbtn.sel{background:var(--yellow);opacity:1;transform:translateY(-.4vmin)}
.pbtn .mini{display:grid;gap:3px;width:clamp(34px,5.6vmin,52px);height:clamp(34px,5.6vmin,52px)}
.pbtn .mini i{background:var(--sea3);border-radius:3px}
.pbtn .mini.sil i{background:#2f4a7a;border-radius:50% 50% 40% 40%;opacity:.55}
.optRows{display:flex;gap:2.4vmin;flex-wrap:wrap;justify-content:center}
.pbtn .mini.shp{display:grid;place-items:center}
.pbtn .mini.shp svg{width:100%;height:100%;fill:var(--sea3)}
.pbtn .mini.shp .dice{font-size:clamp(26px,4.4vmin,40px);line-height:1}
.pbtn small{font-size:clamp(13px,2.1vmin,20px)}

/* 게임 */
#stage{position:absolute;inset:0;overflow:hidden}
.board{position:absolute;border-radius:2.2vmin}
.board.grid{background:rgba(255,255,255,.4);box-shadow:inset 0 0 0 .6vmin rgba(255,255,255,.85)}
.board canvas{position:absolute;inset:0;width:100%;height:100%}
.board.grid canvas{border-radius:2.2vmin}
.board .full{display:none}
.board.cheer{background:none;box-shadow:none;animation:cheer 1.1s ease-in-out infinite}
.board.cheer .full{display:block}
.board.cheer .guide{display:none}
@keyframes cheer{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-4%) scale(1.03,.98)}55%{transform:translateY(0) scale(1.02,.97)}}
.piece{position:absolute;touch-action:none;filter:drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.28));transition:transform .15s;animation:popsoft .3s}
.piece.grid{border-radius:1.2vmin}
.piece.hold{transform:scale(1.07);filter:drop-shadow(0 2vmin 1.6vmin rgba(0,50,100,.3))}
.piece.locked{transition:left .22s ease-out,top .22s ease-out;filter:none;border-radius:0}
.piece.hint{animation:hint 1s}
.piece.back{transition:left .4s cubic-bezier(.3,1.35,.5,1),top .4s cubic-bezier(.3,1.35,.5,1),transform .15s}
.slotHint{position:absolute;z-index:3;pointer-events:none;border-radius:1.2vmin;background:rgba(255,255,255,.5);
  box-shadow:inset 0 0 0 .8vmin #fff,0 0 3vmin 1vmin rgba(255,255,255,.9);animation:slotHint 1.6s ease-out forwards}
.board.charb .guide{filter:drop-shadow(0 0 .35vmin #fff) drop-shadow(0 0 .35vmin #fff)}
.piece.charp{filter:drop-shadow(0 0 .25vmin #fff) drop-shadow(0 0 .25vmin #fff) drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.28))}
.piece.charp.hold{filter:drop-shadow(0 0 .25vmin #fff) drop-shadow(0 0 .25vmin #fff) drop-shadow(0 2vmin 1.6vmin rgba(0,50,100,.3))}
.piece.charp.locked{filter:none}
.slotHint.shaped{background:none;box-shadow:none;border-radius:0;filter:drop-shadow(0 0 1.2vmin #fff)}
@keyframes slotHint{0%,30%,60%{opacity:1}15%,45%{opacity:.25}100%{opacity:0}}
@keyframes popin{from{transform:scale(0)}70%{transform:scale(1.12)}to{transform:scale(1)}}
@keyframes popsoft{from{transform:scale(.7)}70%{transform:scale(1.08)}to{transform:scale(1)}}
@keyframes hint{0%,100%{transform:none}20%{transform:rotate(-7deg) scale(1.06)}40%{transform:rotate(7deg) scale(1.06)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}

#stage.enter{animation:slideIn .3s ease-out}
#stage.leave{animation:slideOut .45s ease-in forwards}
@keyframes slideIn{from{transform:translateX(6vw);opacity:0}to{transform:none;opacity:1}}
@keyframes slideOut{to{transform:translateX(-30vw);opacity:0}}

/* 그림 그리기 */
.dwrap{position:absolute;inset:0;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr;gap:1.8vmin;padding:max(12px,1.8vmin) max(14px,2.2vmin)}
.dtop{grid-column:1/-1;display:flex;align-items:center;gap:1.8vmin}
.dtop .sp{flex:1}
.dtop .rbtn{border-radius:2.6vmin}
.tools{display:flex;flex-direction:column;gap:1.5vmin;justify-content:center}
.colors{display:grid;grid-template-columns:repeat(2,auto);align-content:center;gap:1.6vmin}
.paperBox{position:relative;display:grid;place-items:center;min-width:0;min-height:0}
.paper{position:relative;background:#fff;border-radius:2vmin;overflow:hidden;touch-action:none;
  box-shadow:0 1vmin 0 rgba(30,90,140,.18),0 2vmin 4vmin rgba(0,60,120,.15)}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
#lineCv{pointer-events:none}
.tbtn{position:relative;width:clamp(56px,10vmin,92px);height:clamp(56px,10vmin,92px);border:none;border-radius:2.6vmin;background:#fff;
  font-size:clamp(28px,5.6vmin,52px);box-shadow:0 .7vmin 0 rgba(30,90,140,.18);display:grid;place-items:center;transition:transform .12s,background .12s}
.tbtn.sel{background:var(--yellow);transform:scale(1.1)}
.tbtn .bar{position:absolute;left:18%;right:18%;bottom:9%;height:12%;border-radius:99px;background:var(--cc)}
.tbtn img{width:72%;height:72%;object-fit:contain}
.tbtn .dot{border-radius:50%;background:var(--ink)}
.cbtn{width:clamp(44px,7.6vmin,70px);height:clamp(44px,7.6vmin,70px);border-radius:50%;border:.6vmin solid #fff;background:var(--c);
  box-shadow:0 .6vmin 0 rgba(0,0,0,.12);transition:transform .12s}
.cbtn.sel{transform:scale(1.2);box-shadow:0 0 0 .5vmin var(--c),0 .8vmin 0 rgba(0,0,0,.12)}
.overlay{position:absolute;inset:0;z-index:90;background:rgba(25,70,120,.45);display:none;align-items:center;justify-content:center;padding:16px}
.overlay.on{display:flex;animation:fadein .25s}
.ovBox{background:rgba(255,255,255,.9);border-radius:4vmin;padding:3vmin 4vmin 4vmin;display:flex;flex-direction:column;align-items:center;gap:3vmin;max-height:100%;overflow:auto}
.ovBox h3{font-weight:400;font-size:clamp(24px,5vmin,48px)}
.ovGrid{display:flex;flex-wrap:wrap;justify-content:center;gap:2.4vmin;max-width:94vmin}
.ovGrid .pic{width:clamp(96px,15vmin,160px)}
.ovGrid .pic.blank{display:grid;place-items:center;font-size:clamp(18px,3vmin,28px);color:#9ab}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:95}
.flash.go{animation:flash .5s ease-out}
@keyframes flash{0%{opacity:.9}100%{opacity:0}}
@media (orientation:portrait){
  .dwrap{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
  .paperBox{grid-row:2}.tools{grid-row:3;flex-direction:row;justify-content:center;flex-wrap:wrap}
  .colors{grid-row:4;grid-template-columns:repeat(5,auto);justify-content:center}
}

/* 옷입히기 */
#dress{background:linear-gradient(180deg,#ffe6f1,#ffd0e4 60%,#ffc0da)}
.dsWrap{position:absolute;inset:0;display:grid;grid-template-columns:44% 1fr;gap:2vmin;padding:max(14px,2.2vmin);padding-top:max(14px,2.2vmin)}
.dollStage{position:relative;min-height:0;overflow:hidden;border-radius:4vmin;
  background:radial-gradient(ellipse at 50% 35%,#fff 0,rgba(255,255,255,.7) 35%,rgba(255,255,255,0) 70%)}
.floor{position:absolute;left:12%;right:12%;bottom:3%;height:9%;border-radius:50%;background:radial-gradient(ellipse,#ffadc9 0,rgba(255,173,201,0) 70%)}
.doll{position:absolute;inset:2% 4% 2%}
.doll svg{width:100%;height:100%;display:block;animation:sway 4s ease-in-out infinite;transform-origin:50% 95%}
@keyframes sway{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.doll.hop svg{animation:hop2 .6s ease}
@keyframes hop2{0%,100%{transform:none}35%{transform:translateY(-5%) scale(1.02,.98)}65%{transform:translateY(0) scale(1.03,.97)}}
.doll .eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.doll g.pop{animation:pop .55s ease;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.6);opacity:.3}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.fh{position:absolute;bottom:-8%;color:#fff;font-size:clamp(20px,4vmin,40px);opacity:.8;animation:floatUp 7s linear infinite}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.85}100%{transform:translateY(-110vh) rotate(40deg);opacity:0}}
.closet{display:flex;flex-direction:column;gap:2vmin;min-height:0;background:rgba(255,255,255,.65);border-radius:4vmin;padding:2.4vmin;margin-top:clamp(64px,10.5vmin,100px)}
.dtabs{display:flex;gap:1.6vmin;justify-content:center}
.dtab{width:clamp(56px,10vmin,90px);height:clamp(56px,10vmin,90px);border:none;border-radius:2.6vmin;background:#fff;font-size:clamp(28px,5.4vmin,50px);
  box-shadow:0 .7vmin 0 rgba(200,80,130,.18);display:grid;place-items:center;transition:transform .12s}
.dtab.sel{background:#ff8fb8;transform:translateY(-.6vmin) scale(1.06)}
.ditems{flex:1;min-height:0;overflow:hidden;touch-action:none;display:grid;grid-template-columns:repeat(4,1fr);gap:2vmin;align-content:start;padding:1vmin}
.ditem{touch-action:none}
.ditem.lift svg{opacity:.25}
.dragItem{position:fixed;left:0;top:0;z-index:120;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 1.4vmin 1.2vmin rgba(150,40,90,.3))}
.dragItem svg{width:100%;height:100%;display:block;overflow:visible}
.dollStage{transition:box-shadow .2s}
.dollStage.near{box-shadow:inset 0 0 0 1vmin rgba(255,255,255,.95),inset 0 0 6vmin rgba(255,143,184,.55)}
.ditem{position:relative;aspect-ratio:1;border:none;border-radius:3vmin;background:#fff;box-shadow:0 .8vmin 0 rgba(200,80,130,.15);padding:.8vmin;transition:transform .12s}
.ditem:active{transform:scale(.93)}
.ditem svg{width:100%;height:100%;display:block}
.ditem.on{box-shadow:0 0 0 .7vmin #ff6b9a,0 .8vmin 0 rgba(200,80,130,.15)}
.ditem.on::after{content:'♥';position:absolute;top:-1.2vmin;right:-1.2vmin;width:4.4vmin;height:4.4vmin;border-radius:50%;background:#ff6b9a;color:#fff;
  display:grid;place-items:center;font-size:2.6vmin}
.dacts{display:flex;justify-content:center;gap:3vmin}
.abtn{border:none;background:var(--c);color:#fff;border-radius:99px;padding:1vmin 3vmin;font-size:clamp(26px,4.6vmin,44px);display:flex;align-items:center;gap:1vmin;
  box-shadow:0 .8vmin 0 rgba(0,0,0,.12)}
.abtn small{font-size:clamp(16px,2.8vmin,26px)}
.abtn:active{transform:translateY(.6vmin)}
@media (orientation:portrait){
  .dsWrap{grid-template-columns:1fr;grid-template-rows:52% 1fr;padding-top:clamp(70px,11vmin,100px)}
  .closet{margin-top:0}
  .ditems{grid-template-columns:repeat(4,1fr)}
}

/* 공통 */
.area{position:absolute;inset:0;overflow:hidden}
.stars{display:flex;gap:.5vmin;align-self:center;font-size:clamp(20px,4.2vmin,40px);color:rgba(255,255,255,.6);text-shadow:0 2px 0 rgba(0,60,120,.15)}
.stars .on{color:#ffd65a;animation:pop .45s}

/* 비눗방울 */
.bb{position:absolute;bottom:0;touch-action:none;animation:bbRise var(--dur) linear forwards}
@keyframes bbRise{from{transform:translateY(100%)}to{transform:translateY(calc(-1 * var(--rise)))}}
.bbw{position:absolute;inset:0;border-radius:50%;animation:bbWob 3s ease-in-out infinite;
  background:radial-gradient(circle at 30% 27%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.25) 20%,rgba(200,240,255,.15) 55%,rgba(255,190,235,.35) 84%,rgba(255,255,255,.75) 100%);
  box-shadow:inset 0 0 2vmin rgba(255,255,255,.8),0 0 1.2vmin rgba(255,255,255,.45)}
.bbw img{position:absolute;left:16%;top:16%;width:68%;height:68%}
@keyframes bbWob{0%,100%{transform:translateX(-7%) scale(1,1)}25%{transform:translateX(0) scale(1.04,.96)}50%{transform:translateX(7%)}75%{transform:translateX(0) scale(.96,1.04)}}
.bbChar{position:fixed;z-index:50;pointer-events:none;animation:bbOut 1.1s ease-in forwards}
@keyframes bbOut{0%{transform:scale(1)}25%{transform:translateY(-30%) scale(1.3) rotate(-10deg)}100%{transform:translateY(70vh) scale(1) rotate(30deg);opacity:0}}

/* 까꿍 */
.spot{position:absolute;animation:popin .5s backwards;touch-action:none}
.spot .obj{position:absolute;inset:0;z-index:2;transform-origin:50% 100%}
.spot .obj svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.18))}
.spot .hider{position:absolute;left:22%;top:32%;width:56%;height:56%;z-index:1;transition:transform .55s cubic-bezier(.3,1.5,.5,1)}
.spot.peekHint .hider{animation:peekUp 1.3s ease-in-out}
.spot.peekHint .obj{animation:wig .6s .15s}
@keyframes peekUp{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(-40%)}}
.spot.found .hider{transform:translateY(-95%) scale(1.35);z-index:3}
.spot.found .obj{animation:squash .5s}
.spot.nope .obj{animation:lift .7s}
@keyframes lift{0%,100%{transform:none}30%,60%{transform:translateY(-14%) rotate(-4deg)}}
@keyframes squash{0%,100%{transform:none}40%{transform:scale(1.12,.84)}}

/* 상어 밥 주기 */
.shark{position:absolute;animation:bob 2.6s ease-in-out infinite}
.shark svg{width:100%;height:100%;display:block;overflow:visible;transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 60%}
.shark .mOpen{display:none}.shark.open .mOpen{display:inline}.shark.open .mClosed{display:none}
.shark.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.ask{position:absolute;z-index:5;background:#fff;border-radius:4vmin;padding:1.4vmin 3vmin;display:flex;align-items:center;gap:1.6vmin;
  font-size:clamp(22px,4.6vmin,46px);box-shadow:0 1vmin 0 rgba(30,90,140,.15);animation:popin .45s;white-space:nowrap}
.ask svg{width:clamp(60px,12vmin,120px);height:auto}
.fish{position:absolute;touch-action:none;filter:drop-shadow(0 .8vmin .7vmin rgba(0,50,100,.22));transition:transform .15s;animation:popsoft .3s}
.fish .fb{width:100%;height:100%;animation:fishBob 2.2s ease-in-out infinite}
.fish svg{width:100%;height:100%;display:block}
@keyframes fishBob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8%) rotate(3deg)}}
.fish.hold{transform:scale(1.15)}.fish.hold .fb{animation:none}
.fish.back{transition:left .4s cubic-bezier(.3,1.35,.5,1),top .4s cubic-bezier(.3,1.35,.5,1)}
.fish.eaten{transition:left .28s ease-in,top .28s ease-in,transform .28s ease-in;transform:scale(.15)}
.fish.hint .fb{animation:hint 1s}

/* ===== 디자인 다듬기 ===== */
.ico{width:64%;height:64%;display:block;overflow:visible}
.rbtn .ico{width:62%;height:62%}
.abtn .ico{width:1.25em;height:1.25em}
.dtab .ico{width:70%;height:70%}
.tbtn .ico{width:72%;height:72%}
.rbtn,.tbtn,.dtab,.cbtn,.pbtn,.pic,.ditem,.abtn,.card{transition:transform .12s ease,box-shadow .12s ease}
.rbtn:active,.tbtn:active,.dtab:active,.pbtn:active,.abtn:active{transform:translateY(3px) scale(.95)}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none}
#scene svg{width:100%;height:100%;display:block}
#scene .rays{animation:rays 10s ease-in-out infinite alternate;transform-origin:50% 0}
@keyframes rays{from{transform:skewX(-3deg)}to{transform:skewX(4deg)}}
#scene .sw{animation:sw2 3.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
#scene .sw.b{animation-duration:4.4s;animation-delay:-1.3s}
@keyframes sw2{from{transform:skewX(-7deg)}to{transform:skewX(7deg)}}
#scene .school{animation:school 40s linear infinite}
#scene .school.b{animation-duration:55s;animation-delay:-25s}
@keyframes school{from{transform:translateX(-260px)}to{transform:translateX(1860px)}}
/* 첫 화면 */
.title{color:#fff;-webkit-text-stroke:0;paint-order:stroke fill;filter:drop-shadow(0 .6vmin 0 rgba(30,110,170,.35))}
.title span{color:var(--tc);-webkit-text-stroke:.09em #fff;paint-order:stroke fill}
.card{background:#fff;padding:0;overflow:hidden;justify-content:flex-start;gap:0}
.card .art{display:block;width:100%;height:74%;background:var(--bgc)}
.card .art svg{width:100%;height:100%;display:block}
.card b{flex:1;display:grid;place-items:center;width:100%}
/* 퍼즐 판 */
.board.grid{background:rgba(255,255,255,.55);box-shadow:0 0 0 1.1vmin #fff,0 0 0 1.6vmin rgba(126,200,255,.6),0 2vmin 3.5vmin rgba(0,60,120,.28)}
.board.cheer{box-shadow:none}
/* 칭찬 리본 */
.dtab.sel{background:#fff;box-shadow:0 0 0 .7vmin #ff8fb8,0 .9vmin 0 rgba(200,80,130,.2)}
.abtn{background:#fff;color:var(--c);box-shadow:0 0 0 .5vmin var(--c),0 .9vmin 0 rgba(0,0,0,.1)}
/* ===== 받은 그림으로 바꾼 상어·물고기·숨는 곳 ===== */
.shark .sb{position:absolute;inset:0;transition:transform .6s cubic-bezier(.3,1.5,.5,1);transform-origin:50% 60%}
.shark .sb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 1.4vmin 1.4vmin rgba(0,60,120,.22))}
.shark .so{display:none}.shark.open .so{display:block}.shark.open .sc{display:none}
.shark .mHit{position:absolute;left:41%;top:61%;width:2px;height:2px}
.ask img{width:clamp(56px,10vmin,100px);height:clamp(56px,10vmin,100px);object-fit:contain;transform:scaleX(-1)}
.fish img{width:100%;height:100%;object-fit:contain;display:block}
.spot .obj img{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 1vmin .8vmin rgba(0,50,100,.2))}
/* ===== 퍼즐 여행 진행 표시 + 숲속 배경 ===== */
.pzProg{align-self:center;display:flex;gap:.6vmin;background:rgba(255,255,255,.75);padding:.8vmin 1.6vmin;border-radius:99px;box-shadow:0 .6vmin 0 rgba(30,90,140,.15)}
.pzProg img{width:clamp(28px,5.4vmin,50px);height:clamp(28px,5.4vmin,50px);object-fit:contain;opacity:.3;filter:grayscale(1);transition:all .3s}
.pzProg img.done{opacity:1;filter:none}
.pzProg img.now{opacity:1;filter:none;animation:bob 1.2s ease-in-out infinite;transform-origin:50% 100%}
#sceneLand{position:fixed;inset:0;z-index:0;pointer-events:none;display:none}
#sceneLand svg{width:100%;height:100%;display:block}
body.land #sceneLand{display:block}
body.land #scene,body.land #bubbles{display:none}
#sceneLand .cloud{animation:cloud 60s linear infinite}#sceneLand .cloud.b{animation-duration:85s;animation-delay:-40s}
@keyframes cloud{from{transform:translateX(-400px)}to{transform:translateX(2000px)}}
#sceneLand .sunr{animation:spin 30s linear infinite;transform-box:fill-box;transform-origin:center}
#sceneLand .sw{animation:sw2 3.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
/* ===== 스티커 / 내 바다 ===== */
.menu{display:flex;flex-wrap:wrap;justify-content:center;max-width:calc(4 * clamp(116px,21vmin,220px) + 3 * 4vmin + 34px)}
.card .badge{position:absolute;top:.8vmin;right:.8vmin;min-width:4.6vmin;height:4.6vmin;padding:0 1.2vmin;border-radius:99px;background:#ff5a6e;color:#fff;
  font-style:normal;font-size:clamp(14px,2.8vmin,26px);display:none;place-items:center;box-shadow:0 .4vmin 0 rgba(0,0,0,.12);animation:pop .5s}
.card .badge.on{display:grid}
.stk{position:absolute;touch-action:none;transform-origin:50% 60%}
.stk img,.stk svg{width:100%;height:100%;display:block;pointer-events:none;filter:drop-shadow(0 0 .3vmin #fff) drop-shadow(0 0 .3vmin #fff) drop-shadow(0 .7vmin .6vmin rgba(0,50,100,.25))}
.stk.shiny img,.stk.shiny svg{filter:drop-shadow(0 0 .5vmin #fff) drop-shadow(0 0 1.1vmin #ffd65a) drop-shadow(0 0 2vmin #ffb347)}
.stk.shiny::after{content:'✦';position:absolute;right:-6%;top:-6%;color:#fff;font-size:clamp(16px,3.4vmin,32px);text-shadow:0 0 6px #ffd65a;animation:twk .9s ease-in-out infinite alternate}
.stk.swim{animation:stkSwim 3.2s ease-in-out infinite}
.stk.bob{animation:stkBob 2.6s ease-in-out infinite}
@keyframes stkSwim{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(4%,-8%) rotate(3deg)}}
@keyframes stkBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6%)}}
.stk.jump{animation:stkJump .6s ease}
@keyframes stkJump{0%,100%{transform:none}40%{transform:translateY(-22%) scale(1.15) rotate(-8deg)}}
.stk.held{animation:none;transform:scale(1.15);z-index:60}
.tray{position:absolute;left:0;right:0;bottom:0;height:clamp(96px,19vmin,170px);background:rgba(255,255,255,.72);border-radius:4vmin 4vmin 0 0;
  box-shadow:0 -1vmin 3vmin rgba(0,60,120,.15);display:flex;align-items:center;gap:2vmin;padding:0 3vmin;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;z-index:40}
.tray .ti{position:relative;flex:0 0 auto;width:clamp(70px,14vmin,130px);height:clamp(70px,14vmin,130px);touch-action:pan-x}
.tray .ti .stk{position:absolute;inset:0;width:100%;height:100%;animation:none}
.tray .ti.new::before{content:'NEW';position:absolute;z-index:2;top:-1.4vmin;left:50%;transform:translateX(-50%);background:#ff5a6e;color:#fff;font-size:clamp(11px,1.8vmin,16px);
  padding:.2vmin 1.2vmin;border-radius:99px}
.tray .empty{width:100%;text-align:center;font-size:clamp(18px,3.6vmin,34px);color:#5b7896}
.seaCount{align-self:center;background:rgba(255,255,255,.85);border-radius:99px;padding:1vmin 3vmin;font-size:clamp(18px,3.4vmin,32px);box-shadow:0 .6vmin 0 rgba(30,90,140,.15)}
#reward{position:fixed;inset:0;z-index:160;pointer-events:none;display:none;align-items:center;justify-content:center;flex-direction:column}
#reward.on{display:flex}
#reward .rays{position:absolute;width:70vmin;height:70vmin;border-radius:50%;
  background:repeating-conic-gradient(rgba(255,230,120,.55) 0 12deg,rgba(255,255,255,0) 12deg 24deg);mask:radial-gradient(circle,#000 30%,transparent 70%);
  -webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#reward .rs{position:relative;width:34vmin;height:34vmin}
#reward .rs .stk{inset:0;width:100%;height:100%;animation:none}
#reward b{position:relative;margin-top:2vmin;font-weight:400;font-size:clamp(28px,6vmin,58px);color:#fff;-webkit-text-stroke:.08em #ff6b9a;paint-order:stroke fill}
#reward.pop .rs,#reward.pop b{animation:rewardIn .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes rewardIn{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.rbtn.got{animation:got .6s ease 2}
@keyframes got{50%{transform:scale(1.25);box-shadow:0 0 0 1vmin #ffd65a}}
#cheer{position:fixed;left:50%;top:max(14px,3vh);width:min(72vw,620px);aspect-ratio:640/170;z-index:150;pointer-events:none;
  transform:translate(-50%,-180%) scale(.6);transition:transform .55s cubic-bezier(.3,1.5,.5,1);filter:drop-shadow(0 1vmin 1.2vmin rgba(150,30,80,.25))}
#cheer.on{transform:translate(-50%,0) scale(1)}
#cheer svg{width:100%;height:100%;display:block}
#cheer b{position:absolute;left:12%;right:12%;top:30%;text-align:center;color:#fff;font-weight:400;font-size:clamp(26px,5.4vmin,56px);
  line-height:1;text-shadow:0 .08em 0 rgba(160,30,80,.4);white-space:nowrap}
#cheer .cs{position:absolute;font-style:normal;color:#ffd65a;font-size:clamp(26px,5vmin,52px);text-shadow:0 2px 0 rgba(0,0,0,.1);animation:twk 1s ease-in-out infinite alternate}
#cheer .cs:nth-of-type(2){animation-delay:-.4s;color:#7ec8ff}#cheer .cs:nth-of-type(3){color:#fff;animation-delay:-.7s}
@keyframes twk{from{transform:scale(.8) rotate(-12deg)}to{transform:scale(1.15) rotate(12deg)}}

.pt{position:fixed;font-size:var(--s);color:var(--c);pointer-events:none;z-index:999;line-height:1;animation:fly .9s cubic-bezier(.2,.7,.4,1) forwards;
  text-shadow:0 2px 0 rgba(255,255,255,.7)}
.pt.long{animation-duration:1.8s}
@keyframes fly{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}70%{opacity:1}
  100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1) rotate(var(--r));opacity:0}}
</style>
</head>
<body>
<div id="scene"></div>
<div id="sceneLand"></div>
<div id="bubbles"></div>
<div id="cheer"><svg viewBox="0 0 640 170"><path d="M70 62 L4 46 L30 92 L4 138 L82 124 Z" fill="#e0457a"/><path d="M570 62 L636 46 L610 92 L636 138 L558 124 Z" fill="#e0457a"/><path d="M60 54 Q320 2 580 54 L580 126 Q320 74 60 126 Z" fill="#ff6b9a"/><path d="M60 54 Q320 2 580 54 L580 64 Q320 12 60 64 Z" fill="#fff" opacity=".25"/></svg><b id="cheerTxt"></b><i class="cs" style="left:4%;top:-10%">★</i><i class="cs" style="right:6%;top:-16%">★</i><i class="cs" style="left:44%;top:-34%">♥</i></div>

<section id="home" class="screen on">
  <div class="topbar"><span></span><button class="rbtn musicBtn" aria-label="음악"></button></div>
  <div class="lane"><div class="swim"><img id="swimImg" alt=""></div></div>
  <span id="ver"></span>
  <div class="homeWrap">
    <h1 class="title" id="title"></h1>

      <button class="card" id="goPuzzle" style="--c:#ffd65a"><span class="art" data-art="puzzle"></span><b>퍼즐</b></button>
      <button class="card" id="goDraw" style="--c:#ff9eb5"><span class="art" data-art="draw"></span><b>그림</b></button>

<section id="select" class="screen">
  <div class="topbar"><button class="rbtn" id="selBack" aria-label="처음으로" data-ic="home"></button><button class="rbtn musicBtn" aria-label="음악"></button></div>

<script>
/* ================= 캐릭터 그림 (직접 그린 오리지널) ================= */
function sea(top,bot){return `<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs>
<rect width="600" height="600" fill="url(#sg)"/>
<g fill="#fff" opacity=".55"><circle cx="70" cy="110" r="16"/><circle cx="105" cy="62" r="9"/><circle cx="525" cy="95" r="13"/><circle cx="548" cy="165" r="22" opacity=".7"/></g>
<g fill="none" stroke="#5ccf95" stroke-width="18" stroke-linecap="round"><path d="M60 600 Q35 545 62 495 Q88 445 62 400"/><path d="M540 600 Q565 550 538 505 Q512 460 540 420"/></g>
<ellipse cx="300" cy="615" rx="430" ry="95" fill="#ffe3a3"/>`}
const wrap=(inner,bg,c)=>`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">${bg?sea(c[0],c[1]):''}${inner}</svg>`;
// 눈: 흰자 + 갈색 눈동자 + 큰 반짝이 (ChatGPT 그림체에 맞춰 크고 또렷하게)
const eye=(x,y,r=22)=>{r*=1.12;return `<ellipse cx="${x}" cy="${y}" rx="${r*1.05}" ry="${r*1.16}" fill="#fff"/>
  <ellipse cx="${x+r*.06}" cy="${y+r*.1}" rx="${r*.86}" ry="${r*.98}" fill="#6b3d22"/><ellipse cx="${x+r*.06}" cy="${y+r*.18}" rx="${r*.52}" ry="${r*.6}" fill="#1c100a"/>
  <path d="M${x-r*1.02} ${y-r*.2} Q${x} ${y-r*1.45} ${x+r*1.02} ${y-r*.2}" stroke="#1c100a" stroke-width="${r*.2}" fill="none" stroke-linecap="round"/>
  <circle cx="${x+r*.36}" cy="${y-r*.34}" r="${r*.34}" fill="#fff"/><circle cx="${x-r*.3}" cy="${y+r*.48}" r="${r*.15}" fill="#fff"/>`;};
// 웃으며 벌린 입
const mouth=(x,y,w)=>`<path d="M${x-w} ${y} Q${x} ${y+w*1.5} ${x+w} ${y} Q${x} ${y+w*.3} ${x-w} ${y} Z" fill="#b8324b"/><ellipse cx="${x}" cy="${y+w*.78}" rx="${w*.5}" ry="${w*.26}" fill="#ff8fa3"/>`;
const cheek=(x,y)=>`<ellipse cx="${x}" cy="${y}" rx="22" ry="14" fill="#ff9eb5" opacity=".85"/>`;

const CHARS=[
 {id:'shark',name:'상어',c:['#c9f3ff','#7fd0f5'],art:`
  <path d="M150 320 L40 210 Q85 320 40 430 Z" fill="#6fc0ee"/>
  <path d="M245 210 Q290 105 365 200 Z" fill="#6fc0ee"/>
  <ellipse cx="310" cy="320" rx="195" ry="135" fill="#8fd3f7"/>
  <ellipse cx="330" cy="378" rx="140" ry="66" fill="#effaff"/>
  <path d="M270 395 Q245 480 335 455 Z" fill="#6fc0ee"/>
  <g stroke="#6fc0ee" stroke-width="7" stroke-linecap="round" fill="none"><path d="M300 270 Q310 300 300 330"/><path d="M325 265 Q335 295 325 325"/></g>
  ${eye(410,285,30)}${cheek(445,345)}
  <path d="M418 382 Q448 402 476 376" stroke="#2b3a55" stroke-width="8" stroke-linecap="round" fill="none"/>`},
 {id:'penguin',name:'펭귄',c:['#e6f7ff','#9fd8f5'],art:`
  <ellipse cx="160" cy="380" rx="34" ry="88" fill="#2f4a7a" transform="rotate(25 160 380)"/>
  <ellipse cx="440" cy="380" rx="34" ry="88" fill="#2f4a7a" transform="rotate(-25 440 380)"/>
  <ellipse cx="245" cy="532" rx="48" ry="20" fill="#ffa733"/><ellipse cx="355" cy="532" rx="48" ry="20" fill="#ffa733"/>
  <ellipse cx="300" cy="340" rx="150" ry="195" fill="#2f4a7a"/>
  <ellipse cx="300" cy="378" rx="108" ry="150" fill="#fff"/>
  ${eye(258,285,20)}${eye(342,285,20)}
  <path d="M272 318 Q300 354 328 318 Q300 306 272 318 Z" fill="#ffa733"/>

/* ================= 소리 (Web Audio로 직접 합성) ================= */
const AU={ctx:null,master:null,bgm:null};
function audio(){
  if(!AU.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    AU.ctx=new C();AU.master=AU.ctx.createGain();AU.master.gain.value=.9;AU.master.connect(AU.ctx.destination);
    AU.bgm=AU.ctx.createGain();AU.bgm.gain.value=.3;AU.bgm.connect(AU.master);}
  if(AU.ctx.state==='suspended')AU.ctx.resume();
  return AU.ctx;
}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function tone({f,f2,t=0,at,d=.15,type='sine',v=.3,a=.006,out}){
  const c=audio();if(!c)return;const s=at??c.currentTime+t;
  const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,s);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,s+d*.8);
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+a);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  o.connect(g);g.connect(out||AU.master);o.start(s);o.stop(s+d+.05);
}
function bell(f,t,v=.22,d=.6,at){tone({f,t,at,d,v});tone({f:f*2,t,at,d:d*.5,v:v*.28});tone({f:f*3.01,t,at,d:d*.25,v:v*.1});}
const PENT=[72,74,76,79,81,84,86,88,91];
const sfx={
  tap(){tone({f:660,f2:990,d:.1,v:.22});tone({f:1320,t:.04,d:.07,v:.08});},
  pick(){tone({f:320,f2:900,d:.13,v:.28});},                       // 뽀록
  drop(){tone({f:520,f2:260,d:.2,v:.18,type:'triangle'});},         // 뿅~
  snap(i){tone({f:900,f2:1700,d:.07,v:.18});bell(mtof(PENT[Math.min(i,PENT.length-1)]),.05,.26,.7);},
  nope(){tone({f:440,f2:380,d:.16,v:.18,type:'triangle'});tone({f:380,f2:300,t:.18,d:.22,v:.18,type:'triangle'});},
  bubble(){tone({f:500+Math.random()*300,f2:1400,d:.09,v:.15});},
  fanfare(){[72,76,79,84].forEach((m,i)=>{tone({f:mtof(m),t:i*.12,d:.28,v:.2,type:'triangle'});bell(mtof(m+12),i*.12,.08,.3);});
    [84,88,91].forEach(m=>bell(mtof(m),.52,.16,1.2));
    for(let i=0;i<10;i++)tone({f:1800+Math.random()*2200,t:.55+i*.08,d:.15,v:.05});}
};

let NB=null;
function noise({t=0,d=.2,v=.2,f=1200,f2,q=.8,type='bandpass'}){const c=audio();if(!c)return;
  if(!NB){NB=c.createBuffer(1,c.sampleRate,c.sampleRate);const a=NB.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;}
  const s=c.currentTime+t,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();src.buffer=NB;
  fl.type=type;fl.frequency.setValueAtTime(f,s);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,s+d);fl.Q.value=q;
  g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.01);g.gain.exponentialRampToValueAtTime(.0001,s+d);
  src.connect(fl);fl.connect(g);g.connect(AU.master);src.start(s);src.stop(s+d+.05);}
Object.assign(sfx,{
  whoosh(){noise({f:3500,f2:250,d:.55,v:.35,q:.6});tone({f:900,f2:200,d:.5,v:.1,type:'triangle'});},
  pour(){[0,.07,.14,.21].forEach((t,i)=>tone({f:300+i*120,f2:900+i*150,t,d:.1,v:.16}));},
  stamp(){tone({f:180,f2:90,d:.12,v:.35,type:'triangle'});tone({f:600,f2:1500,t:.06,d:.1,v:.14});},
  shutter(){noise({f:5000,d:.05,v:.4,type:'highpass'});noise({f:3000,t:.09,d:.07,v:.3,type:'highpass'});bell(mtof(84),.2,.12,.5);bell(mtof(91),.3,.1,.6);},
  undo(){tone({f:900,f2:450,d:.14,v:.18});},
  rub(){noise({f:1800,d:.08,v:.05,q:1.5});},
  pop(){noise({f:4500,d:.05,v:.3,type:'highpass'});tone({f:1400,f2:320,d:.12,v:.22});},
  giggle(){[0,.13,.26].forEach((t,i)=>tone({f:900+i*90,f2:1300+i*90,t,d:.09,v:.12,type:'triangle'}));},
  peek(){tone({f:300,f2:1200,d:.3,v:.2,type:'triangle'});[0,1,2,3].forEach(i=>bell(mtof(PENT[i+3]),.25+i*.07,.1,.4));},
  chomp(){[0,.2].forEach(t=>{tone({f:230,f2:110,t,d:.13,v:.35,type:'triangle'});noise({f:700,t,d:.08,v:.15});});},
});

function buildSong(s,loop){const ev=[],B=s.beats,alt=loop%2===1;let t=0;
  const lead=alt?({box:'marimba',marimba:'bell',flute:'box'}[s.lead]):s.lead;
  s.mel.forEach(([m,b])=>{if(m)ev.push({t,k:'mel',m,b,inst:lead});t+=b;});
  s.ch.forEach(([r,q],i)=>{const o=i*B,stab=[r+24,r+24+q,r+31];
    const bass=(bt,m,d=.5)=>ev.push({t:o+bt,k:'bass',m,d}),chord=bt=>stab.forEach(m=>ev.push({t:o+bt,k:'stab',m})),tick=bt=>ev.push({t:o+bt,k:'tick'});
    if(s.acc==='pluck'){bass(0,r);bass(2,r+7);tick(1);tick(3);}
    else if(s.acc==='oompah'){bass(0,r,.25);chord(1);bass(2,r+7,.25);chord(3);}
    else if(s.acc==='waltz'){bass(0,r,1.2);chord(1);chord(2);}
    else{bass(0,r);bass(2,r+7);chord(1.5);chord(3.5);[0,1,2,3].forEach(tick);}
    if(alt){const base=72+((r%12)+12)%12;const arp=[base,base+q,base+7,base+12];   // 두 번째엔 반짝이 아르페지오
      for(let k=0;k<B*2;k++)ev.push({t:o+k*.5,k:'arp',m:arp[k%4]});}});
  ev.sort((a,b)=>a.t-b.t);return{ev,len:t};}
const PL={song:Math.floor(Math.random()*SONGS.length),loop:0,ev:[],len:0,spb:.5,start:0,idx:0};

let bgmTimer=null;
function bgmNote(e,at){const o=AU.bgm,f=mtof(e.m||0),spb=PL.spb;
  if(e.k==='mel'){const d=e.b*spb;
    if(e.inst==='box'){tone({f,at,d:d*.9+.45,v:.13,out:o});tone({f:f*2,at,d:.35,v:.035,out:o});}
    else if(e.inst==='marimba'){tone({f,at,d:Math.min(.5,d+.2),v:.15,out:o});tone({f:f*4,at,d:.07,v:.03,out:o});}
    else if(e.inst==='flute'){tone({f,at,d:d*.95+.25,v:.11,a:.05,type:'triangle',out:o});tone({f:f*2,at,d:d*.8,v:.012,a:.05,out:o});}
    else{tone({f:f*2,at,d:.6,v:.07,out:o});tone({f,at,d:.4,v:.06,out:o});}}
  else if(e.k==='bass')tone({f,at,d:e.d,v:.09,type:'triangle',out:o});
  else if(e.k==='stab')tone({f,at,d:.18,v:.03,out:o});
  else if(e.k==='arp')tone({f:f*2,at,d:.22,v:.022,out:o});
  else tone({f:1500,f2:2300,at,d:.05,v:.02,out:o});}
function bgmTick(){const c=AU.ctx,h=c.currentTime+.35;
  for(let guard=0;guard<500;guard++){
    if(PL.idx>=PL.ev.length){PL.start+=PL.len*PL.spb;PL.loop++;
      if(PL.loop>=2){PL.loop=0;PL.song=(PL.song+1)%SONGS.length;PL.start+=PL.spb*2;}loadSeg();continue;}
    const e=PL.ev[PL.idx],at=PL.start+e.t*PL.spb;if(at>h)break;bgmNote(e,at);PL.idx++;}}

async function startGame(){
  show('game');G=null;stage.innerHTML='';stage.classList.remove('leave','enter');void stage.offsetWidth;stage.classList.add('enter');
  const it=pzItem(),LV=pzLevel();document.body.classList.toggle('land',PZ.world==='land');renderProg();
  const n=LV.n,[cols,rows]=LAYOUT[n],sil=false;
  const W=stage.clientWidth,H=stage.clientHeight,land=W>=H,top=Math.min(120,H*.13);
  let B=n===1?(land?Math.min(H*.66,W*.42):Math.min(W*.66,H*.4)):(land?Math.min(H*.62,W*.46):Math.min(W*.74,H*.44));
  B=Math.round(B);
  let bx,by;
  if(n===1&&land){bx=W*.7-B/2;by=(H-B)/2+top*.3;}else if(n===1){bx=(W-B)/2;by=H*.7-B/2;}else{bx=(W-B)/2;by=(H-B)/2+top*.3;}
  const dpr=Math.min(2,window.devicePixelRatio||1),R=Math.round(B*dpr);
  const cm=!it.photo;   // 캐릭터 모양으로 따기 (배경 없이 캐릭터만)
  const src=await loadImg(it.photo?it.src:svgURL(it.svg(!sil&&!cm)));
  const full=document.createElement('canvas');full.width=full.height=R;full.className='full';
  const fctx=full.getContext('2d',{willReadFrequently:cm});fctx.drawImage(src,0,0,R,R);
  // 캐릭터 모양일 때: 캐릭터가 실제로 있는 영역(투명 아닌 곳)만 나눔
  let ox=0,oy=0,AW=B,AH=B;
  if(cm){const d=fctx.getImageData(0,0,R,R).data;let x0=R,y0=R,x1=0,y1=0;
    for(let y=0;y<R;y+=2)for(let x=0;x<R;x+=2)if(d[(y*R+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
    if(x1>x0&&y1>y0){ox=x0/dpr;oy=y0/dpr;AW=(x1-x0+2)/dpr;AH=(y1-y0+2)/dpr;}}
  // 조각 모양 정하기: 네모 / 퍼즐(볼록) / 물결, 섞기는 판마다 무작위
  const pw=AW/cols,ph=AH/rows,style=LV.style;
  const J={cw:pw,ch:ph,k:Math.min(pw,ph),style,rows,cols,H:[],V:[]};
  for(let r=0;r<rows;r++){J.H[r]=[];J.V[r]=[];for(let c=0;c<cols;c++){J.H[r][c]=Math.random()<.5?1:-1;J.V[r][c]=Math.random()<.5?1:-1;}}
  const mg=style==='jigsaw'?J.k*.34:style==='wave'?J.k*.14:0;

  const guide=document.createElement('canvas');guide.width=guide.height=R;guide.className='guide';const g=guide.getContext('2d');
  if(sil){g.drawImage(full,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(35,75,135,.38)';g.fillRect(0,0,R,R);}
  else if(cm){ // 캐릭터 그림자 + 흐린 그림 + 그 안에만 자르는 점선
    g.drawImage(full,0,0);g.globalCompositeOperation='source-in';g.fillStyle='rgba(30,80,140,.3)';g.fillRect(0,0,R,R);
    g.globalCompositeOperation='source-atop';g.globalAlpha=.28;g.drawImage(full,0,0);g.globalAlpha=1;
    g.scale(dpr,dpr);g.setLineDash([B*.03,B*.022]);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(2.5,B*.007);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){g.save();g.translate(ox+c*pw,oy+r*ph);g.stroke(piecePath(r,c,J));g.restore();}}
  else{g.globalAlpha=.24;g.drawImage(full,0,0);g.globalAlpha=1;g.scale(dpr,dpr);g.setLineDash([B*.03,B*.022]);g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=Math.max(2.5,B*.007);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){g.save();g.translate(c*pw,r*ph);g.stroke(piecePath(r,c,J));g.restore();}}
  const board=document.createElement('div');board.className='board'+(sil?'':cm?' charb':' grid');
  Object.assign(board.style,{left:bx+'px',top:by+'px',width:B+'px',height:B+'px'});board.append(guide,full);stage.appendChild(board);

  const P=[];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const path=piecePath(r,c,J),cv=document.createElement('canvas');
    cv.width=Math.round((pw+2*mg)*dpr);cv.height=Math.round((ph+2*mg)*dpr);
    const x=cv.getContext('2d',{willReadFrequently:true});x.scale(dpr,dpr);x.translate(mg,mg);

    cv.className='piece'+(cm?' charp':sil||style!=='square'?'':' grid');cv.style.width=(pw+2*mg)+'px';cv.style.height=(ph+2*mg)+'px';
    const p={el:cv,tx:bx+ox+c*pw,ty:by+oy+r*ph,w:pw,h:ph,m:mg,path,cm,x:0,y:0,locked:false};cv.__p=p;
    if(cm){ // 캐릭터가 거의 안 걸린 조각(구석 등)은 처음부터 제자리에 붙여둠

// 조각 테두리: 이웃한 두 조각이 같은 선을 반대 방향으로 따라가서 꼭 맞물림
function edgeTo(path,x0,y0,x1,y1,b,style,k){

  const L=Math.hypot(x1-x0,y1-y0),ux=(x1-x0)/L,uy=(y1-y0)/L,nx=uy,ny=-ux; // n = 바깥쪽
  const P=(a,n)=>[x0+ux*a+nx*n*b,y0+uy*a+ny*n*b];
  if(style==='wave'){for(let i=1;i<=36;i++){const t=i/36;path.lineTo(...P(t*L,Math.sin(3*Math.PI*t)*k*.11));}return;}
  const pt=(t,n)=>P(L/2+(t-.5)*k,n*k);

  path.bezierCurveTo(...pt(.33,.17),...pt(.36,.32),...pt(.50,.32));
  path.bezierCurveTo(...pt(.64,.32),...pt(.67,.17),...pt(.60,.10));

let FST=null;

const LINE={};

  for(let y=0;y<N;y++)for(let xx=0;xx<N;xx++){const i=y*N+xx,k=i*4;

async function setPage(ch){D.undo=[];pctx.clearRect(0,0,PW,PH);lctx.clearRect(0,0,PW,PH);D.page=ch?ch.id:null;D.lineAlpha=null;

/* 옷을 눌러서 인형 쪽으로 끌고 가면 '딱' 붙기 (퍼즐처럼). 톡 누르기만 해도 날아가서 입혀짐 */
let DG=null;
function dollMap(){const r=$('doll').getBoundingClientRect(),s=Math.min(r.width/400,r.height/700);
  return{r,s,ox:r.left+(r.width-400*s)/2,oy:r.top+(r.height-700*s)/2+40*s};}   // 인형 좌표 (x,y) → 화면 (ox+x*s, oy+y*s)
const itemBox=it=>(it.cat==='hair'?'70 0 260 440':it.box).split(' ').map(Number);

function dgSet(x,y,k,dur){const el=DG.el;el.style.transition=dur?`transform ${dur}s cubic-bezier(.3,1.2,.5,1),opacity ${dur}s`:'none';
  el.style.transform=`translate(${x}px,${y}px) scale(${k})`;DG.x=x;DG.y=y;DG.k=k;}
function bindItemDrag(it,tile){
  tile.addEventListener('pointerdown',e=>{if(DG)return;e.preventDefault();try{tile.setPointerCapture(e.pointerId);}catch(_){}
    const tr=tile.getBoundingClientRect(),[bx,by,bw,bh]=itemBox(it),M=dollMap(),W=bw*M.s,H=bh*M.s;
    const el=document.createElement('div');el.className='dragItem';el.style.width=W+'px';el.style.height=H+'px';
    el.innerHTML=`<svg viewBox="${bx} ${by} ${bw} ${bh}">${itemArt(it)}</svg>`;document.body.appendChild(el);
    const k0=Math.min(tr.width/W,tr.height/H)*.85,hx=tr.left+tr.width/2-W*k0/2,hy=tr.top+tr.height/2-H*k0/2;
    DG={it,tile,el,W,H,id:e.pointerId,sx:e.clientX,sy:e.clientY,moved:false,k0,hx,hy,tx:M.ox+bx*M.s,ty:M.oy+by*M.s,M};
    dgSet(hx,hy,k0,0);tile.classList.add('lift');sfx.pick();});
  tile.addEventListener('pointermove',e=>{if(!DG||DG.id!==e.pointerId)return;
    if(!DG.moved&&Math.hypot(e.clientX-DG.sx,e.clientY-DG.sy)<12)return;
    const first=!DG.moved;DG.moved=true;
    dgSet(e.clientX-DG.W/2,e.clientY-DG.H*.45,1,first?.18:0);                     // 끌면 인형 크기로 커짐
    $('dollStage').classList.toggle('near',nearDoll(e));});
  const up=e=>{if(!DG||DG.id!==e.pointerId)return;const d=DG,s=slotOf(d.it),worn=DS[s]===d.it.id;$('dollStage').classList.remove('near');
    if(!d.moved){ if(worn&&s!=='hair')takeOff(d);else snapOn(d,.5); }      // 톡: 입었으면 벗기, 아니면 날아가서 입히기
    else if(nearDoll(e))snapOn(d,.22);
    else{sfx.drop();dgSet(d.hx,d.hy,d.k0,.32);d.el.style.opacity=.2;setTimeout(()=>dgEnd(d),330);}};
  tile.addEventListener('pointerup',up);tile.addEventListener('pointercancel',up);}
function nearDoll(e){const r=DG.M.r,mx=r.width*.12,my=r.height*.04;   // 인형 몸 근처면 붙음 (아이 손에 맞게 넉넉히)
  return e.clientX>r.left+mx&&e.clientX<r.right-mx&&e.clientY>r.top+my&&e.clientY<r.bottom-my;}

    tone({f:700,f2:1500,d:.08,v:.2});sparkle();say(d.it.name);happyFace();drawDoll(s);hop();
    burst(d.tx+d.W/2,d.ty+d.H/2,16,Math.max(d.W,d.H)*.6);store.set('yj_doll',JSON.stringify(DS));dgEnd(d);renderCloset();},dur*1000);}
function takeOff(d){const s=slotOf(d.it);DS[s]=null;drawDoll();store.set('yj_doll',JSON.stringify(DS));sfx.drop();
  dgSet(d.tx,d.ty,1,0);requestAnimationFrame(()=>{dgSet(d.hx,d.hy,d.k0,.38);setTimeout(()=>{dgEnd(d);renderCloset();},400);});}
function dgEnd(d){d.el.remove();d.tile.classList.remove('lift');if(DG===d)DG=null;}

    const a=rs.getBoundingClientRect(),t=btn?btn.getBoundingClientRect():{left:20,top:20,width:60,height:60};
    const dx=t.left+t.width/2-(a.left+a.width/2),dy=t.top+t.height/2-(a.top+a.height/2);
    const an=rs.animate([{transform:'none'},{transform:`translate(${dx}px,${dy}px) scale(.15)`}],{duration:650,easing:'ease-in',fill:'forwards'});
    R.querySelector('b').animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'});R.querySelector('.rays').animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});
    let done=false;const fin=()=>{if(done)return;done=true;R.classList.remove('on','pop');an.cancel();R.querySelectorAll('b,.rays').forEach(el=>el.getAnimations().forEach(x=>x.cancel()));
      if(btn){btn.classList.remove('got');void btn.offsetWidth;btn.classList.add('got');}sfx.pop();};
    an.onfinish=fin;setTimeout(fin,1000);},1700);}

// 내 바다 화면
function seaOpen(){show('sea');seaRender();}
function seaSize(k){const A=$('seaArea');return Math.min(A.clientWidth,A.clientHeight)*.21*stkSize(k);}
function seaRender(){const A=$('seaArea');A.innerHTML='';
  ST.list.filter(s=>s.placed).forEach(s=>A.appendChild(placedEl(s)));renderTray();
  $('seaCount').textContent=`스티커 ${ST.list.length}개`;syncBadge();}
function placedEl(s){const A=$('seaArea'),z=seaSize(s.k),el=document.createElement('div');
  el.className='stk'+(s.shiny?' shiny':'')+(s.k.startsWith('f:')?' swim':s.k.startsWith('c:')?' bob':'');
  el.style.cssText=`width:${z}px;height:${z}px;left:${s.x*A.clientWidth-z/2}px;top:${s.y*A.clientHeight-z/2}px;animation-delay:-${(s.id%3).toFixed(2)}s`;
  el.innerHTML=stkInner(s.k);el.__s=s;bindStk(el,s,false);return el;}
function renderTray(){const T=$('tray');T.innerHTML='';const left=ST.list.filter(s=>!s.placed);
  if(!left.length){T.innerHTML=`<div class="empty">${ST.list.length?'바다에 다 붙였어요! 놀이를 하면 또 받아요':'놀이를 하면 스티커를 받아요!'}</div>`;return;}
  left.slice().reverse().forEach(s=>{const w=document.createElement('div');w.className='ti'+(s.seen?'':' new');
    const el=document.createElement('div');el.className='stk'+(s.shiny?' shiny':'');el.innerHTML=stkInner(s.k);w.appendChild(el);bindStk(w,s,true);T.appendChild(w);});
  left.forEach(s=>s.seen=true);saveST();}
// 스티커 끌기: 쟁반에서 위로 끌어 바다에 붙이고, 붙인 것도 다시 옮기거나 쟁반으로 돌려놓기
function bindStk(el,s,fromTray){let d=null;
  el.addEventListener('pointerdown',e=>{if(d)return;d={id:e.pointerId,sx:e.clientX,sy:e.clientY,on:false};
    if(!fromTray){e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}}});
  el.addEventListener('pointermove',e=>{if(!d||d.id!==e.pointerId)return;
    if(!d.on){const dx=e.clientX-d.sx,dy=e.clientY-d.sy;if(Math.hypot(dx,dy)<10)return;
      if(fromTray&&Math.abs(dx)>Math.abs(dy))return;     // 쟁반에서 옆으로 밀면 스크롤
      d.on=true;try{el.setPointerCapture(e.pointerId);}catch(_){}
      const z=seaSize(s.k);d.z=z;d.fl=fromTray?document.createElement('div'):el;
      if(fromTray){d.fl.className='stk held'+(s.shiny?' shiny':'');d.fl.innerHTML=stkInner(s.k);d.fl.style.cssText=`position:fixed;width:${z}px;height:${z}px;z-index:170`;document.body.appendChild(d.fl);el.style.opacity=.3;}
      else d.fl.classList.add('held');sfx.pick();}
    const A=$('seaArea').getBoundingClientRect();
    if(fromTray){d.fl.style.left=(e.clientX-d.z/2)+'px';d.fl.style.top=(e.clientY-d.z/2)+'px';}
    else{d.fl.style.left=(e.clientX-A.left-d.z/2)+'px';d.fl.style.top=(e.clientY-A.top-d.z/2)+'px';}});
  const up=e=>{if(!d||d.id!==e.pointerId)return;const was=d;d=null;
    if(!was.on){if(!fromTray){el.classList.remove('jump');void el.offsetWidth;el.classList.add('jump');sfx.bubble();say(stkName(s.k));}
      else{el.querySelector('.stk').animate([{transform:'scale(1)'},{transform:'scale(1.15)'},{transform:'scale(1)'}],{duration:300});say(stkName(s.k));}return;}
    const A=$('seaArea').getBoundingClientRect(),trayTop=$('tray').getBoundingClientRect().top;
    if(e.clientY<trayTop-10){s.placed=true;s.x=Math.min(.97,Math.max(.03,(e.clientX-A.left)/A.width));s.y=Math.min(.95,Math.max(.12,(e.clientY-A.top)/A.height));
      tone({f:700,f2:1500,d:.08,v:.2});bell(mtof(84),.05,.12,.5);burst(e.clientX,e.clientY,12,60);}
    else{s.placed=false;sfx.drop();}
    saveST();if(was.fl&&fromTray)was.fl.remove();seaRender();};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',e=>{if(d&&!d.on)d=null;else up(e);});}
addEventListener('resize',()=>{if(S.screen==='sea')seaRender();});
$('goSea').onclick=()=>{sfx.tap();say('내 바다를 꾸며요');seaOpen();};
$('seaBack').onclick=()=>{sfx.tap();show('home');syncBadge();};
syncBadge();
