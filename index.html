/* ================= 목욕 놀이: 쓱쓱 문질러 비누 거품 → 샤워기로 쏴아 → 수건으로 뽀송뽀송 → 침대에서 코~ ================= */
const BA={round:0,gen:0,stage:'load',last:0,who:null,cv:null,cx:null,N:0,init:1,G:null,lp:null,pid:null,dist:0,lastSnd:0,chk:0,kind:'mud',st:0,noT:0,im:null,pat:0};
// 진행 그림: 비누 · 샤워 · 수건 · 침대
const baProg=()=>stepBar('baStars',['sponge','shower','ba_towel','ba_bed'],{load:0,rub:0,rinse:1,done:1,dry:2,sleepy:3,sleep:3,night:3}[BA.stage]||0);
function baStart(){show('bath');ngMark();baRound();}
function baGeo(){const A=$('baArea'),W=A.clientWidth,H=A.clientHeight,land=W>=H;
  const tw=land?Math.min(W*.5,H*.72*IMG_AR.tub):Math.min(W*.86,H*.36*IMG_AR.tub),th=tw/IMG_AR.tub,tx=(W-tw)/2,ty=H-th-H*.03;
  const top=Math.max(90,H*.11),fz=Math.min(tw*.7,ty+th*.24-top),fx=W/2-fz/2,fy=ty+th*.24-fz;   // 친구 아래쪽만 욕조 거품에 살짝 묻혀요
  const sz=Math.min(fz*.55,land?H*.3:W*.3),sx=Math.min(W-sz-8,fx+fz*.78),sy=Math.max(top*.9,fy-sz*.55);
  return{W,H,land,tw,th,tx,ty,fz,fx,fy,sz,sx,sy,dz:tw*.17};}
function baRound(){if(S.screen!=='bath')return;busHush('ba');bgmHold('lullaby',false);baSponge(null,false);const g=++BA.gen,A=$('baArea'),G=baGeo();   // 문지르던 손가락은 놓아요
  Object.assign(BA,{G,stage:'load',last:Date.now(),lp:null,pid:null,st:0,kind:BA.round%2?'paint':'mud'});
  const ch=pick(friendPool(Math.floor(BA.round/2)%2===1,4,true).filter(c=>c!==BA.who))||CHARS[0];BA.who=ch;
  A.innerHTML=`<div class="bafloor" style="height:${G.H-(G.ty+G.th*.78)}px"></div>`;
  const src=ch.img||charSrc(ch),f=document.createElement('div');f.className='baf';f.id='baF';Object.assign(f.style,{left:G.fx+'px',top:G.fy+'px',width:G.fz+'px',height:G.fz+'px'});
  f.innerHTML=`<img src="${src}" alt=""><canvas></canvas>`;A.appendChild(f);
  const tub=document.createElement('img');tub.className='batub';tub.src='chars/tub.webp';tub.alt='';Object.assign(tub.style,{left:G.tx+'px',top:G.ty+'px',width:G.tw+'px',height:G.th+'px'});A.appendChild(tub);
  const dk=document.createElement('img');dk.className='baduck';dk.src='chars/duck.webp';dk.alt='';
  Object.assign(dk.style,{left:(G.tx+G.tw*.05)+'px',top:(G.ty-G.dz*.42)+'px',width:G.dz+'px',height:(G.dz/IMG_AR.duck)+'px'});
  dk.addEventListener('pointerdown',e=>{e.preventDefault();dk.classList.remove('hop');void dk.offsetWidth;dk.classList.add('hop');
    tone({f:1300,f2:1700,d:.09,v:.12,type:'square'});tone({f:1250,f2:1650,t:.13,d:.09,v:.1,type:'square'});});A.appendChild(dk);
  const sh=document.createElement('div');sh.className='bashow';sh.id='baShow';Object.assign(sh.style,{left:G.sx+'px',top:G.sy+'px',width:G.sz+'px',height:(G.sz/IMG_AR.shower)+'px'});
  sh.innerHTML='<img src="chars/shower.webp" alt="">';sh.addEventListener('pointerdown',e=>{e.preventDefault();baShower();});A.appendChild(sh);
  baProg();
  const cv=f.querySelector('canvas'),N=Math.round(Math.min(480,G.fz));cv.width=cv.height=N;BA.cv=cv;BA.cx=cv.getContext('2d',{willReadFrequently:true});BA.N=N;
  baMud(src,g).then(()=>{if(BA.gen!==g)return;BA.stage='rub';BA.last=Date.now();
    say(`${ga(ch.name)} ${BA.kind==='mud'?'진흙 놀이를':'물감 놀이를'} 했어요! 쓱쓱 문질러서 씻겨 줘요!`);});}
// 진흙(또는 물감) 점을 그린 다음, 친구 모양 안쪽에만 남겨요 (욕조 거품에 가려지는 아래쪽은 빼고)
async function baMud(src,g){let im=null;try{im=await loadImg(src);}catch(e){}if(BA.gen!==g)return;BA.im=im;const N=BA.N,x=BA.cx,mud=BA.kind==='mud';
  const m=document.createElement('canvas');m.width=m.height=N;const mx=m.getContext('2d');
  const cols=mud?['#8a5a2e','#7a4b22','#9c6b3c','#6e4320','#a0703f']:['#ff6b6b','#ffd93d','#4fc3f7','#6fd36f','#a77bf3','#ff8fc7','#ff9f43'];
  // 점이 친구 모양 밖에만 떨어지면 다시 뿌려요(세 번까지). 그림을 못 불러오면 둥근 모양 안에 뿌려요
  for(let tr=0;tr<3;tr++){x.globalCompositeOperation='source-over';x.clearRect(0,0,N,N);
    if(im)x.drawImage(im,0,0,N,N);else{x.fillStyle='#000';x.beginPath();x.ellipse(N/2,N*.42,N*.36,N*.4,0,0,6.283);x.fill();}
    mx.clearRect(0,0,N,N);
    for(let i=0;i<(mud?19:24);i++){const r=N*(.05+Math.random()*.06),cx=N*(.18+Math.random()*.64),cy=N*(.14+Math.random()*.42);mx.fillStyle=pick(cols);mx.beginPath();
      for(let k=0;k<6;k++){const a=Math.random()*6.283,d=r*.7*Math.random(),rr=r*(.45+Math.random()*.55),px=cx+Math.cos(a)*d,py=cy+Math.sin(a)*d;mx.moveTo(px+rr,py);mx.arc(px,py,rr,0,6.283);}
      mx.fill();if(mud&&Math.random()<.5){mx.beginPath();mx.moveTo(cx-r*.22,cy);mx.lineTo(cx+r*.22,cy);mx.lineTo(cx+r*.12,cy+r*1.3);mx.arc(cx,cy+r*1.3,r*.12,0,3.14);mx.fill();}}
    mx.clearRect(0,N*.62,N,N);
    x.globalCompositeOperation='source-in';x.drawImage(m,0,0);x.globalCompositeOperation='source-over';
    if(baCount()>=N*N*.002)break;}
  BA.cv.style.opacity=1;BA.init=Math.max(1,baCount());}
function baCount(){const N=BA.N,d=BA.cx.getImageData(0,0,N,Math.round(N*.64)).data;let c=0;for(let i=3;i<d.length;i+=16)if(d[i]>60)c++;return c;}
function baSponge(e,on){const s=$('sponge');if(!on||!BA.G||(BA.stage!=='rub'&&BA.stage!=='dry')){s.style.display='none';return;}
  const dry=BA.stage==='dry',z=BA.G.fz*(dry?.42:.34),ar=dry?IMG_AR.ba_towel:IMG_AR.sponge,k=dry?'t':'s';   // 닦을 때는 수건
  if(s.dataset.k!==k){s.dataset.k=k;s.src=dry?'chars/ba_towel.webp':'chars/sponge.webp';}
  Object.assign(s.style,{display:'block',width:z+'px',height:(z/ar)+'px',transform:`translate(${e.clientX-z/2}px,${e.clientY-z/ar*.48}px) rotate(-12deg)`});}
function baRub(e){if(BA.stage!=='rub'&&BA.stage!=='dry')return;const dry=BA.stage==='dry';const r=BA.cv.getBoundingClientRect(),N=BA.N,k=N/r.width,px=(e.clientX-r.left)*k,py=(e.clientY-r.top)*k,R=N*.085,x=BA.cx;
  if(px<-R||py<-R||px>N+R||py>N*.7+R){BA.lp=null;return;}
  const lp=BA.lp||{x:px,y:py};x.globalCompositeOperation='destination-out';x.lineCap='round';x.lineWidth=R*2;x.beginPath();x.moveTo(lp.x,lp.y);x.lineTo(px+.01,py);x.stroke();
  x.globalCompositeOperation='source-over';BA.dist+=Math.hypot(px-lp.x,py-lp.y)/k;BA.lp={x:px,y:py};
  if(BA.dist>34){BA.dist=0;if(!dry)baFoam(e.clientX,e.clientY);}
  const now=Date.now();if(now-BA.lastSnd>110){BA.lastSnd=now;noise({f:dry?900+Math.random()*300:2200+Math.random()*600,d:.09,v:dry?.06:.07,q:dry?.6:1.2});if(Math.random()<.25)dry?tone({f:1500,f2:1900,d:.06,v:.05}):sfx.bubble();}
  if(now-BA.chk>300){BA.chk=now;baCheck();}}
function baFoam(x,y){const A=$('baArea');if(A.querySelectorAll('.foam').length>24)return;const a=A.getBoundingClientRect();
  for(let i=0;i<1;i++){const s=BA.G.fz*(.04+Math.random()*.05),f=document.createElement('i');f.className='foam';f.addEventListener('animationend',e=>{if(e.animationName==='foamFade')f.remove();});
    f.style.cssText=`left:${x-a.left-s/2+(Math.random()-.5)*s*1.4}px;top:${y-a.top-s/2+(Math.random()-.5)*s*1.4}px;width:${s}px;height:${s}px`;A.appendChild(f);}}
function baCheck(){if(BA.stage!=='rub'&&BA.stage!=='dry')return;const left=baCount()/BA.init;
  if(left>.12)return;if(BA.stage==='dry'){baSleep();return;}
  BA.stage='rinse';baProg();BA.cv.style.transition='opacity .5s';BA.cv.style.opacity=0;sparkle();BA.last=Date.now();
  say('뽀득뽀득! 이제 샤워기를 톡 눌러서 거품을 씻어요!');$('baShow').classList.add('glow');}
const baA=$('baArea');
baA.addEventListener('pointerdown',e=>{if(S.screen!=='bath'||BA.pid!=null||e.target.closest('.bashow,.baduck'))return;e.preventDefault();
  if(BA.stage==='sleep'||BA.stage==='night'){baPat();return;}   // 잠자기: 어디를 눌러도 토닥토닥
  if(BA.stage!=='rub'&&BA.stage!=='dry'){if(e.target.closest('.baf')){const f=$('baF');f.classList.remove('giggle');void f.offsetWidth;f.classList.add('giggle');sfx.giggle();}return;}
  try{baA.setPointerCapture(e.pointerId);}catch(_){}BA.pid=e.pointerId;BA.lp=null;baSponge(e,true);baRub(e);});
baA.addEventListener('pointermove',e=>{if(BA.pid!==e.pointerId)return;baSponge(e,true);baRub(e);});
const baUp=e=>{if(BA.pid!==e.pointerId)return;BA.pid=null;BA.lp=null;baSponge(e,false);baCheck();};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>baA.addEventListener(t,baUp));
let baShT=0;
function baShower(){if(Date.now()-baShT<900||!BA.G)return;baShT=Date.now();BA.last=Date.now();const sh=$('baShow'),A=$('baArea'),G=BA.G,g=BA.gen;
  const r=sh.getBoundingClientRect(),a=A.getBoundingClientRect(),hx=r.left-a.left+r.width*.45,hy=r.top-a.top+r.height*.88,tx=G.fx+G.fz/2,ty=G.fy+G.fz*.45;
  sh.animate([{transform:'none'},{transform:'rotate(-8deg)'},{transform:'none'}],{duration:400});
  const rinse=BA.stage==='rinse',dur=rinse?2400:900;noise({f:3500,d:dur/1000,v:.12,q:.4,type:'highpass',out:busOut('ba')});
  const t0=Date.now(),iv=setInterval(()=>{if(BA.gen!==g||Date.now()-t0>dur){clearInterval(iv);return;}
    for(let i=0;i<4;i++){const d=document.createElement('i');d.className='wdrop';const sx=hx+(Math.random()-.5)*r.width*.5,ex=tx+(Math.random()-.5)*G.fz*.8,ey=ty+(Math.random()-.2)*G.fz*.5;
      d.style.cssText=`left:${sx}px;top:${hy}px;--dx:${ex-sx}px;--dy:${ey-hy}px;--d:${(.45+Math.random()*.25).toFixed(2)}s`;d.addEventListener('animationend',()=>d.remove());A.appendChild(d);}},60);
  if(!rinse){if(BA.stage==='rub'&&Date.now()-BA.noT>3000){BA.noT=Date.now();say('먼저 쓱쓱 문질러요!');}return;}
  BA.stage='done';sh.classList.remove('glow');
  [...A.querySelectorAll('.foam')].forEach((f,i)=>setTimeout(()=>{if(BA.gen!==g||S.screen!=='bath')return;f.classList.add('bye');setTimeout(()=>f.remove(),420);if(i%5===0)sfx.pop();},200+Math.random()*1900));
  setTimeout(()=>{if(BA.gen!==g)return;const f=$('baF');f.classList.add('giggle');const q=f.getBoundingClientRect();burst(q.left+q.width/2,q.top+q.height*.35,30,q.width*.6,true);sparkle();
    cheer('반짝반짝 깨끗해요!');say(`반짝반짝! ${ga(BA.who.name)} 깨끗해졌어요!`);sfx.fanfare();},2500);
  setTimeout(()=>baDry(g),5400);}
// 3단계: 몸이 젖었어요 → 수건으로 쓱쓱 닦기 (물방울을 다 닦으면 뽀송뽀송)
function baWet(){const N=BA.N,x=BA.cx,im=BA.im;x.globalCompositeOperation='source-over';x.clearRect(0,0,N,N);
  if(im)x.drawImage(im,0,0,N,N);else{x.fillStyle='#000';x.beginPath();x.ellipse(N/2,N*.42,N*.36,N*.4,0,0,6.283);x.fill();}
  const m=document.createElement('canvas');m.width=m.height=N;const mx=m.getContext('2d');
  for(let i=0;i<26;i++){const r=N*(.022+Math.random()*.024),cx=N*(.16+Math.random()*.68),cy=N*(.14+Math.random()*.44);
    mx.fillStyle='rgba(150,215,255,.72)';mx.strokeStyle='rgba(70,160,225,.75)';mx.lineWidth=Math.max(1,r*.16);mx.beginPath();   // 물방울 모양
    mx.moveTo(cx,cy-r*2);mx.quadraticCurveTo(cx+r*.35,cy-r*1.1,cx+r,cy);mx.arc(cx,cy,r,0,3.1416);mx.quadraticCurveTo(cx-r*.35,cy-r*1.1,cx,cy-r*2);mx.fill();mx.stroke();
    mx.fillStyle='rgba(255,255,255,.9)';mx.beginPath();mx.arc(cx-r*.35,cy-r*.25,r*.28,0,6.283);mx.fill();}
  mx.clearRect(0,N*.62,N,N);
  x.globalCompositeOperation='source-in';x.drawImage(m,0,0);x.globalCompositeOperation='source-over';
  BA.cv.style.transition='none';BA.cv.style.opacity=1;BA.init=Math.max(1,baCount());}
function baDry(g){if(BA.gen!==g||S.screen!=='bath')return;BA.stage='dry';baProg();BA.last=Date.now();baWet();
  const sh=$('baShow');sh.style.pointerEvents='none';sh.animate([{opacity:1},{opacity:0}],{duration:400,fill:'forwards'});
  const f=$('baF');f.classList.remove('giggle');void f.offsetWidth;f.classList.add('giggle');
  [0,1,2].forEach(i=>tone({f:1100-i*150,f2:600,t:i*.16,d:.1,v:.12}));   // 똑 똑 똑
  say('어머, 몸이 다 젖었어요! 수건으로 쓱쓱 닦아 줘요!');}
// 4단계: 밤이 되면 침대에 누워요 → 토닥토닥 세 번 → 자장가
function baSleep(){const g=BA.gen,A=$('baArea'),G=BA.G;BA.stage='sleepy';bgmHold('lullaby',true);baProg();BA.cv.style.transition='opacity .5s';BA.cv.style.opacity=0;
  $('sponge').style.display='none';sparkle();cheer('뽀송뽀송!');say('뽀송뽀송! 이제 코 자러 가요');
  setTimeout(()=>{if(BA.gen!==g||S.screen!=='bath')return;
    const n=document.createElement('div');n.className='banight';
    n.innerHTML='<i class="moon"></i>'+Array.from({length:16},(_,i)=>`<b style="left:${(4+Math.random()*92).toFixed(1)}%;top:${(4+Math.random()*(G.land?40:30)).toFixed(1)}%;font-size:${(1.8+Math.random()*2).toFixed(1)}vmin;animation-delay:-${(Math.random()*1.3).toFixed(2)}s">✦</b>`).join('');
    A.appendChild(n);
    [...A.querySelectorAll('.batub,.bashow,.baduck,.baf,.bafloor')].forEach(el=>{el.style.pointerEvents='none';el.animate([{opacity:1},{opacity:0}],{duration:600,fill:'forwards'});});
    const AR=IMG_AR.ba_bed,bw=G.land?Math.min(G.W*.46,G.H*.74*AR):Math.min(G.W*.84,G.H*.42*AR),bh=bw/AR,fz=bw*.46,b=document.createElement('div');b.className='babed';
    Object.assign(b.style,{left:(G.W-bw)/2+'px',top:(G.H-bh-G.H*.05)+'px',width:bw+'px',height:bh+'px'});
    b.innerHTML=`<img class="bd" src="chars/ba_bed.webp" alt=""><img class="who" src="${BA.who.img||charSrc(BA.who)}" alt="" style="left:${(bw-fz)/2}px;top:${bh*.12}px;width:${fz}px;height:${fz}px"><img class="bd fr" src="chars/ba_bed.webp" alt="">`;
    A.appendChild(b);BA.stage='sleep';BA.pat=0;BA.last=Date.now();
    tone({f:660,f2:440,d:.5,v:.1,a:.05});say(`${ga(BA.who.name)} 침대에 누웠어요. 토닥토닥 해 줘요!`);},1700);}
function baPat(){const b=document.querySelector('.babed'),w=b&&b.querySelector('.who');if(!w)return;BA.last=Date.now();const g=BA.gen,c=ctr(w);
  w.animate([{transform:'none'},{transform:'scale(1.05,.93)'},{transform:'none'}],{duration:450});heartBurst(c.x,c.y-c.h*.15);
  if(BA.stage!=='sleep'){bell(mtof(PENT[2+Math.floor(Math.random()*4)]),0,.08,.6);return;}
  const n=++BA.pat;bell(mtof(PENT[n+1]),0,.12,.7);
  if(n<3){say(n===1?'토닥토닥':'자장자장');return;}
  BA.stage='night';
  [0,1,2].forEach(i=>{const z=document.createElement('i');z.className='bazz';z.textContent='Z';
    z.style.cssText=`left:${parseFloat(w.style.left)+parseFloat(w.style.width)*.78}px;top:${parseFloat(w.style.top)-parseFloat(w.style.width)*.05}px;font-size:${(7-i*1.5)}vmin;animation-delay:${i}s`;b.appendChild(z);});
  say(`잘 자요, ${BA.who.name}!`);cheer('잘 자요!');
  setTimeout(()=>{if(BA.gen!==g)return;const t=baLullaby();
    setTimeout(()=>{if(BA.gen!==g||S.screen!=='bath')return;BA.round++;baRound();},t*1000+1800);},1300);}
// 자장가 (브람스 자장가 앞부분) — 놀이를 나가면 바로 꺼져요
function baLullaby(){const o=busOut('ba'),b=.46;let t=.05;
  [[76,.5],[76,.5],[79,2],[76,.5],[76,.5],[79,2],[76,.5],[79,.5],[84,1],[83,1.5],[81,.5],[81,1],[79,2]].forEach(([m,d])=>{const f=mtof(m);
    tone({f,t,d:d*b*1.7,v:.15,a:.03,out:o});tone({f:f*2,t,d:d*b*.7,v:.035,a:.03,out:o});t+=d*b;});
  [[48,0],[55,3],[48,6],[53,8.5],[48,10.5]].forEach(([m,k])=>tone({f:mtof(m),t:.05+k*b,d:b*2.6,v:.07,a:.05,out:o}));   // 낮은 소리 받침
  return t;}
setInterval(()=>{if(S.screen!=='bath'||BA.pid!=null||!BA.G||Date.now()-Math.max(lastTouch,BA.last)<6000)return;BA.last=Date.now();const G=BA.G;
  if(BA.stage==='rub'||BA.stage==='dry'){const y=G.fy+G.fz*.32,t=BA.stage==='dry';
    ghostHand(G.fx+G.fz*.25,y,G.fx+G.fz*.75,y+G.fz*.06,{src:t?'chars/ba_towel.webp':'chars/sponge.webp',w:G.fz*(t?.36:.3),h:G.fz*(t?.26:.26)});say(t?'수건으로 쓱쓱 닦아요!':'쓱쓱 문질러요!');}
  else if(BA.stage==='rinse'){const c=ctr($('baShow'));ghostHand(c.x-c.w,c.y+c.h*.4,c.x,c.y,null);say('샤워기를 톡 눌러요!');}
  else if(BA.stage==='sleep'){const w=document.querySelector('.babed .who');if(w){const c=ctr(w);ghostHand(c.x+c.w*.5,c.y+c.h*.3,c.x,c.y-c.h*.15,null);say('토닥토닥 해 줘요!');}}},1000);
$('goBath').onclick=()=>{sfx.tap();baStart();};
$('baBack').onclick=()=>{sfx.tap();BA.gen++;BA.pid=null;busHush('ba');$('sponge').style.display='none';show('home');};
